name: publish

# A pushed version tag packs that commit, waits until a maintainer approves the
# npm environment, then publishes exactly that package with trusted publishing.
# Started by hand with a tag, it only packs, so the package can be compared.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to pack without publishing
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event_name }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  pack:
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - name: The tag names the package version
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/public-release-smoke.test.js
      - name: Pack
        run: |
          mkdir package
          npm pack --ignore-scripts --pack-destination package
          shasum package/*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: pack
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm --version
      - run: npm publish ./sintbot-*.tgz --access public
