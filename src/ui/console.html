<script>/* 防 FOUC:首屏绘制前定主题与界面语言。
   主题:存过 light / dark 就用它;没存过 = 跟随系统(prefers-color-scheme),系统切换时页面跟着切(见脚本区 setTheme)。
   data-theme 始终是算好的 light / dark(样式只认它);data-theme-pref 记用户选的是 system / light / dark。
   语言:存过就按 localStorage,没存过跟随浏览器:zh* ⇒ 中文,其余 ⇒ 英文 */
(function(){var d=document.documentElement,t='',l='';try{t=localStorage.getItem('sbot-theme')||'';l=localStorage.getItem('sbot-lang')||'';}catch(e){}
var p=(t==='light'||t==='dark')?t:'system';if(p==='system'){t='light';try{if(matchMedia('(prefers-color-scheme: dark)').matches)t='dark';}catch(e){}}
d.dataset.themePref=p;d.dataset.theme=t;if(l!=='en'&&l!=='zh')l=/^zh/i.test((navigator.language||''))?'zh':'en';d.dataset.lang=l;d.lang=l;})()</script>

function mountPageActions(tab){
  const slot=document.getElementById('pSlot'); if(!slot)return;
  for(const old of slot.querySelectorAll('.pact[data-for="'+tab+'"]'))old.remove();
  const fresh=document.querySelector('#'+tab+'>.pact'); if(!fresh)return;
  fresh.dataset.for=tab; slot.append(fresh);
}

const pad2=n=>String(n).padStart(2,'0');
/* 活动行等时间戳统一按 bot 工作时区(S.time.offsetMin,默认北京)显示 —— 和页头时钟、
   群内时间口径一致;state 未加载时退回浏览器本地。 */
function fmtHM(ts){const ms=ts||Date.now(),t=S&&S.time;
  if(!t){const d=new Date(ms);return pad2(d.getHours())+':'+pad2(d.getMinutes());}
  const d=new Date(ms+t.offsetMin*60000);return pad2(d.getUTCHours())+':'+pad2(d.getUTCMinutes());}
// ∅ = 空轮(零产出,v0.11.24 起单列并自动重试一次)。漏了这一档时它走兜底分支、原样显示英文
// `empty 5.4s` —— 而空轮恰恰是最不该看起来像「一切正常」的那一档(见 v0.11.24 的由来)。
function statusLabel(s,ms){const sec=ms?(ms/1000).toFixed(1)+'s':'';return (({ok:'完成',error:'出错',stopped:'已中止','no-reply':'静默',failed:'失败',empty:'空轮'}[s])||s||'')+(sec?' '+sec:'');}
// 活动行的状态图标(Lucide):按状态种类给,颜色也按种类判 —— 别再从标签首字符抠
function statusIcon(k){return ({ok:IC.check,error:IC.x,failed:IC.x,stopped:IC.square,empty:IC.empty,'no-reply':'·'}[k])||'';}
function fmtTok(n){n=+n||0;return n>=1000?(n/1000).toFixed(1)+'k':String(n);}

async function api(path,method='GET',bodyObj){
  const caps=S&&S.runtimeCapabilities;
  if(caps&&!(caps.allowed[method]||[]).includes(path.split('?')[0]))throw new Error(caps.reason);
  const o={method,headers:{'X-Sbot-Token':TOKEN}};
  if(bodyObj){o.headers['Content-Type']='application/json';o.body=JSON.stringify(bodyObj);}
  const r=await fetch(path,o); const j=await r.json().catch(()=>({}));
  if(r.status===401){ if(TOKEN){dropToken();TOKEN='';} showLogin(); throw new Error('需要登录'); }
  // ⚠ 把状态码与整份响应体挂在 error 上:有些接口的「不 ok」是**要人确认一次**而不是失败
  //   (如换图标系统的 409,body 里带着「换完会怎样」那段话)。只留 message 的话,
  //   调用方就只能再发一次请求去把那段话要回来 —— 而那正是刚写过又删掉的那段笨代码。
  if(!r.ok){const err=new Error(j.error||('HTTP '+r.status));err.status=r.status;err.payload=j;throw err;}
  return j;
}
// Read a text/event-stream POST response chunk-by-chunk (fetch, not EventSource).
async function streamSSE(resp,onEvent){
  const reader=resp.body.getReader();const dec=new TextDecoder();let buf='';
  for(;;){const {done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});
    let i;while((i=buf.indexOf('\n\n'))>=0){const chunk=buf.slice(0,i);buf=buf.slice(i+2);
      let ev='message',data='';for(const line of chunk.split('\n')){if(line.startsWith('event:'))ev=line.slice(6).trim();else if(line.startsWith('data:'))data+=line.slice(5).trim();}
      if(data){try{onEvent(ev,JSON.parse(data));}catch(e){}}
    }
  }
}
let _toastTimer=null;
/* ── 说明气泡:接管原生 title ──────────────────────────────────────────
   原生 title 的悬停延迟约 1–1.5s,且**不可**用 CSS/JS 调 —— 那是浏览器/系统行为,想更快只能自绘。
   做法:hover 时把 title 摘下来暂存到 data-tip(不摘的话原生气泡会跟着一起冒出来,变成两个),
   延迟 TIP_DELAY 显示自绘气泡;移开/点击/滚动即隐藏并还原 title(还原是为了不破坏可访问性与
   「复制/查看元素」等外部依赖)。全局委托一次,不用改那 48 处 title 的写法。 */
const TIP_DELAY=600;   // 原生约 1000–1500ms;600ms = 明显更快,但仍留出「扫过 ≠ 想看」的判断余量
let _tipEl=null,_tipTimer=null,_tipHost=null;
function tipRestore(){ if(_tipHost&&_tipHost.dataset.tip!==undefined){_tipHost.setAttribute('title',_tipHost.dataset.tip);delete _tipHost.dataset.tip;} _tipHost=null; }
function tipHide(){ clearTimeout(_tipTimer); tipRestore(); if(_tipEl){_tipEl.classList.remove('on');_tipEl.style.display='none';} }
function tipShow(host,text){
  if(!_tipEl){_tipEl=document.createElement('div');_tipEl.className='tip';document.body.appendChild(_tipEl);}
  _tipEl.textContent=text; _tipEl.style.display='block'; _tipEl.classList.remove('on');
  const r=host.getBoundingClientRect(), t=_tipEl.getBoundingClientRect();  // 读布局 ⇒ 已强制重排
  let y=r.bottom+7; if(y+t.height>innerHeight-6) y=r.top-t.height-7;                   // 下方放不下就翻到上方
  y=Math.max(6,Math.min(y,innerHeight-t.height-6));                                    // 兜底再夹一次(上下都不越界)
  const x=Math.max(6,Math.min(r.left+r.width/2-t.width/2, innerWidth-t.width-6));      // 左右夹在视口内
  _tipEl.style.left=x+'px'; _tipEl.style.top=y+'px';
  // 同步加类(不用 rAF):上面读过 rect 已触发重排,过渡照样跑;而 rAF 在后台标签会被节流 ⇒ 气泡永不显形
  _tipEl.classList.add('on');
}
document.addEventListener('mouseover',(e)=>{
  const host=e.target.closest?e.target.closest('[title],[data-tip]'):null;
  if(host===_tipHost)return;
  tipHide();
  if(!host)return;
  const text=(host.getAttribute('title')||host.dataset.tip||'').trim();
  if(!text)return;
  _tipHost=host; host.dataset.tip=text; host.removeAttribute('title');   // 摘掉:否则原生气泡会重复冒出
  _tipTimer=setTimeout(()=>tipShow(host,text),TIP_DELAY);
});
document.addEventListener('mouseout',(e)=>{ if(_tipHost&&!_tipHost.contains(e.relatedTarget))tipHide(); });
document.addEventListener('mousedown',tipHide);        // 点下去就别挡着了
addEventListener('scroll',tipHide,true);
addEventListener('blur',tipHide);

function toast(msg,kind=''){msg=trText(msg);const t=$('#toast');clearTimeout(_toastTimer); // trText:见文末「界面语言」块
  if(kind==='err'){ // 错误:可选中 + 复制 + 手动关,不自动消失
    t.textContent='';
    const m=document.createElement('span');m.className='toast-msg';m.textContent=msg;
    const copy=document.createElement('button');copy.className='toast-btn';copy.textContent='复制';
    copy.onclick=()=>{const done=()=>{copy.textContent='已复制';setTimeout(()=>copy.textContent='复制',1200);};
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(msg).then(done).catch(()=>{const r=document.createRange();r.selectNodeContents(m);const s=getSelection();s.removeAllRanges();s.addRange(r);done();});
      else{const r=document.createRange();r.selectNodeContents(m);const s=getSelection();s.removeAllRanges();s.addRange(r);try{document.execCommand('copy');}catch(e){}done();}};
    const x=document.createElement('button');x.className='toast-btn';x.innerHTML=IC.x;x.onclick=()=>{t.className='err';};
    t.append(m,copy,x);t.className='show err persist';
  }else{t.textContent=msg;t.className='show '+kind;_toastTimer=setTimeout(()=>t.className=kind,2600);}}

function healthClass(h){return h.fails?'fail':h.warns?'warn':'ok';}
function healthText(h){return h.fails?`${h.fails} 失败 · ${h.warns} 警告`:h.warns?`${h.warns} 警告`:'全部正常';}
/* 概览的健康卡(持久处理流程那一版):全部正常时收成一行 —— 汇总胶囊 + 各项读数排成一句;点一下展开成检查行。
   有警告 / 失败时一直展开、不能收起(异常行必须看得见)。展开与否记在 localStorage,只在「全部正常」时起作用。 */
let healthUserOpen=false; try{healthUserOpen=localStorage.getItem('sbot-health-open')==='1';}catch(e){}
function healthAbnormal(h){return !!(h&&(h.fails||h.warns));}
function healthFoldOpen(h){return healthAbnormal(h)||healthUserOpen;}
function healthSumHtml(h){const conn=new Set(Object.values(CONN_LABEL)),rows=((h&&h.rows)||[]);   // 连接行排最前:会变的是它们,放不下被省略的应当是版本号
  return rows.filter(r=>conn.has(r.label)).concat(rows.filter(r=>!conn.has(r.label))).map(r=>`<span class="hfact"><span class="k">${esc(r.label)}</span> ${esc(r.detail)}</span>`).join('');}
function syncHealthFold(){
  const c=$('#ovHealth'); if(!c||!c.classList.contains('hcard')||!S||!S.health)return;
  const open=healthFoldOpen(S.health);
  c.classList.toggle('folded',!open); c.classList.toggle('locked',healthAbnormal(S.health));
  const b=$('#ovHealthFold'); if(b)b.setAttribute('aria-expanded',String(open));
  const sum=$('#ovHealthSum'); if(sum){const html=healthSumHtml(S.health); if(sum.dataset.sig!==html){sum.dataset.sig=html;sum.innerHTML=html;}}
}

/* ── overview ── */
// Full structure — rendered once on load / after an action (with the entrance

// 开始使用(1.0.12):安装向导不再问聊天平台和绑群,装完第一次打开控制台时在这里说接下来做什么;平台接上、群绑好就不显示
function startCardHtml(){
  const pl=S.platforms||{},anyPlat=!!(pl.feishu||pl.slack||pl.wecom);
  const anyGroup=(S.groups||[]).length>0;
  if(anyPlat&&anyGroup)return '';
  // 模型这一步按健康行「可用模型」判(能用的,不只是配了的:key 在服务环境里拿不到、试跑失败的都不算)
  const mrow=((S.health&&S.health.rows)||[]).find(r=>r.label==='可用模型');
  const anyModel=mrow?mrow.status!=='fail':(S.providers||[]).some(p=>p.configured&&!p.hidden);
  const step=(done,title,hint,tab,btn)=>`<div class="inline" style="gap:10px;margin:10px 0;align-items:flex-start"><span class="dot ${done?'ok':'warn'}" style="margin-top:6px;flex:none"></span><div style="flex:1;min-width:0"><div>${title}</div><div class="hint">${hint}</div></div>${!done&&tab?`<button class="btn" data-gotab="${tab}" style="flex:none">${btn}</button>`:''}</div>`;
  const sm=S.setupMode;
  // 持久处理流程 + 本机对话:不接聊天平台也是完整可用的安装。只在还没接平台时提示两件事,可以收起。
  if(S.runtimeCapabilities&&S.runtimeCapabilities.localChat){
    let hidden=false;try{hidden=localStorage.getItem('sbot-start-hide')==='1';}catch{}
    if(anyPlat||hidden)return '';
    const hasLocal=(S.groups||[]).some(g=>g.platform==='local');
    const row=(cls,title,hint,tab,btn)=>`<div class="inline" style="gap:10px;margin:10px 0;align-items:flex-start"><span class="dot ${cls}" style="margin-top:6px;flex:none"></span><div style="flex:1;min-width:0"><div>${title}</div><div class="hint">${hint}</div></div>${tab?`<button class="btn" data-gotab="${tab}" style="flex:none">${btn}</button>`:''}</div>`;
    return `<div class="card" id="ovStart" style="margin-bottom:8px"><div class="inline" style="justify-content:space-between"><div class="lbl" style="margin:0">开始使用</div><a class="lnk2" href="#" id="ovStartHide">不再显示</a></div>
      ${anyModel?'':row('warn','配好模型','还没有能用的模型:在「模型 · 库」里添加、测试','providers','去「模型 · 库」')}
      ${row(hasLocal?'ok':'warn','在「对话」里交代第一件事',hasLocal?'不用接聊天平台，在这台电脑上直接说':'新建一段本机对话，选一个项目目录就能开始','playground','去「对话」')}
      ${row('skip','接入飞书（可选）','接入后在手机上也能派活，还能把它拉进项目群。方法见「设置」里的飞书卡','settings','去「设置」')}
    </div>`;
  }
  return `<div class="card" id="ovStart" style="margin-bottom:16px"><div class="lbl">开始使用</div>
    ${step(anyModel,'配好模型',anyModel?'换模型、加模型在「模型 · 库」':'还没有能用的模型:在「模型 · 库」里添加、测试','providers','去「模型 · 库」')}
    ${step(anyPlat,'接聊天平台','飞书 / Slack / 企业微信,「设置」里每个平台都有分步指南','settings','去「设置」')}
    ${step(anyGroup,'绑一个群','把群绑到项目目录,一个群一个项目','groups','去「群 · 项目」')}
    ${step(false,'在群里 @ 机器人说一句话','不接平台也能先在「试跑」里跑一轮',null,'')}
    ${sm&&!anyPlat?`<div class="hint" style="margin-top:8px">${sm.supervised?'后台服务现在只开着控制台:平台接好、保存后,它会自动重启并连上(约 15 秒)。':'守护进程现在只开着控制台:接好平台后,在终端里按 Ctrl-C 再运行 sintbot start --ui 连上。'}</div>`:''}
  </div>`;
}

      <span class="tag prov" title="${(()=>{const pn=g.provider||S.defaultProvider;const pv=(S.providers||[]).find(p=>p.name===pn);const m=g.model||(pv&&pv.model);return '模型大脑:'+esc(pn)+(m?' · '+esc(m):'')+'(在「群·项目」页切换)';})()}">${esc(g.provider||S.defaultProvider)}</span>
      ${g.paused?'<span class="tag pz" title="已暂停(「群·项目」页可恢复)">'+IC.pause+' 暂停</span>':`<span class="tag glive" data-g="${esc(g.chatId)}" title="空闲">idle</span>`}
      <span class="meta" title="${esc(g.workdir)}">${esc(shortPath(g.workdir))}</span>
      ${liveOn&&!g.paused?`<button class="iconbtn sm" data-osay="${esc(g.chatId)}" title="${S.runtimeCapabilities?'向这个群插一句 —— 当前版本只在该群空闲时可用;这句话和回复都会发进群':'向这个群插一句 —— 空闲时马上处理;正在忙时,加入当前任务或排在它后面(看「忙时跟进」)'}" style="flex:none">${IC.say}</button>`:''}
      ${liveOn?`<button class="iconbtn sm" data-ostop="${esc(g.chatId)}" title="停止当前任务(保留会话)" style="flex:none">${IC.square}</button>
      <button class="iconbtn sm" data-onew="${esc(g.chatId)}" title="${S.runtimeCapabilities?'开新会话 — 仅在该群空闲、记录全部结账后可用;运行中请先停止,结束后再开(同群内 /new)':'开新会话 — 运行中会先中断当前任务并清空队列(同群内 /new)'}" style="flex:none">${IC.rotate}</button>`:''}</div>`).join('')
    :'<div class="empty">还没有群项目 · 去「群·项目」配置</div>';
  $('#overview').innerHTML=`${startCardHtml()}<div id="ovInboxWrap">${inboxHtml()}</div><div class="grid ${S.runtimeCapabilities?'':'cols2'} stagger">
    <div class="card${S.runtimeCapabilities?` hcard${healthFoldOpen(h)?'':' folded'}${healthAbnormal(h)?' locked':''}`:''}" id="ovHealth">${S.runtimeCapabilities
      ?`<button type="button" class="hfold" id="ovHealthFold" aria-controls="ovHrows" aria-expanded="${healthFoldOpen(h)}" title="展开或收起健康检查"><span class="lbl">健康</span><span class="hsum" id="ovHealthSum">${healthSumHtml(h)}</span>
      <span class="hpill ${healthClass(h)}" id="ovHealthPill"><span class="led"></span><span id="ovHealthTxt">${healthText(h)}</span></span><span class="hcaret">${IC.chevronDown}</span></button>`
      :`<div class="chead"><div class="lbl">健康</div>
      <span class="hpill ${healthClass(h)}" id="ovHealthPill"><span class="led"></span><span id="ovHealthTxt">${healthText(h)}</span></span></div>`}
      <div class="hrows" id="ovHrows">${h.rows.map(r=>`<div class="hrow" data-hk="${esc(r.label)}"><span class="dot ${r.status}"></span>
        <span class="k">${esc(r.label)}</span><span class="v" title="${esc(r.detail)}">${esc(r.detail)}</span></div>`).join('')}</div>
    </div>
    ${S.runtimeCapabilities?'':`<div class="grid" style="gap:16px">
      <div class="card">
        <div class="inline" style="justify-content:space-between;align-items:baseline">
          <span class="lbl" style="margin:0">并发</span>
          <span class="mono" style="color:var(--dim);font-size:12px">活动 <b id="ovActive" style="color:var(--ink);font-size:16px;font-weight:600">0</b>${cap>0?`<span class="faint"> / ${cap}</span>`:'<span class="faint"> · 无上限</span>'}<span style="margin-left:15px">队列 <b id="ovQueue" style="color:var(--ink);font-weight:600">0</b></span></span>
        </div>
        ${cap>0?`<div class="gauge" id="ovGauge" style="margin-top:13px">${segs}</div>`:''}
      </div>
      <div class="card ovgroups"><div class="lbl">群 · 项目</div>${gRows}</div>
    </div>`}
  </div>
  ${S.runtimeCapabilities?'<div id="liveActivity"></div>':`<h2 class="sec">实时活动</h2><div class="card" id="ovActivity">${activityHtml()}</div>`}
  ${issuesHtml()}
  ${previewsHtml()}
  ${leftoversHtml()}`;
  lastActSig='';
  {const hf=$('#ovHealthFold'); if(hf)hf.onclick=()=>{if(healthAbnormal(S.health))return;   // 有异常时不收
    healthUserOpen=!healthUserOpen; try{localStorage.setItem('sbot-health-open',healthUserOpen?'1':'0');}catch(e){} syncHealthFold();};}
  bindActivityClicks();
  if(S.runtimeCapabilities&&typeof activityPanel!=='undefined')activityPanel.mount();
  bindInbox();
  // 插话:入口挂在「群·项目」每一行的 ✎ 上 —— 动作长在对象身上,目标群由那一行决定,不必再选。
  $$('#overview [data-osay]').forEach(b=>b.onclick=()=>openSay(b.dataset.osay));
  // 反馈本:标记已处理 / 放回未处理。备注会跟着发回原群 —— 提的人看到的是「修好了什么」,
  // 不是一句冷冰冰的「已处理」,所以这里问一句而不是直接标掉。
  $$('#overview [data-isclose]').forEach(b=>b.onclick=async()=>{
    const note=prompt('标记为已处理。写一句说明(会发回原群告诉提的人,可留空):','');
    if(note===null)return; // 取消
    try{const r=await api('/api/issues/status','POST',{id:+b.dataset.isclose,op:'close',note});
      const told=r.issueNotified;delete r.issueNotified;S=r; // 瞬态字段,读完即删(别进状态签名)
      toast(told?'已标记并告知群里':'已标记(群里未通知)','ok');renderOverview();}catch(e){toast(e.message,'err');}});
  $$('#overview [data-isreopen]').forEach(b=>b.onclick=async()=>{
    try{const r=await api('/api/issues/status','POST',{id:+b.dataset.isreopen,op:'reopen'});S=r;toast('已放回未处理','ok');renderOverview();}catch(e){toast(e.message,'err');}});
  // 预览服务:停止按钮(后端会顺带在群里告知 —— 群成员可能正开着那个链接)
  $$('#overview [data-pvstop]').forEach(b=>b.onclick=async()=>{
    const nm=b.dataset.pvname||'该预览';
    if(!confirm(`停止预览「${nm}」?群成员正在打开的页面会失效(群里会收到一条告知)。`))return;
    try{const r=await api('/api/previews/stop','POST',{id:b.dataset.pvstop});S=r;toast('已停止预览','ok');renderOverview();}catch(e){toast(e.message,'err');}});
  // 后台进程:结束一个 / 全部结束。先 confirm —— 偶尔也有 agent 故意留下的东西(比如起着看的 dev server),
  // 杀不杀是人的判断;后端还会不走缓存重验一遍名单,这里只把页面上看到的 pid 原样带过去。
  const lvKill=async(pids,what)=>{
    if(!confirm(`结束${what}?它会被立刻终止(先温和请求退出,不理会再强制结束)。`))return;
    try{const r=await api('/api/leftovers/kill','POST',{pids});S=r;toast('已结束','ok');renderOverview();}catch(e){toast(e.message,'err');}};
  $$('#overview [data-lvkill]').forEach(b=>b.onclick=()=>lvKill([+b.dataset.lvkill],`这个后台进程(${b.dataset.lvage||''}前起的)`));
  $$('#overview [data-lvkillall]').forEach(b=>b.onclick=()=>{const rows=(S.leftovers&&S.leftovers.rows)||[];if(rows.length)lvKill(rows.map(r=>r.pid),`全部 ${rows.length} 个后台进程`);});
  $$('#overview [data-ostop]').forEach(b=>b.onclick=async()=>{
    try{const r=await api('/api/groups/stop','POST',{chatId:b.dataset.ostop});toast(S.runtimeCapabilities?(r.ok?'已请求停止，等待结束确认':'当前没有可停止的运行任务'):(r.ok?'已停止当前任务':'没有正在运行的任务'),'ok');}catch(e){toast(e.message,'err');}});
  $$('#overview [data-onew]').forEach(b=>b.onclick=async()=>{
    const lv=S.live&&S.live.groups&&S.live.groups[b.dataset.onew];
    // 持久处理流程里停止要等结账确认,不能当场接着重置会话:忙时由服务端照实拒绝,不弹「中断并开新」。
    if(!S.runtimeCapabilities&&lv&&lv.busy&&!confirm('该群任务运行中 — 中断当前任务、清空队列并开新会话?'))return;
    try{const r=await api('/api/groups/interrupt','POST',{chatId:b.dataset.onew});toast(r.wasBusy?'已中断并开新会话':'已开新会话','ok');}catch(e){toast(e.message,'err');}});
  updateOverviewLive();
}
// 预览服务(sbot preview):**只在有运行中的预览时出现** —— 平时不占概览版面,有监听在跑时
// 一眼看见。这一区存在的理由:v0.8.1 那个 agent 私装的静态服务在局域网上挂了一周才被人肉发现。
/* 群内反馈本:群里 /issue 提的问题。⚠ 正文是**群成员输入**的,每一处都必须走 esc()。

/* ⚠ 产品时区(S.time.offsetMin),与活动流 fmtHM 同源 —— 浏览器本地时区是另一把钟:
   开发机浏览器在美东、产品口径是北京,用它显示反馈时间会差 12 小时(「两把钟」坑)。 */
function fmtWhen(ts){try{const t=S&&S.time;const p=n=>String(n).padStart(2,'0');
  if(!t){const d=new Date(ts);return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
  const d=new Date(ts+t.offsetMin*60000);
  return `${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`;}catch{return '';}}
function previewsHtml(){
  const ps=S.previews||[];

      <span class="name" title="${esc(p.label)}　${esc(p.entry)}">${esc(p.label)}</span>
      <span class="tag" title="端口(按群固定分配)">:${p.port}</span>
      ${p.projectRoot?'<span class="tag warn" title="正在服务整个项目目录 —— 全部代码都在局域网上可读,建议只服务原型子目录">'+IC.warn+' 整个项目目录</span>':''}
      <span class="meta" title="群:${esc(p.name)}　${p.single?'只服务这一个文件':'服务整个目录'}:${esc(p.served)}">${esc(p.name)} · ${esc(p.served)}${p.single?'':'/'}</span>
      <span class="mono faint" style="flex:none" title="已运行 ${fmtDur(p.upMs)}${p.lastReqMs==null?'　· 尚无访问':'　· 最后访问 '+fmtDur(p.lastReqMs)+'前'}${p.idleLeftMs==null?'　· 未设闲置回收':'　· 闲置回收剩 '+fmtDur(p.idleLeftMs)}">${fmtDur(p.upMs)} · ${p.reqCount}次${p.idleLeftMs==null?'':' · 剩'+fmtDur(p.idleLeftMs)}</span>
      <a class="iconbtn sm" href="${esc(p.url)}" target="_blank" rel="noopener" title="在浏览器打开 ${esc(p.url)}" style="flex:none;text-decoration:none">${IC.ext}</a>
      <button class="iconbtn sm" data-pvstop="${esc(p.id)}" data-pvname="${esc(p.label)}" title="停止这个预览(群里会收到告知)" style="flex:none">${IC.square}</button>
    </div>`).join('');
  return `<h2 class="sec" id="ovPreviews">预览服务</h2><div class="card ovgroups">${rows}
    <div class="hint" style="margin-top:8px">群里让它起的局域网原型预览 · 闲置到点自动停并在群里告知 · HTTP 明文,仅可信内网</div></div>`;
}
/* 后台进程(v0.11.108):agent 在对话轮次里用后台方式起的 shell,轮次结束后没跟着退、还在跑。
   **只在有的时候出现** —— 平时不占版面(与预览服务同款)。这一区存在的理由:一条每 5 秒打线上接口的

// 群名:活动事件只带 chatId 尾 8 位,这里按配置换成人认得的名字(群已解绑就退回尾号)
function groupNameOf(chatId,fallback){const g=((S&&S.groups)||[]).find(x=>x.chatId===chatId);return (g&&g.name)||fallback||String(chatId||'').slice(-8);}
// 「需要你处理」(汇总逻辑在 src/ui/dashboard.js):没事就不出现,有事放在概览最上面。

function inboxHtml(){
  const items=(S&&S.inbox)||[];
  if(!items.length) return '';
  const go=(id,tip)=>`<button class="iconbtn sm" data-ibgo="${id}" title="${tip}" style="flex:none">${IC.down}</button>`;

function updateOverviewLive(){

  if(!S.runtimeCapabilities)activity.forEach(a=>{if(a.status==='running'&&Date.now()-(a.runAt||0)>8000){const e=Object.entries(live.groups||{}).find(x=>x[0].slice(-8)===a.group);if(e&&!e[1].busy)a.status='✓';}});

/* ── 自动刷新(2026-07-30 真机反馈:「数据不能自动刷新,得手点右上角」)──
   SSE 心跳只带 {live, conn} ⇒ 只有并发格/群忙闲/实时活动是活的;健康卡、群卡标签、
   预览服务区、设置页全靠整页拉取。实测 /api/state 首次 90ms、之后 1ms(版本探针有缓存)
   ⇒ 定时全量刷新几乎零成本,当初不做是设计疏漏而非性能取舍。
   三条纪律,防「刷新把人正在做的事冲掉」:
     ① 页面不可见(切到别的标签页/最小化)不刷 —— 省得白跑,回来时立刻补一次;
     ② 正在操作时不刷:模态框开着 / 焦点在输入控件里 / 正在拖拽排序;
     ③ 只有内容真变了才重渲染(签名比对)—— 否则每次无谓重画会打断 hover、
        折叠态与滚动位置。签名故意剔掉 live/conn/time(它们本就走心跳,进签名会每帧变)。*/
const AUTO_REFRESH_MS=60000;
let autoTimer=null,lastStateSig=null;
/* 签名要反映**屏幕上显示的东西**,不是原始毫秒:previews 的 upMs/lastReqMs/idleLeftMs 每次拉取
   都在变,直接进签名 ⇒ 只要有预览在跑就每次必重画,「变了才画」形同失效(hover/滚动被反复
   打断)。而这些数字是用 fmtDur 按**分钟**显示的 ⇒ 折成分钟后,签名恰好在显示文字会变时才变。
   live/conn/time 整块剔掉(它们走 3s 心跳,进签名会每帧变)。 */
function stateSig(s){try{
  const {live,conn,time,previews,inbox,...rest}=s||{};
  const pv=(previews||[]).map(p=>[p.id,p.port,p.label,p.serveRoot,p.projectRoot,p.reqCount,
    Math.round((p.upMs||0)/60000),p.lastReqMs==null?null:Math.round(p.lastReqMs/60000),
    p.idleLeftMs==null?null:Math.round(p.idleLeftMs/60000)]);
  const ib=(inbox||[]).map(i=>[i.key,i.count||0]); // 时间戳每次刷新都在走(进程年龄、预览时长),只签身份
  return JSON.stringify([rest,pv,ib]);
}catch{return null;}}

/* ── 卡片拖拽排序引擎(模型 / 群项目共用) ──
   交互:抓 ⠿ 拖起整卡(原位变虚线占位,拖影 = 整卡快照);拖动掠过其他卡即
   实时让位,被挤开的卡以 FLIP 平滑滑到新位置 — 让位后拖卡恰好落在指针下,
   布局自稳定;滑动中的卡不参与命中(防振荡)。松手即提交所见顺序(所见即
   所得);保存失败自动回滚归位。尊重 prefers-reduced-motion。
   ⚠ 教训:不要用环境信号做逻辑门槛 — computed transform 会被 stagger 入场
   动画(fill:both)污染成 matrix 而永拦让位;dragend 的 dropEffect 判取消也
   不可靠。改为自维护的 SLIDING 集合 + 一律提交。 */
const REDUCED_MOTION=matchMedia('(prefers-reduced-motion:reduce)').matches;
const SLIDING=new WeakSet();  // flipMove 滑动中的元素(自维护,替代读 computed transform)
function flipMove(grid,mutate){
  const items=[...grid.children];
  const first=items.map(el=>[el,el.getBoundingClientRect()]);  // 含飞行中 transform → 可中断续接
  mutate();
  // 清 stagger 入场动画(fill:both 会压过 inline transform)+ 清旧 transform 量真实终位
  for(const [el] of first){el.style.animation='none';el.style.transition='none';el.style.transform='';}
  const delta=first.map(([el,f])=>{const l=el.getBoundingClientRect();return [el,f.left-l.left,f.top-l.top];});
  for(const [el,dx,dy] of delta){
    if((dx||dy)&&!REDUCED_MOTION)el.style.transform=`translate(${dx}px,${dy}px)`;  // invert:先钉回视觉原位
    else el.style.transition='';
  }
  if(REDUCED_MOTION)return;
  void grid.offsetWidth;  // 落定 invert 帧
  for(const [el,dx,dy] of delta)if(dx||dy){
    el.style.transition='transform .28s cubic-bezier(.2,.72,.28,1.02)';
    el.style.transform='';  // play:滑向新位置
    SLIDING.add(el);
    const done=()=>{el.style.transition='';SLIDING.delete(el);};
    el.addEventListener('transitionend',done,{once:true});
    setTimeout(done,360);  // transitioncancel / 事件丢失兜底
  }
}
function makeSortable(grid,{item,key,save}){
  if(!grid)return;
  let drag=null,startOrder=null,cool=0;
  const cards=()=>[...grid.querySelectorAll(item)];
  const restore=order=>{const byKey=new Map(cards().map(c=>[key(c),c]));
    flipMove(grid,()=>{for(const k of order){const c=byKey.get(k);if(c)grid.appendChild(c);}});};
  const allowDrop=e=>{if(drag){e.preventDefault();e.dataTransfer.dropEffect='move';}};  // 页面任意处松手=提交
  grid.addEventListener('dragover',e=>{
    if(!drag)return;e.preventDefault();e.dataTransfer.dropEffect='move';
    const t=e.target.closest(item);
    if(!t||t===drag||!grid.contains(t))return;
    if(SLIDING.has(t))return;  // 目标还在滑动中,等落位再让(防振荡)
    const now=Date.now();if(now-cool<100)return;cool=now;
    const kids=cards(),di=kids.indexOf(drag),ti=kids.indexOf(t);
    if(di<0||ti<0)return;
    flipMove(grid,()=>grid.insertBefore(drag,di<ti?t.nextSibling:t));
  });
  grid.addEventListener('drop',e=>e.preventDefault());
  for(const c of cards()){
    const h=c.querySelector('.drag');if(!h)continue;
    h.addEventListener('dragstart',e=>{
      drag=c;startOrder=cards().map(key);
      const r=c.getBoundingClientRect();
      e.dataTransfer.setDragImage(c,e.clientX-r.left,e.clientY-r.top);  // 拖影 = 整卡而非把手
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('application/x-sbot-sort',key(c));  // 自定义类型:满足 Firefox 启动条件,且 textarea 不会吞文本
      document.addEventListener('dragover',allowDrop);document.addEventListener('drop',allowDrop);
      setTimeout(()=>c.classList.add('dragging'));  // 下一帧再变占位,拖影快照保持原样
    });
    h.addEventListener('dragend',async()=>{
      document.removeEventListener('dragover',allowDrop);document.removeEventListener('drop',allowDrop);
      c.classList.remove('dragging');drag=null;
      const order=cards().map(key);
      if(order.join()===startOrder.join())return;  // 没动(含 Esc 后浏览器自身取消),不保存
      try{const r=await save(order);S=r;toast('顺序已保存'+runtimeChangeNote(r&&r.providerChange),'ok');}
      catch(err){restore(startOrder);toast(err.message,'err');}
    });
  }
}

          <div class="inline" style="gap:6px"><button class="btn ghost" id="styleRescan" title="重新扫描风格预设(导入或改过自定义风格后用)">重新扫描</button><button class="btn" id="styleNew" title="用一张表单配一套自己的风格:色板、圆角、字重逐项定,右侧实时看效果。存进库后全部群都能用">＋ 新建风格</button></div>

    </details>
    <details class="library-fold" id="iconLibFold"${iconLibFoldOpen?' open':''}>
      <summary><span class="caret">${IC.chevronRight}</span><span>图标库</span><span class="hint" style="font-size:11px;font-weight:400">按需查看</span></summary>
      <div class="library-fold-content">
        <div class="hint lead">与设计风格<b>平级</b>:风格管怎么画(颜色/字体/圆角/描边),图标库管图形从哪来、叫什么名 · 一个项目分别选,在「群·项目」页那个群的「图标」行</div>
        <div id="iconLib"><span class="spin"></span></div>
      </div>
    </details>`;
  mountPageActions('providers');
  // 风格库按需展开再加载与绘制,默认折叠以降低存在感;页内重绘时保留用户刚才的展开状态。
  const styleFold=$('#styleLibFold');
  if(styleFold){
    styleFold.addEventListener('toggle',()=>{styleLibFoldOpen=styleFold.open;if(styleFold.open)loadStyleLib();});
    if(styleFold.open)loadStyleLib();
  }
  const iconFold=$('#iconLibFold');
  if(iconFold){
    iconFold.addEventListener('toggle',()=>{iconLibFoldOpen=iconFold.open;if(iconFold.open)loadIconLib();});
    if(iconFold.open)loadIconLib();
  }
  $('#styleRescan').onclick=async()=>{styleLib=null;$('#styleLib').innerHTML='<span class="spin"></span>';await loadStyleLib();toast('风格库已重新扫描','ok');};
  $('#styleNew').onclick=()=>openStyleModal(null);
  if($('#showAll'))$('#showAll').onclick=()=>{showAll=!showAll;renderProviders();};
  $('#addModel').onclick=()=>openProviderModal(null);
  if(runtimeAllows('POST','/api/providers/order'))makeSortable($('#pgrid'),{item:'.pcard',key:c=>c.dataset.prov,save:o=>api('/api/providers/order','POST',{order:o})});
  $$('#pgrid .pcard').forEach(card=>{
    const name=card.dataset.prov, slot=$('.reply-slot',card);
    card.addEventListener('click',async e=>{
      const b=e.target.closest('button[data-act]'); if(!b)return;
      if(b.dataset.act==='edit'){openProviderModal(name);return;}
      if(b.dataset.act==='usage'){
        const cx=b.dataset.cx==='1', row=b.closest('.kv'), vv=row&&$('.vv',row);
        b.disabled=true;const old=b.innerHTML;b.innerHTML='<span class="spin"></span>';
        try{
          let text=null;
          if(cx){const r=await api('/api/codex/verify','POST',{force:true});const lg=r.login||{};text=fmtUsage(r.usage);
            /* 探测失败(fmtUsage 给空串)时保住原来的额度:这一行的 DOM 留着旧值,内存态却清空的话,
               下次重画整行会凭空消失 —— 同一份状态两个消费者,漏一个就自相矛盾。 */
            codexStatus[name]={loggedIn:lg.loggedIn,mode:lg.mode,dead:lg.dead,verified:lg.verified,text:lg.text,usageText:text||(lg.dead?'':((codexStatus[name]||{}).usageText||'')),envWarnings:cxEnvWarn(r,name)};}
          else{const r=await api('/api/usage/refresh','POST',{name});if(r.usage){usage[name]=r.usage;text=r.usage.value;}}
          /* 就地改这一行,不走 renderProviders —— 整页重画会把这颗按钮连同它的 finally 一起换掉,
             还会打断 hover 与试跑回执。拉不到时**留着旧值**:清空会被读成「这个模型没额度」。 */
          if(text&&vv)vv.textContent=text;
          toast(text?'额度已更新 · '+text:'暂时取不到额度,显示的仍是上一次的值',text?'ok':'err');
        }catch(e){toast(e.message,'err');}
        finally{b.disabled=false;b.innerHTML=old;}
        return;
      }
      if(b.dataset.act==='test'){
        b.disabled=true;const old=b.innerHTML;b.innerHTML='<span class="spin"></span>测试中';slot.innerHTML='';
        try{const r=await api('/api/test','POST',{provider:name});
          slot.innerHTML=`<div class="reply ${r.ok?'':'err'}">${r.ok?esc(r.reply)+`\n\n<span class='faint'>— ${esc(r.model)} · ${r.ms}ms</span>`:IC.x+' '+esc(r.error)}</div>`;
          toast(r.ok?name+' 测试通过':name+' 测试失败',r.ok?'ok':'err');
        }catch(err){slot.innerHTML=`<div class="reply err">${IC.x} ${esc(err.message)}</div>`;toast(err.message,'err');}
        finally{b.disabled=false;b.innerHTML=old;}
      }
    });
  });
  // 插件库(Claude Code + codex MCP,住「模型」页底):两套 MCP 各一子卡 —— Claude Code(~/.claude.json,
  // `claude mcp add --scope user`)与 Codex(~/.codex/config.toml,`codex mcp add`,官方
  // developers.openai.com/codex/mcp)。/api/plugins/exec 是操作台开放终端,两卡共用执行/刷新;
  // codex 卡仅在配了 codex provider 时出现。不参与上方模型卡的拖动排序。
  // min-width:0 关键:grid 子项默认 min-width:auto,长命令(npx …)会撑大 min-content 破坏 1fr 1fr → 两卡不等宽。
  const libSection=(id,tag,cls,cfg,arr,ph,help,gated)=>`
    <div class="card" style="min-width:0">
      <div class="inline" style="justify-content:space-between;margin-bottom:9px">
        <span class="cli-tag ${cls}" style="flex:none">${tag}</span>
        <span class="hint" style="white-space:nowrap"><code>${cfg}</code> · ${arr.length}</span></div>
      ${arr.length?arr.map(m=>`<div class="kv" style="min-width:0"><span class="kk mono" style="flex:none">${esc(m.name)}</span><span class="vv" title="${esc(m.detail)}">${esc(m.detail||'MCP')}</span>${reachChip(m.reach)}</div>`).join(''):`<div class="hint" style="padding:3px 0">暂无 · 用下方命令添加</div>`}
      ${arr.some(m=>m.reach&&m.reach.status==='down')?`<div class="hint" style="margin-top:7px;color:var(--warn)">${gated?'有连不上的:多半是它依附的服务当前没在跑。<b>勾选过插件的群</b>那一轮会直接跳过不加载、服务起来后自动恢复;<b>没配过插件、按默认加载的群不会跳过</b>,每轮都替它付一次启动失败 —— 那类群去群卡保存一次勾选。':'有连不上的:多半是它依附的服务当前没在跑。这一套<b>全局加载、没有按群门控</b>,连不上会在每一轮里重试失败 —— 服务起不来就先从这里移除。'}</div>`:''}
      <div class="inline" style="gap:6px;margin-top:11px">
        <input id="${id}In" placeholder="${esc(ph)}" style="flex:1;min-width:0"/>
        <button class="btn" id="${id}Btn" style="white-space:nowrap;flex:none">添加</button></div>
      <div id="${id}Out" style="display:none;margin-top:6px"></div>
      <div class="hint" style="margin-top:7px">${help}</div>
    </div>`;
  const runLibCmd=async(id)=>{
    const inp=$('#'+id+'In'),btn=$('#'+id+'Btn'),out=$('#'+id+'Out');
    const cmd=inp.value.trim();if(!cmd){toast('先输入命令','err');return;}
    btn.disabled=true;btn.innerHTML='<span class="spin"></span>';
    try{const rr=await api('/api/plugins/exec','POST',{command:cmd});
      out.style.display='block';out.innerHTML='<div class="reply '+(rr.ok?'':'err')+'" style="max-height:180px;overflow:auto">'+esc(rr.output)+'</div>';
      toast(rr.ok?'已执行':'执行失败(看输出)',rr.ok?'ok':'err');
      if(rr.ok){inp.value='';libRefresh();}
    }catch(e){toast(e.message,'err');}
    finally{if(document.body.contains(btn)){btn.disabled=false;btn.textContent='添加';}}};
  const libRefresh=()=>api('/api/plugins').then(r=>{
    const el=$('#plugLib');if(!el)return;
    const hasCodex=((S&&S.providers)||[]).some(p=>p.runner==='codex');
    const claudeSec=libSection('libClaude','Claude Code CLI','claude','~/.claude.json',(r.global&&r.global.mcp)||[],
      'claude mcp add --scope user 名 -- npx -y 包','装后到群卡「插件」<b>按群勾选</b>启用',true);
    const codexSec=hasCodex?libSection('libCodex','Codex CLI','codex','~/.codex/config.toml',(r.codex&&r.codex.mcp)||[],
      'codex mcp add 名 -- npx -y 包','<b>全局</b>对所有 codex 群生效(无按群门控)',false):'';
    // 两套 MCP 左右并排(cols2,窄屏自动堆叠);只有 Claude 时单卡限宽。
    el.innerHTML=codexSec?`<div class="grid cols2" style="gap:16px">${claudeSec}${codexSec}</div>`:`<div style="max-width:560px">${claudeSec}</div>`;
    for(const id of ['libClaude','libCodex']){const inp=$('#'+id+'In'),btn=$('#'+id+'Btn');if(!inp||!btn)continue;inp.onkeydown=e=>{if(e.key==='Enter')btn.click();};btn.onclick=()=>runLibCmd(id);}
  }).catch(e=>{const el=$('#plugLib');if(el)el.innerHTML='<div class="reply err">'+IC.x+' '+esc(e.message)+'</div>';});
  libRefresh();
}

// unified add / edit model panel (⚙ on a card = edit; 添加模型 = add)
function openProviderModal(name,opts){
  opts=opts||{};
  const p=name?S.providers.find(x=>x.name===name):null, edit=!!p;
  // Codex CLI backend: 无 baseUrl / 无 key / 无 claude 思考深度,订阅登录。
  // 新建时由预设决定(选「GPT via Codex」⇒ 面板整个换形态,靠下面 apply() 里重开一次实现)——
  // 这些字段的**有无**是结构性的,不是显隐,拿 CSS 藏不干净。
  const isCodex=(edit&&p.runner==='codex')||(!edit&&!!opts.codex);
  const cxKey=edit?name:'codex'; // 登录态/额度是**机器级**的,新建时也能验(缓存键先用预设名)
  // Claude 订阅登录:不填端点、不填 key 就是它的正确形态(认证走本机 `claude auth login`)。
  // 官方 API key 按量计费明确不做(产品决定)⇒ 这两个字段对它只会误导,整块不显示。
  const isClaudeLogin=edit&&!isCodex&&!p.baseUrl;
  // ⚠ option 必须写 value:没有 value 时 select.value 读的是**显示文本**,而下面拿它当 PRESETS[key]
  //    查表 —— 界面语言一切成英文,选项文本变了,预设联动就整个失效(逻辑不许依赖显示文本)。
  const preset=edit?'':`<div class="field"><label class="f">预设(自动填端点/模型/调优)</label><select id="amPreset">${Object.keys(PRESETS).map(k=>`<option value="${esc(k)}" ${opts.preset===k?'selected':''}>${esc(k)}</option>`).join('')}</select></div>`;
  const keyPh=edit?(p.keyStatus==='set'?'已设置 · 留空保持':p.keyStatus==='env'?'env:'+esc(p.keyRef)+' · 留空保持':'粘贴 key'):'粘贴 key(存进本地 gitignored 配置)';
  const codexNote=isCodex?'<div class="hint" style="margin-bottom:12px">使用本机 ChatGPT 订阅登录，额度与本机 Codex 共享。</div>':'';
  // Durable hosts: model and thinking depth are chosen per group (group card / /model);
  // only a third-party endpoint keeps its model here as connection configuration.
  const perGroup=!!S.runtimeCapabilities;
  const showModelSec=!edit||!perGroup||(!isCodex&&!isClaudeLogin);
  $('#modal').innerHTML=`<h3>${edit?'配置 '+esc(name):'添加模型'}</h3>
    ${preset}
    ${codexNote}
    ${showModelSec?`<h4 class="sec">${perGroup?'名称与型号':'型号与推理'}</h4>`:''}
    ${edit?'':'<div class="field"><label class="f" for="amName">名称</label><input id="amName" placeholder="如 glm / my-model"/></div>'}
    ${perGroup?`<div class="hint" style="margin-bottom:12px">型号与思考深度按群在「群·项目」里选${(isCodex||isClaudeLogin)?'':'；这个端点的型号在下面填，各群共用'}。</div>`:''}
    ${isCodex&&perGroup?'':isCodex?`<div class="field"><label class="f">模型 model</label>
      <select id="amModelSel"><option value="${edit?esc(p.model):''}" selected>${edit&&p.model?esc(p.model):'(未设 — 用 codex 默认)'}</option></select>
      <input id="amModel" value="${edit?esc(p.model):''}" placeholder="如 gpt-5.6-sol" style="display:none;margin-top:8px"/>
      <div class="hint" id="amModelSrc" style="margin-top:4px">加载模型列表…</div></div>`
    :isClaudeLogin&&perGroup?'':isClaudeLogin?`<div class="field" id="clModelWrap"><label class="f">模型 model</label>
      <div class="hint">检测登录中…</div></div>`
    :`<div class="field"><label class="f">模型 model</label><input id="amModel" value="${edit?esc(p.model):''}" placeholder="如 glm-5.2[1m]"/></div>`}
    ${isCodex&&!perGroup?`<div class="field"><label class="f">推理强度</label><select id="amRE">${RE_CODEX.concat(edit&&p.reasoningEffort&&!RE_CODEX.includes(p.reasoningEffort)?[p.reasoningEffort]:[]).map(v=>`<option value="${v}" ${edit&&v===(p.reasoningEffort||'')?'selected':''}>${v||'默认(模型内置)'}</option>`).join('')}</select>
      <div class="hint" style="margin-top:4px">默认沿用模型推荐强度；更高强度通常需要更多时间和额度。</div></div>`:''}
    ${isCodex||perGroup?'':`<div class="field"><label class="f">思考深度</label><select id="amEff">${EFFORTS.map(v=>`<option value="${v}" ${edit&&v===p.effort?'selected':''}>${v||'默认'}</option>`).join('')}</select>
      <div class="hint" style="margin-top:5px">默认沿用模型推荐强度；更高强度通常需要更多时间和额度。</div></div>`}
    <h4 class="sec">上下文与压缩</h4>
    <details class="field"><summary class="hint" style="cursor:pointer">容量与运行信息</summary><div class="dim" id="amWindow" style="padding:9px 0">${edit?esc(providerWindowText(p,true)):'添加后按模型目录或会话上报显示'}</div></details>
    ${isCodex?`<div class="field"><label class="f" for="amContextMode">上下文窗口</label><select id="amContextMode"><option value="default" ${!edit||!p.contextWindowTokens?'selected':''}>执行器默认</option><option value="custom" ${edit&&p.contextWindowTokens>0?'selected':''}>自定义</option></select></div>
      <div class="field" id="amContextField"><label class="f" for="amContext">窗口大小(token)</label><input id="amContext" type="number" min="100000" max="1050000" step="1" value="${edit?(p.contextWindowTokens||500000):500000}"/>
      <div class="hint" id="amContextMax" style="margin-top:5px">${edit&&p.contextWindowMax?esc((langOf()==='en'?'Catalog limit: ':'目录上限：')+fmtContextTokens(p.contextWindowMax)):'自定义值不能超过执行器支持的上限，超出已知上限无法保存。'}</div></div>`:''}
    <div class="field"><label class="f" for="amCompMode">自动压缩</label><select id="amCompMode"><option value="default" ${!edit||!p.autocompactTokens?'selected':''}>执行器默认</option><option value="custom" ${edit&&p.autocompactTokens>0?'selected':''}>自定义</option></select></div>
    <div class="field" id="amCompField"><label class="f" for="amComp">${isCodex?'压缩阈值(token)':'压缩窗口(token)'}</label><input id="amComp" type="number" min="100000" max="1000000" step="1" value="${edit?(p.autocompactTokens||400000):400000}"/>
      <div class="hint" style="margin-top:5px">${isCodex?'自定义阈值为 10万–100万。Codex 可能按当前窗口提前压缩。':'自定义压缩窗口为 10万–100万。Claude Code 会预留空间，可能提前压缩。'}</div></div>
    <div class="hint" style="margin-bottom:14px">默认沿用执行器配置；自定义从下轮生效，保留当前会话。</div>
    <h4 class="sec">连接与登录</h4>
    ${(isCodex||isClaudeLogin)?'':`<div class="field"><label class="f">端点 baseUrl</label><input id="amBase" value="${edit?esc(p.baseUrl):''}" placeholder="https://.../anthropic"/></div>`}
    ${(isCodex||isClaudeLogin)?'':`<div class="field"><label class="f">API key</label><input id="amKey" placeholder="${keyPh}"/></div>`}
    ${isClaudeLogin?`<div class="field"><label class="f">Claude 订阅登录</label>
      <div id="clStatus" class="statbox">${clStatusHtml()}</div>
      <button class="btn" id="clVerify" style="margin-top:8px">检测登录</button>
      <div class="hint" style="margin-top:6px">检查本机 Claude Code 登录状态，不发起模型对话。</div></div>`:''}
    ${isCodex?`<div class="field"><label class="f">Codex 订阅登录 / 额度</label>
      <div id="cxStatus" class="statbox">${cxStatusHtml(cxKey)}</div>
      <button class="btn" id="cxVerify" style="margin-top:8px">验证登录 / 刷新额度</button>
      <div class="hint" style="margin-top:6px">显示本机账号返回的额度与重置时间，不发起模型对话。</div></div>`:''}
    ${(isCodex||isClaudeLogin)?'':`<div class="inline" style="margin:2px 0 2px"><input type="checkbox" class="switch" id="amVision" ${edit&&p.vision===false?'checked':''}/> <span class="dim">此模型不支持识图(纯文本模型)</span></div>
      <div class="hint" style="margin:0 0 10px">勾选后,送给它的图片(群里发的图、网页截图、读取的图片文件)会自动降级成一句占位文本 —— 不勾则整轮会被模型以「只支持文本输入」打断。拿不准就先跑一轮试:报这个错就回来勾上。</div>`}
    ${edit?`<div class="inline" style="margin:2px 0 10px"><input type="checkbox" class="switch" id="amHide" ${p.hidden?'checked':''}/> <span class="dim">在列表中隐藏此模型</span></div>`:''}
    <div class="mfoot" style="justify-content:space-between">
      ${edit?'<button class="btn ghost" id="amDel">移除</button>':'<span></span>'}
      <div class="inline"><button class="btn" id="amCancel">取消</button><button class="btn primary" id="amSave">${edit?'保存':'添加'}</button></div></div>`;
  $('#modalBg').classList.add('show');
  $('#modal').oninput=null;$('#modal').onchange=null;
  const syncMode=(id,field)=>{$('#'+field).hidden=$('#'+id).value!=='custom';};
  $('#amCompMode').onchange=()=>syncMode('amCompMode','amCompField');$('#amCompMode').onchange();
  if(isCodex){$('#amContextMode').onchange=()=>syncMode('amContextMode','amContextField');$('#amContextMode').onchange();}
  if(edit){
    const refreshWindow=()=>{const sel=$('#amModelSel'),input=$('#amModel');const selected=sel&&sel.value!=='__custom__'?sel.value:input?.value?.trim();
      const box=$('#amWindow');if(box)box.textContent=selected===(p.model||'')?providerWindowText(p,true):'新型号保存后刷新';
      const maximum=$('#amContextMax');if(maximum)maximum.textContent=selected===(p.model||'')&&p.contextWindowMax?(langOf()==='en'?'Catalog limit: ':'目录上限：')+fmtContextTokens(p.contextWindowMax):(langOf()==='en'?'The selected model limit will be checked on save.':'保存时核对所选型号的上限。');};
    $('#modal').oninput=e=>{if(e.target.id==='amModel'||e.target.id==='amModelSel')refreshWindow();};
    $('#modal').onchange=e=>{if(e.target.id==='amModel'||e.target.id==='amModelSel')refreshWindow();};
  }
  if(!edit){const apply=()=>{const key=$('#amPreset').value,pr=PRESETS[key]||{};
    // ⚠ codex 形态是**结构性**的(没有端点/key/思考深度,多出模型下拉与订阅额度),
    //   靠显隐凑不出来 ⇒ 切换时原地重开一次面板,把选中的预设带过去。

    const $b=$('#amBase'),$m=$('#amModel');
    if(pr.name)$('#amName').value=pr.name;if(pr.baseUrl&&$b){$b.value=pr.baseUrl;if($m)$m.value=pr.model||'';}

/* ── 风格图标 ────────────────────────────────────────────────────────────────
   服务端(src/design.js swatchLayout)算好的图元表 → SVG。这里**只做 rect → <rect> 的机械映射**:
   群里那张 PNG 走的是同一份 layout,一旦在这儿自己算坐标,两端就会各画各的 —— 而「控制台的图标
   和群里发出去的不一样」这种不一致,用户根本不会当成 bug 报上来。
   rx 要在这里 clamp:SVG 规范把 rx 收到 width/2、ry 收到 height/2 ⇒ 胶囊哨兵(9999)在宽扁的
   按钮上会渲成椭圆,而光栅器给的是两端半圆。取 min(r, w/2, h/2) 才和 PNG 一致。 */
let SWG=0; /* 渐变 id 计数:一页上会有十几张风格图,defs 的 id 重了后面那张会去用前面那张的渐变 */
function swatchSvg(lay,w,style){
  if(!lay||!lay.rects)return'';
  const h=Math.round(w*lay.h/lay.w);
  /* 渐变(v0.11.22):图元多带一个 grad 就画成线性渐变。角度公式与光栅那侧**同一个向量**
     (CSS 口径:0deg 自下而上、90deg 自左向右)—— 各写一份就会出现「控制台朝右下、群里朝右上」。 */
  let defs='';
  const fillOf=r=>{
    if(!r.grad)return esc(r.fill);
    const id='swg'+(++SWG),a=(Number(r.grad.angle)||0)*Math.PI/180,dx=Math.sin(a),dy=-Math.cos(a);
    defs+=`<linearGradient id="${id}" x1="${(.5-dx/2).toFixed(3)}" y1="${(.5-dy/2).toFixed(3)}" x2="${(.5+dx/2).toFixed(3)}" y2="${(.5+dy/2).toFixed(3)}">`
      +`<stop offset="0" stop-color="${esc(r.fill)}"/><stop offset="1" stop-color="${esc(r.grad.to)}"/></linearGradient>`;
    return `url(#${id})`;
  };
  const body=lay.rects.map(r=>{const rr=Math.min(r.r,r.w/2,r.h/2);const f=fillOf(r);
    return `<rect x="${r.x.toFixed(2)}" y="${r.y.toFixed(2)}" width="${r.w.toFixed(2)}" height="${r.h.toFixed(2)}"${rr>0?` rx="${rr.toFixed(2)}"`:''} fill="${f}"/>`;}).join('');
  return `<svg viewBox="0 0 ${lay.w} ${lay.h}" width="${w}" height="${h}" aria-hidden="true" style="display:block;flex:none;${style||''}">`
    +(defs?`<defs>${defs}</defs>`:'')+body+'</svg>';
}
/* 群卡「图标」行那排缩略图。⚠ **异步填充**:群卡是同步渲染的,先留空位、拉回来再填 ——
   把整块渲染卡在一个网络请求上,换来的是每次刷新群卡都要闪一下。
   ⚠ 同一份 svg 在两处按不同尺寸画(库里 22px / 群卡 18px):尺寸由外层格子定,svg 撑满它。 */
async function paintGroupIconStrips(){
  const slots=$$('#groups [data-sysstrip]'); if(!slots.length)return;
  const lib=await ensureIconLib();
  const by={}; for(const s of ((lib&&lib.systems)||[]))by[s.system]=s;
  for(const el of slots){
    const s=by[el.dataset.sysstrip];
    // 取不到就如实说,不留空排 —— 空排会被读成「这套系统没有图标」
    if(!s||!s.icons||!s.icons.length){el.innerHTML='<span class="hint" style="font-size:11px">样张取不到</span>';continue;}
    /* 按生效形态取样张。⚠ **「要实心但这套没有实心」必须当场说破**:那时真正取到的是线性
       (iconStyleGap 说的就是这条),界面若跟着声明画一排线性还标着「实心」,就成了
       「声明与事实不符」——本项目最贵的一类 bug,而且这行本来是用来看「现在长什么样」的。 */
    const wantFilled=el.dataset.sysstyle==='filled';
    const hasFilled=!!(s.filled&&s.filled.length);
    const use=wantFilled&&hasFilled?s.filled:s.icons;
    el.innerHTML=(wantFilled&&!hasFilled?'<span class="chip warn" style="flex:none" title="风格档/图标档声明的是实心,但这套系统没有实心目录 —— 实际取到的是下面这排线性图">这套没有实心</span>':'')
      +use.map(i=>`<span title="${esc(i.sem+' → '+i.name)}" style="flex:none;width:18px;height:18px">${i.svg}</span>`).join('');
  }
  const box=$('#groups'); if(box)fitStrips(box);
}
/* 风格库(只读):内置预设 + ~/.sbot/design-styles 自定义。走独立 API 而不是塞进 /api/state ——

/* 图标库(只读):代码里预先整理好的两套系统,**不开放自定义**(2026-08-25 拍板)。
   ⭐ 与设计风格库**平级** —— 它回答的是「图形从哪来、叫什么名」,风格回答「怎么画它」;
   一个项目分别选,换风格不该把图标一起换掉。
   ⚠ 每套配 8 个**真实渲染**的图标做样张:挑哪套是「认不认得出」的判断,断言判不了,

   ⚠ 图标包不随产品分发(四套合计约 160MB) ⇒ 没装的如实标「未安装」,不留空白(空白会被读成「这套是空的」)。*/
let iconLib=null;
let iconLibFoldOpen=false;
/* 取一次就缓存。⚠ 样张是**系统的属性、不是项目的属性** ⇒ 它不进 /api/state 那条 15s 心跳:
   塞进去就是每个绑定群每次心跳多读 8 个 svg、多背几 KB,而这份数据全部群共用同一套。
   群卡「图标」行那排缩略图因此也走这里,前端按系统名对上 —— 同一份数据两处用,服务端零额外开销。*/
async function ensureIconLib(){
  if(iconLib)return iconLib;
  try{iconLib=await api('/api/design/icons');}catch(e){iconLib=null;}
  return iconLib;
}
async function loadIconLib(){
  const box=$('#iconLib'); if(!box)return;

  /* 一排样张:左边一个窄标签说这排是什么形态,右边是图 + 它在这套系统里的名字。
     名字必须跟着图走 —— 「换一套系统连叫法都变了」是这张卡最该传达的一件事,
     而只看图看不出 house / home 的区别。 */
  /* 一排样张:标签独立成行 + 图标**定宽格子**平铺。
     ⚠ 定宽是「按卡片宽度自适应」的前提 —— 格子等宽,能摆几个才算得出来;图标名因此从格子里
     撤掉(名字宽度各不相同,留着就没法算),改成行下面那句「叫法」,一行说清两套的差别。
     实际画几个由 fitStrips() 在**布局之后**按真实宽度决定(见下),这里先全画出来。 */
  const CELL=22, GAP=13;
  const strip=(label,icons,note)=>`
    <div style="margin-top:11px;min-width:0">
      <div class="hint" style="font-size:11px;opacity:.6;margin-bottom:6px">${label}</div>
      ${icons.length
        ? `<div class="iconstrip inline" data-cell="${CELL}" data-gap="${GAP}" style="gap:${GAP}px;flex-wrap:nowrap;overflow:hidden;color:var(--ink);min-width:0">${icons.map(i=>
            `<span title="${esc(i.sem+' → '+i.name)}" style="flex:none;width:${CELL}px;height:${CELL}px">${i.svg}</span>`).join('')}</div>`
        : `<span class="hint faint" style="font-size:11px">${note}</span>`}
    </div>`;
  /* 叫法那一句:同一个语义在两套系统里叫什么。**这是「换一套等于换一整套名字」的证据**,
     从格子里撤掉名字后由它承担。只挑差得最明显的三个,多了就成噪音。 */
  const naming=s=>{const pick=['more','home','delete'].map(k=>(s.icons.find(i=>i.sem===k)||{}).name).filter(Boolean);
    return pick.length?`<div class="hint faint" style="margin-top:9px;font-size:11px">叫法:${pick.map(esc).join(' · ')}</div>`:'';};
  const card=s=>`
    <div class="card" style="min-width:0">
      <div class="inline" style="gap:8px;align-items:baseline;flex-wrap:wrap">
        <span style="font-size:13px;font-weight:600">${esc(s.label)}</span>
        ${s.installed?`<span class="hint" style="font-size:11px">${s.count?esc(String(s.count))+' 个图标 · ':''}语义名 ${s.semantics} 条${s.fallbackLibrary?' · 兜底 '+esc((iconLib.systems.find(x=>x.library===s.fallbackLibrary)||{}).label||s.fallbackLibrary):''}</span>`
          :'<span class="chip warn" title="这套的图标包没装在这台机器上(几个包合计约 160MB,不随产品分发)—— 别的功能不受影响,但选了它取图标会取不到。装一次即可">未安装</span>'}
      </div>
      ${s.installed
        ? strip('线性',s.icons,'')+strip('实心',s.styles.includes('filled')?s.filled:[],'这套没有实心 —— 要实心得选另一套')+naming(s)
        : `<div class="hint faint" style="margin-top:10px;font-size:11px">装上 ${esc(s.pkg)} 后这里会出样张</div>`}
    </div>`;
  box.innerHTML=`<div class="grid cols2 stagger">${(iconLib.systems||[]).map(card).join('')}</div>`
    +`<div class="hint faint" style="margin-top:8px">每套的画法<b>逐个都不一样</b>,连叫法都不同(同一个「更多」:more-horizontal / dots / dots-three)—— 换一套是换一整套图形和名字,不是换个皮肤。已选的那套写在项目里,跟着代码走</div>`;

/* 一行画几个图标 —— **按卡片实际宽度算,不写死个数**。
   ⚠ 只能在布局之后量:innerHTML 刚写完时 clientWidth 是最终值(同步布局),但窗口一变、
   侧边一收,同一张卡的宽度就变了 ⇒ 必须挂 ResizeObserver 跟着重算,否则窄屏下这排图会被
   `overflow:hidden` 齐刷刷切掉半个图标(比少画几个难看得多)。
   ⚠ 同一张卡的线性排与实心排取**同一个 n**:两排是要逐列对照看的,各算各的就错位了。 */
function fitStrips(box){
  // ⚠ **观察这一排本身,不是外面的卡片** —— 实测:把容器压窄时,这一排从 306px 掉到 53px,
  //   而挂在卡片上的 ResizeObserver **一次都没触发**(卡片宽度没变,变的是排内可用空间)。
  //   判据挂错对象的表现是「窄屏下图标被 overflow:hidden 切掉半个」,而那比少画几个难看得多。
  const calc=(s)=>{
    const w=s.clientWidth; if(!w)return; // 页面还没显示时宽度为 0:先不动,等 RO 拿到真实宽度再算
    // 格子尺寸**每排自带**:图标库那张卡 22px,群卡缩到 18px —— 写死一个常量必然有一处算错
    const CELL=+(s.dataset.cell||22), GAP=+(s.dataset.gap||13);
    const n=Math.max(1,Math.floor((w+GAP)/(CELL+GAP))); // 最后一个格子后面不占 gap
    [...s.children].forEach((el,i)=>{el.style.display=i<n?'':'none';});
  };
  const strips=[...box.querySelectorAll('.iconstrip')];
  strips.forEach(calc);
  // ⚠ **不能只靠 ResizeObserver**:实测这页上它连初次回调都不给(卡片 454→206、这一排 279→58,
  //   两个 RO 各 0 次)。⇒ 关键时刻**确定性地重算一次**:刚画完时页面可能还没显示(宽度为 0),
  //   下一帧再补一次;切页与改窗口大小各再算一次。RO 留着当锦上添花,不当依靠。
  requestAnimationFrame(() => strips.forEach(calc))
  if(window.ResizeObserver){
    const ro=new ResizeObserver(es=>{for(const e of es)calc(e.target);});
    strips.forEach(s=>ro.observe(s));
    if(box._iconRO)box._iconRO.disconnect(); // 重画时把上一批观察者收掉,别越攒越多
    box._iconRO=ro;
  }
  if(!window._iconFitBound){ // 只绑一次:每次重画都绑会越攒越多
    window._iconFitBound=1
    let t=0
    addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(refitAllStrips,120)})
  }
}
// 全部样张排重算一次。切页 / 改窗口大小 / 数据到齐后各调一次 —— 这三处正是「刚画的时候宽度还不对」
// 的全部来源,而宽度不对的表现是被 overflow:hidden 切掉半个图标。
function refitAllStrips(){for(const id of ['#iconLib','#groups']){const b=$(id);if(b)fitStrips(b);}}
/* 风格库(只读):内置预设 + ~/.sbot/design-styles 自定义。 */
let styleLib=null;
let styleLibFoldOpen=false;
async function loadStyleLib(){
  const box=$('#styleLib'); if(!box)return;
  if(styleLib){paintStyleLib();return;}
  try{const _r=await api('/api/design/styles');styleLib=_r;registerStyleI18n(_r.styles);paintStyleLib();}

/* 风格的英文名与一句话写在各自的风格档里(name_en / description_en),这里登记进翻译表 ——
   卡片照旧按中文渲染,英文界面由那套 MutationObserver 逐节点换掉,切回中文也是同一条路。
   「适合 · 内容阅读 · 品牌门面」那行按 · 分段逐段译,场景词的译文在 I18N_EN 里。 */
function registerStyleI18n(list){
  for(const s of list||[]){
    if(s.name&&s.nameEn&&s.name!==s.nameEn)I18N_MAP.set(s.name,s.nameEn);
    if(s.description&&s.descriptionEn&&s.description!==s.descriptionEn)I18N_MAP.set(s.description,s.descriptionEn);
  }
}
/* 启动后在后台登记一次:群卡上的项目风格名多半照抄自内置预设,英文界面里也要换掉 —— 不能等人点开「模型 · 库」才登记。
   只登记一次(styleLib 已有就跳过);取不到就算了,风格库那页打开时还会再取。 */
let styleI18nAsked=false;
function preloadStyleI18n(){
  if(styleI18nAsked||styleLib)return; styleI18nAsked=true;
  api('/api/design/styles').then(r=>{if(!styleLib)styleLib=r;registerStyleI18n(r.styles);if(langOf()==='en')applyI18n(document.body);}).catch(()=>{styleI18nAsked=false;});
}
function paintStyleLib(){
  const box=$('#styleLib'); if(!box||!styleLib)return;

  // 8 张卡有 6 张挂同一个标签就成噪音了(常态不用说,例外才值得标)。
  const feat=s=>[s.source==='user'?'<span class="tag">自定义</span>':'',
    /* 载体单独一枚驼色标(v0.11.22):它不是「特征」而是**分类** —— 标了就说明这套只服务
       那种载体,是挑档时第一眼要看的东西。绝大多数风格不标(通用),所以它一出现就有信息量。 */
    s.platform?`<span class="chip tan" title="这套风格是按这个载体定的(小程序与后台网站的圆角、间距、字号本就不该一样)">${esc(s.platform)}</span>`:'',
    s.dark?'<span class="chip cap" title="底色为深色">深色</span>':'',
    s.serif?`<span class="chip cap" title="${esc(s.fontStack||'')}">衬线</span>`:'',
    s.mono?'<span class="chip cap" title="字体族里有等宽(代码/数据)">等宽</span>':'',
    /* ⚠ 只标**不走常规那一路**的那几套(裁决在服务端 cjkState 三态,别在这儿判)——
       那个词的权威在 design.js 的 CJK_KIND_RE,前端抄一份必然漂移。常规那路是压倒性
       常态:18 张卡 12 张,标了就违反上面那条「常态不用说」,还把该看见的 6 张淹掉。
       第三态「未声明」是给自建档留的防线:v0.11.65 曾把它与「走黑体」合成同一个不标。 */
    s.cjkState==='exception'?`<span class="chip cap" title="这套风格的汉字不走黑体那条常规路(混用时按出现顺序列出)· 没有这枚标签 = 走系统黑体">中文${esc((s.cjkKinds||[]).join('·'))}</span>`
      :s.cjkState==='missing'?`<span class="chip cap" title="这份档写了字体,但栈里一个中文族都没有 —— 汉字会掉到浏览器默认字体,不受这套风格控制(纯英文产品可忽略)">中文未声明</span>`:'',
    s.radius>=100?'<span class="chip cap">胶囊圆角</span>':(s.radius>0?`<span class="chip cap">圆角 ${s.radius}px</span>`:''),
    /* ⚠ 这里**故意不标图标库**(2026-08-25 拿掉了 v0.11.52 那枚 chip):图标库与设计风格
       **平级** —— 用哪套图标是**项目**的选择(见下面「图标库」那一节 + 群卡的「图标」行),
       不是这份风格档的属性。在风格卡上标「图标 tabler」会让人以为换风格就换图标,
       而那正是要拆开的绑定。风格只管**怎么画**图标,那是下面这枚描边标签。 */
    s.icons&&s.icons.strokeWidth?`<span class="chip cap" title="${esc('这套风格里图标的画法:'+(s.icons.style==='filled'?'实心':'线性')+' · 描边 '+s.icons.strokeWidth+' · 端点 '+(s.icons.linecap||'round')+(s.icons.sizes?' · 尺寸档 '+s.icons.sizes+' 个':'')+'。图形从哪来是另一件事,由项目的图标系统决定')}">图标描边 ${esc(String(s.icons.strokeWidth))}</span>`:''].filter(Boolean).join('');
  const card=s=>{const ft=feat(s);return `
    <div class="card" style="min-width:0" data-slug="${esc(s.slug)}">
      <div class="inline" style="gap:14px;align-items:flex-start">
        ${swatchSvg(s.layout,106)}
        <div style="min-width:0;flex:1">
          <div class="inline" style="gap:7px;align-items:baseline;flex-wrap:wrap">
            <span style="font-size:13px;font-weight:600">${esc(s.name||s.slug)}</span>${ft}</div>
          <div class="hint" style="margin-top:5px">${esc(s.description||'—')}</div>
          ${s.suits?`<div class="hint" style="margin-top:5px;opacity:.8">适合 · ${esc(s.suits)}</div>`:''}
          <div class="inline" style="gap:4px;flex-wrap:wrap;margin-top:9px">${(s.palette||[]).map(c=>
            `<span title="${esc(c.key)}: ${esc(c.hex)}" style="width:13px;height:13px;border-radius:3px;background:${esc(c.hex)};box-shadow:inset 0 0 0 1px var(--line);flex:none"></span>`).join('')}</div>
          <div class="inline" style="gap:6px;flex-wrap:wrap;margin-top:10px">
            ${s.source==='user'?`<button class="btn primary" data-styleedit="${esc(s.slug)}" title="改这一套本身(存回同一个名字)—— 正文默认原样保留,除非你勾「按新设定重写正文」">修改</button>`:''}
            <button class="btn" data-styledup="${esc(s.slug)}" title="以这一套为起点建一个**新的**:色板、圆角、字重都预填好,改成自己的即可(原来那套不动)">复制为新款</button>
            ${s.source==='user'?`<button class="btn ghost" data-styledel="${esc(s.slug)}" title="从风格库移除这一套(只删自己建的)">删除</button>`:''}
          </div>
        </div></div>
    </div>`;};
  /* 自定义排最前,并与内置预设**分成两块** —— 库里内置十几种,自己建的那两三套按字母混在
     中间就得逐个找,而它们恰恰是最常用的。次序由服务端 listStyles 定(同一份也管 CLI 那侧的
     组内先后),这里只按 source 切块,前端不自己排。
     ⚠ 分组标题只在**有**自定义时才出现:一套都没有时,孤零零一个「内置预设」标题是纯噪音
     —— 与上面特征标签同一条判据:常态不用说,例外才值得标。 */
  const all=styleLib.styles||[];
  const mine=all.filter(s=>s.source==='user'),stock=all.filter(s=>s.source!=='user');
  const grid=arr=>`<div class="grid cols2 stagger">${arr.map(card).join('')}</div>`;
  const head=(label,n,note,top)=>`<div class="inline" style="gap:9px;align-items:baseline;margin:${top}px 0 8px">
      <span style="font-size:13px;font-weight:600;color:var(--ink)">${label}</span>
      <span class="hint">${n} 套${note?' · '+note:''}</span></div>`;
  const body=!all.length?'<div class="empty">风格库是空的</div>'
    :!mine.length?grid(stock)
    :head('自定义',mine.length,'这台机器上配的 · 全部群都能用',0)+grid(mine)+head('内置预设',stock.length,'',26)+grid(stock);
  box.innerHTML=body+`
    <div class="hint faint" style="margin-top:8px">「${IC.plus} 新建风格」配一套自己的(比如把公司品牌色配成一款)· 已经在某个项目里打磨好的那份,可在「群·项目」页那个群的「设计风格」行收录进来</div>`;
  /* 卡片动作走事件委托:整块会被「重新扫描 / 保存 / 删除」反复重画,逐个 onclick 绑定
     每次都要重来一遍,而委托只绑一次在容器上(容器本身不重建)。 */
  box.onclick=async(e)=>{
    /* 修改 = 改这一套本身(存回同一个 slug);复制为新款 = 拿它当起点建**另**一套。
       两者预填数据同源,差别全在 openStyleModal 的模式上。 */
    const ed=e.target.closest('[data-styleedit]');
    if(ed){const s=(styleLib.styles||[]).find(x=>x.slug===ed.dataset.styleedit);if(s)openStyleModal(s.form||null,{edit:s});return;}
    const dup=e.target.closest('[data-styledup]');
    if(dup){const s=(styleLib.styles||[]).find(x=>x.slug===dup.dataset.styledup);if(s)openStyleModal(s.form||null,{from:s});return;}
    const del=e.target.closest('[data-styledel]');
    if(!del)return;
    const slug=del.dataset.styledel;
    const s=(styleLib.styles||[]).find(x=>x.slug===slug);
    if(!confirm('从风格库移除「'+((s&&s.name)||slug)+'」?\n项目里已经用上它的那些不受影响。'))return;
    del.disabled=true;
    try{const r=await api('/api/design/styles','DELETE',{slug});
      styleLib=null;await loadStyleLib();
      toast(r.revertedToBuiltin?'已移除 · 同名的内置风格重新可用':'已从风格库移除','ok');
    }catch(err){toast(err.message,'err');if(document.body.contains(del))del.disabled=false;}
  };
}

/* ── 新建 / 复制自定义风格 ────────────────────────────────────────────────────
   为什么是「配一套」而不是「传一份文档」:operator 手里有品牌色和对气质的直觉,没有一份写好的

   右列**实时预览**是这张表单的全部价值所在:每一项都对应预览图上的一条通道,改哪儿图上立刻变哪儿。

const NS_PLATFORMS=['小程序','后台网站','网页前台','移动 App','印刷物料'];
const NS_ROUNDS=[['sharp','直角'],['subtle','微圆'],['soft','柔圆'],['pill','胶囊']];

   那侧是权威(落盘校验按它),这边多一个档,人选得到却存不进去。 */
const NS_ELEVS=[['none','无'],['flat','轻'],['soft','明显'],['color','彩色']];
const NS_STATUS=[['success','成功'],['warning','警告'],['danger','危险']];

   而 `design doctor` 会把不达标的报成硬问题 ⇒ 那个项目此后每次交付都多一行常驻噪音。
   审计实测:旧值 warning #D4A017 = 2.38:1 · danger #E53935 = 4.23:1,两个都不达标。
   新值同色相压明度(#B45309 = 5.02 · #C62828 = 5.62),不是另挑一个能过线的颜色。 */
NS_STATUS_DEF={success:'#2E7D32',warning:'#B45309',danger:'#C62828'};
const NS_WEIGHTS=[['light','轻'],['medium','中'],['heavy','重']];
/* ⚠ 字体不在表单里选(2026-09-02 产品决定去掉整个「字体」栏):中文字体是低频决定,占一格不值;

   ⚠ 手写的内置档不受此限 —— 新中式该用宋体、precision-mono 该用等宽,那是它们的设计身份。 */
const NS_CKEYS=[['bg','底色'],['ink','文字'],['accent','强调'],['muted','次要']];
const NS_BLANK={name:'',description:'',suits:[],platforms:[],colors:{bg:'#FFFFFF',ink:'#1A1D24',accent:'#6D28D9',muted:'#6B7280'},rounded:'subtle',weight:'medium',elevation:'flat',gradientTo:'',statusColors:null};
let nsTimer=null,nsSeq=0;
/* 提炼带回来的两样东西,存在这里而不是 DOM 上:
   nsExtra = 补充色 [{hex,count,on}](勾选态就是 on) · nsTokens = 字距/描边/间距/字号/行高
   两者都随 nsReadForm() 一起进预览与保存;弹窗每次打开都重置(见 openStyleModal)。 */
let nsExtra=[],nsTokens=null,nsSug=null;
/* 标识的形状。**本文件里只此一份** —— 建风格、收录、由名称推标识三处原本各写一份同样的
   字面量,改一处漏两处是迟早的事。(与服务端 design.js 那份跨端重复是架构现状,不在这里解) */
const NS_SLUG_RE=/^[a-z0-9][a-z0-9-]{0,40}$/;
/* 颜色文本框的归一,与服务端 _normHex 同判:#abc 展开成 #AABBCC,认不出返回 null。

const NS_HEX_RE=/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/;
function nsNormHex(v){
  const m=NS_HEX_RE.exec(String(v==null?'':v).trim());

/* 压深一个色(勾上「用渐变」时给的起点值)。只服务这一个交互 —— 落盘的渐变两端色以表单为准,

function nsDarken(hex,t){
  const n=nsNormHex(hex);if(!n)return'#000000';
  const c=[1,3,5].map(i=>parseInt(n.slice(i,i+2),16));

/* 四个色框逐个查,返回第一处非法的标签(全合法 ⇒ null)。红字提示与保存拦截共用它。 */
function nsHexCheck(){

/* 名称 → 建议标识。只在名称是纯 ASCII 时给得出(中文名转不出有意义的拼写,不硬转) */
function nsSuggestSlug(name){
  const s=String(name||'').trim().toLowerCase();
  if(!s||!/^[\x20-\x7e]+$/.test(s))return'';
  const out=s.replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,41).replace(/-+$/,'');

function nsReadForm(){
  const colors={};

  }

/* 提炼回填:只覆盖「参考里读得出来」的那几项(色板/圆角),名称与描述留着不动 ——
   那两项是人写的,被一次提炼冲掉最恼人。
   ⚠ 读不到的项**不动表单**:一个颜色都没读到时 form.colors 是模板默认值、没读到圆角时 rounded 是兜底的「微圆」,
   照填就是把默认值当成提炼结果,还冲掉人已经选好的(实测 linear.app)。字重提炼器根本不读,
   只有目录里本来就有风格档(styledoc)时才是真值。 */
function nsFill(f,ev){
  if(!f)return;
  const e=ev||{};
  if(e.colorsFound!==false)for(const [k] of NS_CKEYS){const v=nsNormHex((f.colors||{})[k]);if(!v)continue;
    $('#nsCol_'+k).value=v;$('#nsHex_'+k).value=v;}
  if(e.roundedFound!==false&&f.rounded)$$('#nsRound button').forEach(b=>b.classList.toggle('on',b.dataset.v===f.rounded));
  if((!ev||e.source==='styledoc')&&f.weight)$$('#nsWeight button').forEach(b=>b.classList.toggle('on',b.dataset.v===f.weight));
  /* ⚠ 字体不在表单里,提炼回填也就无从谈起(提色器本来也读不出中文族) */
  nsHexCheck();
}
/* 提炼带回来的三样属性(v0.11.22)。同一条纪律:**提不出的项一概不动表单** ——
   traits 里没有的键就是「这份参考里读不出来」,不是「读到了 0」。 */
function nsFillTraits(tr){
  if(!tr)return;
  if(tr.elevation)$$('#nsElev button').forEach(b=>b.classList.toggle('on',b.dataset.v===tr.elevation));
  if(tr.gradientTo){const v=nsNormHex(tr.gradientTo);
    if(v){$('#nsGradOn').checked=true;$('#nsGradWrap').style.display='block';$('#nsGradCol').value=v;$('#nsGradHex').value=v;}}
  if(tr.statusColors&&Object.keys(tr.statusColors).length){
    $('#nsStatOn').checked=true;$('#nsStatWrap').style.display='block';
    /* 只填提到的槽:参考里只声明了 danger 的站点,另外两个保持默认值而不是被编出来 ——
       但三个格子都会随勾选一起存进档,所以提示文案里说清「没提到的是默认值,自己改」 */
    for(const [k] of NS_STATUS){const v=nsNormHex(tr.statusColors[k]);if(!v)continue;
      $('#nsSt_'+k).value=v;$('#nsStHex_'+k).value=v;}}
}
/* 提炼带回来的建议落进本地状态。两条纪律:
   ① 描述框**空着才自动填** —— 已经写了字的绝不冲掉(那是人写的,被一次提炼抹掉最恼人);
      想换成这句,证据区那颗「用这句」点一下。
   ② 名称一律不动。 */
function nsApplySuggest(sug){
  nsExtra=[];nsTokens=null;nsSug=sug||null;
  /* 「复制为新款」带进来的那块补充色到此作废(nsExtra 已被这次提炼整个换掉)——
     留着它就是一排点不动、又与实际状态对不上的色块,而且会与证据区撞 id */
  const cb=$('#nsCopyExtra');if(cb)cb.remove();
  if(!sug)return;
  nsExtra=(sug.extraColors||[]).map(c=>({hex:(c&&c.hex)||c,count:(c&&c.count)||0,on:true}));
  nsTokens=(sug.extraTokens&&Object.keys(sug.extraTokens).length)?sug.extraTokens:null;

/* 「还读到」那一行:只列真读出来的项,一项都没有就整行不出现(不写「未读到字距」这种废话) */
function nsTokensSummary(t){
  if(!t)return'';
  const p=[];
  if(t.letterSpacing!=null)p.push('字距 '+t.letterSpacing+'em');
  if(t.borderWidth!=null)p.push('描边 '+t.borderWidth+'px');
  if(t.spacingUnit!=null)p.push('间距 '+t.spacingUnit+'px 网格');
  if(t.headlineSize!=null&&t.bodySize!=null)p.push('标题/正文 '+t.headlineSize+'/'+t.bodySize);
  if(t.lineHeight!=null)p.push('行高 '+t.lineHeight);
  return p.join(' · ');
}
/* 可勾选补充色块的骨架。**证据区与「复制为新款」共用同一份** —— 两处各写一份,勾选逻辑
   迟早只改一处。容器 id 由调用方给:证据区每次提炼都整块重画,不能与复制块撞 id。 */
function nsChipsHtml(id){
  return '<span id="'+id+'" class="nschips" style="display:inline-flex;vertical-align:-4px;margin-left:2px">'
    +nsExtra.map((c,i)=>`<span class="nschk${c.on?' on':''}" data-i="${i}"><span class="sw" style="background:${esc(c.hex)}"></span>${esc(c.hex)}${c.count?'<span class="faint"> ×'+c.count+'</span>':''}</span>`).join('')+'</span>';
}
/* innerHTML 重写过就要重新挂 —— 所以绑定与骨架分开两个函数 */
function nsBindChips(id){
  $$('#'+id+' .nschk').forEach(c=>c.onclick=()=>{
    const i=+c.dataset.i;if(!nsExtra[i])return;
    nsExtra[i].on=!nsExtra[i].on;c.classList.toggle('on',nsExtra[i].on);nsPreview();});
}
function nsEvidence(ev){
  const el=$('#nsEv');if(!el||!ev)return;
  const rows=[];
  if(ev.source==='styledoc')rows.push('这个目录里已经有一份风格档('+esc(ev.styleDoc||'')+')—— 直接取了它的设定,没有再去猜');
  else if(ev.source==='url')rows.push('读了 '+(ev.sheets||0)+' 份样式表');
  else if(ev.source==='dir')rows.push('扫了 '+(ev.files||0)+' 个样式文件');
  const sw=(ev.colors||[]).map(c=>`<span class="sw" style="background:${esc(c.hex)}"></span>${esc(c.hex)}${c.count?'<span class="faint"> ×'+c.count+'</span>':(c.role?'<span class="faint"> '+esc(c.role)+'</span>':'')}`).join('　');
  if(sw)rows.push('提到最多的颜色 · '+sw);
  else if(ev.colorsFound===false)rows.push('没读到颜色,四个颜色保持原样');
  if((ev.fonts||[]).length)rows.push('字体族 · '+ev.fonts.map(f=>esc(f)).join(' / '));
  if((ev.radii||[]).length)rows.push('圆角取值 · '+ev.radii.join(' / ')+'px');
  else if(ev.roundedFound===false)rows.push('没读到圆角设定,圆角保持原样');
  const ts=nsTokensSummary(nsTokens);
  if(ts)rows.push('还读到 · '+ts);
  /* 三样属性也要如实报(v0.11.22):它们已经把表单上的档位改掉了,不说一声就是「悄悄替人做主」。
     只报**真提到的**那几样 —— traits 里没有的键就是没读出来。 */
  const tr=(nsSug&&nsSug.traits)||{};
  const trs=[];
  if(tr.elevation)trs.push('投影 '+({none:'一处都没有 ⇒ 无',flat:'很浅 ⇒ 轻',soft:'明显',color:'带颜色 ⇒ 彩色'}[tr.elevation]||tr.elevation));
  if(tr.gradientTo)trs.push('渐变到 <span class="sw" style="background:'+esc(tr.gradientTo)+'"></span>'+esc(tr.gradientTo));
  if(tr.statusColors)trs.push('状态色 '+Object.keys(tr.statusColors).map(k=>({success:'成功',warning:'警告',danger:'危险'}[k]||k)+' <span class="sw" style="background:'+esc(tr.statusColors[k])+'"></span>').join(' '));
  if(trs.length)rows.push('还读到 · '+trs.join(' · ')+' <span class="faint">(没提到的那几样保持原样)</span>');
  if(nsExtra.length)rows.push('补充色(勾上的会一起写进这套风格)· '+nsChipsHtml('nsExtraChips'));
  if(nsSug&&nsSug.description)rows.push('这一句只说事实,可以直接当描述 · <span class="dim">'+esc(nsSug.description)
    +'</span> <button type="button" class="btn nsmini" id="nsUseDesc">用这句</button>');
  rows.push('<span class="faint">这是起点不是结论 —— 逐项改到满意为止</span>');
  el.style.display='block';el.className='nsev';el.innerHTML=rows.join('<br>');
  nsBindChips('nsExtraChips');

/* 展开着的定时任务详情(按 cron id)。必须存在渲染之外 —— 启停任务、切页签回来、群卡上任何
   写操作都会 renderGroups() 重画整块,不记住的话每点一次启停,正读着的全文就没了。 */
const cronOpen=new Set();
/* 任务正文的轻量分层。不做 markdown 解析,只认这个产品自己的体裁约定:①②③ 起步骤 ·
   「· 」起条目 · ⚠ 起提醒 · 缩进两格是命令或样例。认不出的行一律当普通段落 —— 所以随手写的
   任务照样正常显示,分层是锦上添花而不是解析器,不会因为格式不合就渲染坏。 */
function cronFullHtml(text){
  // ⚠ 在正文里三种位置都出现(独立成行 / 挂在条目开头 / 夹在句子中间),只按行首判断会漏掉
  // 后一种 —— 实测这份任务 4 个 ⚠ 里就有 2 个夹在句中,而它们恰恰是最该跳出来的。
  // 所以位置分层之外,再把符号本身标一下,三种位置就都覆盖了。
  const E=s=>esc(s).replace(/⚠/g,'<b class="cw">'+IC.warn+'</b>');
  return String(text||'').split('\n').map((ln,i)=>{
    if(!ln.trim())return '<div class="cbl-sp"></div>';
    if(/^\s{2,}\S/.test(ln))return `<div class="cbl-code">${esc(ln.trim())}</div>`;   // 缩进行 = 命令/样例,原样不加标记
    const t=ln.trim();
    if(i===0)return `<div class="cbl-t">${E(t)}</div>`;                               // 首行 = 任务名
    if(/^[①②③④⑤⑥⑦⑧⑨⑩]/.test(t))return `<div class="cbl-h">${E(t)}</div>`;
    if(/^⚠/.test(t))return `<div class="cbl-warn">${E(t)}</div>`;
    // 条目:剥掉「· 」再判断 —— 有的提醒写成「· ⚠ …」挂在条目上,不先剥就落进普通条目、警示性丢失
    if(/^[·•]\s*/.test(t)){const b=t.replace(/^[·•]\s*/,'');return `<div class="cbl-li${/^⚠/.test(b)?' warn':''}">${E(b)}</div>`;}
    if(/^\d+\.\s/.test(t))return `<div class="cbl-li num">${E(t)}</div>`;
    return `<div class="cbl-p">${E(t)}</div>`;
  }).join('');
}

    const permPlug=`        <div class="kv" style="align-items:flex-start"><span class="kk">基础技能</span>

  const CRON_ONEOFF=[/^\d{1,2}:\d{2}$/,/^\d{1,2}-\d{1,2}[ T]\d{1,2}:\d{2}$/,/^\d{4}-\d{1,2}-\d{1,2}[ T]\d{1,2}:\d{2}$/,/^\d{1,2}月\d{1,2}日\s*\d{1,2}:\d{2}$/,/^\d{4}年\d{1,2}月\d{1,2}日\s*\d{1,2}:\d{2}$/];
  $$('#groups [data-cronadd]').forEach(b=>b.onclick=async()=>{const f=b.closest('.cronform');const val=f.querySelector('.cronexpr').value.trim(),kind=f.querySelector('.cronkind').value,text=f.querySelector('.crontext').value.trim();if(!val){toast('填写时间(如「10:20」「07-16 10:20」「每天 09:00」)','err');return;}if(!text){toast(kind==='do'?'填写到点让 agent 做的事':kind==='run'?'填写要跑的命令':'填写要发送的消息','err');return;}const isDate=CRON_ONEOFF.some(re=>re.test(val));const body=isDate?{chatId:b.dataset.cronadd,at:val,kind,text}:{chatId:b.dataset.cronadd,expr:val,kind,text};try{S=await api('/api/groups/cron/add','POST',body);renderGroups();toast(isDate?'已创建一次性任务':'已创建定时任务','ok');}catch(e){toast(e.message,'err');}});
  $$('#groups [data-crontgl]').forEach(b=>b.onclick=async()=>{try{S=await api('/api/groups/cron/toggle','POST',{chatId:b.dataset.g,id:b.dataset.crontgl,enabled:b.dataset.en==='1'});renderGroups();}catch(e){toast(e.message,'err');}});
  $$('#groups [data-cronrm]').forEach(b=>b.onclick=async()=>{if(!confirm('删除该定时任务?'))return;try{S=await api('/api/groups/cron/remove','POST',{chatId:b.dataset.g,id:b.dataset.cronrm});cronOpen.delete(b.dataset.cronrm);renderGroups();toast('已删除','ok');}catch(e){toast(e.message,'err');}});
  // 点整行展开/收起全文。行内那三个按钮各管各的(启停/删除/复制),别被行的 handler 抢走。
  $$('#groups [data-cronx]').forEach(r=>r.onclick=(e)=>{
    if(e.target.closest('.cdot,.crm,.ccopy'))return;
    const b=r.nextElementSibling; if(!b||!b.classList.contains('cronbody'))return;
    const open=b.style.display==='none';
    b.style.display=open?'block':'none'; r.classList.toggle('open',open);
    if(open)cronOpen.add(r.dataset.cronx); else cronOpen.delete(r.dataset.cronx);
  });
  // 复制全文。⚠ 控制台常经局域网 http 访问 = 非 secure context,navigator.clipboard 在那儿是
  // undefined ⇒ 必须留 execCommand 兜底(与 toast 那颗复制按钮同一套写法)。
  $$('#groups .ccopy').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const txt=b.dataset.full||''; if(!txt)return;
    const done=()=>{b.textContent='已复制';setTimeout(()=>b.textContent='复制全文',1200);};
    // 兜底走临时 textarea 而不是选中正文区:正文是按行拆开渲染的,选 DOM 复制出来会走样
    const pick=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('style','position:fixed;top:0;left:0;opacity:0');document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(_){}ta.remove();done();};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done).catch(pick);
    else pick();
  });
  // 执行模式段控(两后端统一,替代原 codex-only toggle + Claude select):受限 ⇄ 完全访问,
  // 映射 dontAsk('' 清覆盖)/ bypassPermissions。点当前态不动作;完全访问需二次确认(文案后端无关)。
  $$('#groups .gseg').forEach(b=>b.onclick=async()=>{
    const g=b.dataset.g,mode=b.dataset.mode,wantBypass=mode==='bypassPermissions';
    const curBypass=(S.groups.find(x=>x.chatId===g)||{}).permissionMode==='bypassPermissions';
    if(wantBypass===curBypass)return; // 已是该状态,不重复保存
    if(wantBypass&&!confirm('⚠ 完全访问:跳过所有权限校验与目录围栏 — 群里任何成员的一条消息都能在这台机器上执行任意操作。\n仅限完全可信的私人群。'))return;
    try{S=await api('/api/groups/policy','POST',{chatId:g,permissionMode:mode});renderGroups();toast(wantBypass?'已设为完全访问 · 下轮生效':'已设为受限 · 下轮生效','ok');}
    catch(e){toast(e.message,'err');}});
  $$('#groups [data-pp]').forEach(b=>b.onclick=()=>{
    const p=PERM_PRESETS[b.dataset.pp];if(!p)return;
    if(b.dataset.pp==='full'&&!confirm('⚠ 全信任 = Bash(*) 全开,无目录围栏!\n群里任何成员的一条消息都能在这台机器上执行任意命令(删文件/外发数据/装软件)。\n仅限完全可信的私人群。确定填入?(仍需点「保存权限」才生效)'))return;
    $('.gallow[data-g="'+b.dataset.g+'"]').value=p.allow.join(', ');
    $('.gdeny[data-g="'+b.dataset.g+'"]').value=p.deny.join(', ');
    toast('已填入「'+p.label+'」预设 — 可手改,点「保存权限」生效','ok');});
  // 插件区:Claude 点「配置」懒加载 → 勾选即存(strict 接管),按钮变「保存」= 收起;
  // codex 点「查看」= 只读展开全局 codex MCP(无勾选),按钮变「收起」。
  $$('#groups [data-plug]').forEach(b=>b.onclick=async()=>{
    const cid=b.dataset.plug,box=$('.plugbox[data-g="'+cid+'"]');
    const grp=S.groups.find(x=>x.chatId===cid)||{},pv=S.providers.find(p=>p.name===(grp.provider||S.defaultProvider)),isCodex=!!pv&&pv.runner==='codex';
    const openLbl=isCodex?'收起':'保存',closeLbl=isCodex?'查看':'配置';
    if(box.style.display!=='none'){box.style.display='none';b.textContent=closeLbl;return;}  // 收起
    box.style.display='block';b.textContent=openLbl;box.innerHTML='<span class="spin"></span>';
    try{const r=await api('/api/plugins?chatId='+encodeURIComponent(cid));renderPlugBox(cid,box,r,isCodex);}
    catch(e){box.innerHTML='<div class="reply err">'+IC.x+' '+esc(e.message)+'</div>';}
  });
}

// 群卡插件面板 — 勾选 = 本群加载该 MCP,即存即生效(下轮)。默认(未配置)= 全部加载 ⇒ 全勾;
// 取消勾即进入 strict 接管(只载勾选的用户级 + 项目级全部)。checkbox 即真相,故无需「恢复默认」
// 按钮(要全恢复 = 全勾)。项目级 MCP 恒载入(只读、禁勾)。启用即自动放行 mcp__名__*(deny 仍优先)。
// 命令(detail)只进 title 悬浮,行内不显 —— 群卡按名勾选即可,完整命令看模型页「插件库」。
// 用户级 skills 仍不列(2026-07-03 拍板:列表累赘);**项目级技能改为只读显示**(2026-08-03 拍板
// v0.11.2 —— 当年拍板针对的是用户级列表噪音,项目自带 cloudbase 这类重量级技能不显示 = 能力隐身)。
// 摘要行带项目级计数(g.proj,服务端读 workdir 声明):不点开「配置」也看得见项目自带什么。
function plugSummary(g){
  const p=g&&g.plugins, pr=(g&&g.proj)||{mcp:[],skills:[]};
  const proj=[pr.mcp.length?`项目 ${pr.mcp.length}`:'',pr.skills.length?`技能 ${pr.skills.length}`:''].filter(Boolean).join(' · ');
  const lib=!p?'默认加载':`已启用 · MCP ${(p.mcp||[]).length}`+((p.skills||[]).length?` · Skill ${(p.skills||[]).length}`:'');
  return proj?`${proj} · ${lib}`:lib;
}
// MCP 可达性徽标 —— 插件库与群卡两处共用。
// ⚠ **只标例外**:逐个标「可达」是噪音(本项目「常态不用说,例外才值得标」那条),
//   而这次要治的恰恰是「连不上的那个长得和好的一模一样」。
//   down = 确定不可用(勾了它的群那一轮直接跳过不加载);unknown = 本机直连没探通,
//   但仍照常加载(直连不走代理,探不通 ≠ 不可用),所以用最弱的样式,别喊。
function reachChip(r){
  if(!r||r.status==='ok')return '';
  const bad=r.status==='down';
  const tip=(r.detail||'')+(bad?' · 勾选了它的群这一轮会跳过它,不加载也不重试;服务起来后自动恢复'
    :' · 仍会照常加载 —— 本机直连探测不走代理,探不通不代表它不可用');
  return `<span class="chip ${bad?'warn':'none'}" title="${esc(tip)}" style="flex-shrink:0;margin-left:6px">${bad?'连不上':'未确认'}</span>`;
}
function renderPlugBox(cid,box,r,isCodex){
  const mrow=(name,detail,reach)=>`<div class="kv" style="padding:3px 0;border-top:none"><span class="kk mono" style="white-space:nowrap">${esc(name)}</span><span class="vv" title="${esc(detail||'')}">${esc(detail||'MCP')}</span>${reachChip(reach)}</div>`;
  if(isCodex){ // codex:只读 —— 全局加载 ~/.codex/config.toml 全部,无按群门控
    const cm=(r.codex&&r.codex.mcp)||[];
    box.innerHTML=(cm.length?cm.map(m=>mrow(m.name,m.detail,m.reach)).join(''):'<div class="hint" style="padding:2px 0">无 —— 去「模型 · 库」页「插件库」的 Codex 区添加</div>')
      +`<div class="hint" style="margin-top:7px">codex <b>全局加载</b>全部 · 对所有 codex 群一致 · 在「模型 · 库」页「插件库」管理</div>`;
    return;
  }
  const en=r.enabled,enM=new Set((en&&en.mcp)||[]);
  // detail(完整命令)只进 label title 悬浮;行内只显 checkbox + 名 + 来源 chip。
  const row=(type,name,src,detail,checked,fixed,reach)=>`<label class="inline" style="gap:7px;font-size:11px;padding:3px 0;cursor:${fixed?'default':'pointer'}" title="${esc(detail||'')}">
    <input type="checkbox" class="${type}" value="${esc(name)}" ${checked?'checked':''} ${fixed?'disabled':''} style="width:auto"/>
    <span class="mono" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(name)}</span>
    ${reachChip(reach)}<span class="chip ${checked?'set':'none'}" style="flex-shrink:0">${esc(src)}</span></label>`;
  const pm=(r.project&&r.project.mcp)||[],gm=(r.global&&r.global.mcp)||[];
  // 未配置(en null)默认全勾 = 现状全加载;已配置则按 enM。项目级恒勾、禁改。
  const mcpRows=[...pm.map(m=>row('pmcp-fixed',m.name,'项目',m.detail,true,true,null)),
                 ...gm.map(m=>row('pmcp',m.name,m.source||'用户',m.detail,en?enM.has(m.name):true,false,m.reach))].join('')||'<div class="hint" style="padding:2px 0">无 —— 去「模型 · 库」页「插件库」添加</div>';
  // ⚠ 勾着 + 连不上 = 此前最坑的组合:勾选框全绿,而每一轮都在替它付一次启动失败,
  //   三处(体检 / 这里 / 群里)都不吭声。现在这里直说,并说清「不用动勾选」。
  const dead=gm.filter(m=>m.reach&&m.reach.status==='down'&&(en?enM.has(m.name):true));
  // 项目级技能(workdir/.claude/skills,随项目自动加载):只读信息行 —— 不显示 = 能力隐身(v0.11.2)。
  const ps=(r.project&&r.project.skills)||[];
  const skillRow=ps.length?`<div class="hint" style="margin-top:6px;border-top:1px solid var(--line);padding-top:6px" title="${esc(ps.map(s=>s.name+(s.description?' — '+s.description.slice(0,80):'')).join('\n'))}">项目技能(随项目自动加载):<span class="mono">${ps.map(s=>esc(s.name)).join('、')}</span></div>`:'';
  // ⚠ 「会跳过」只对**配过插件**的群成立(en 非空):没配过的群是默认加载、claude 自己读全部,跳过机制根本不经过它们 ——
  //   对这类群得反过来说清「不会跳过、每轮都在付」,并给出路(保存一次勾选)。审查逮到的「说的和做的不一致」。
  const deadRow=dead.length?`<div class="hint" style="margin-top:6px;color:var(--warn)" title="${esc(dead.map(m=>m.name+' — '+((m.reach&&m.reach.detail)||'')).join('\n'))}">${en?`勾着但连不上:<span class="mono">${dead.map(m=>esc(m.name)).join('、')}</span> — 这一轮会跳过不加载(否则每轮都白等它启动失败)。<b>不用取消勾选</b>,服务起来后自动恢复。`:`连不上:<span class="mono">${dead.map(m=>esc(m.name)).join('、')}</span> — 本群没配过插件、按默认加载全部,<b>不会跳过</b>,每轮都会替它付一次启动失败;要让它被自动跳过,在这里<b>保存一次勾选</b>(勾上要用的那几个即可),之后服务起来后自动恢复。`}</div>`:'';
  box.innerHTML=`${mcpRows}${skillRow}${deadRow}
    <div class="hint" style="margin-top:7px" title="启用即自动放行 mcp__名__*,deny 仍优先;取消全部 = 只留项目级">勾选的 MCP 本群加载 · 下轮生效</div>`;
  const sum=$('.plugsum[data-g="'+cid+'"]');
  const saveNow=async(cb)=>{
    const mcp=[...box.querySelectorAll('.pmcp:checked')].map(i=>i.value);
    const skills=(en&&en.skills)||[];  // 手工配置的 skills 原样保留
    try{S=await api('/api/groups/plugins','POST',{chatId:cid,mcp,skills});
      // plugSummary 收的是群对象(v0.11.2 起要带 proj 项目级计数)—— 从 POST 返回的新 state 取,
      // 别手拼 {mcp,skills}(那会丢 proj,摘要行的「项目 N」当场消失)。
      if(sum){const g2=S.groups.find(x=>x.chatId===cid);sum.textContent=plugSummary(g2||{plugins:{mcp,skills}});}
      toast('已生效(下轮)','ok');}
    catch(e){toast(e.message,'err');if(cb)cb.checked=!cb.checked;}};  // 失败回滚勾选态
  box.querySelectorAll('.pmcp').forEach(i=>i.onchange=()=>saveNow(i));
  // 安装/添加 MCP 已统一到模型页「插件库」命令行:群卡只做门控(勾选),
  // 不再重复放安装框 —— 库安装走 --scope user 与 cwd 无关,群卡那个框冗余。
}

async function openBind(){
  // 多平台并存:配了两个以上才显示切换;只配了一个就直接那一种(Slack 列 bot 已加入的频道)。企微形态 = 指引 + 刷新 + 候选(机器人被 @ 过的群)+ 手填,
  // 没有建群 / 解散(平台上没接口);第二步「项目与模型」两边共用;保存时写入 platform。
  const plats=S.platforms||{feishu:true,wecom:false};
  const PL={feishu:'飞书',wecom:'企业微信',slack:'Slack'};
  const onPlats=Object.keys(PL).filter(k=>plats[k]);
  const both=onPlats.length>1;
  let plat=(plats.feishu||!onPlats.length)?'feishu':onPlats[0];
  let chats=null,err=null,hint='';
  const loadChats=async()=>{chats=null;err=null;hint='';
    try{
      // ⚠ 都只列「bot 在里面的」:Slack 列 bot 已加入的频道(没 /invite 的频道绑了也收不到消息)
      if(plat==='slack'){const r=await api('/api/slack/channels');chats=(r.channels||[]).map(c=>({chatId:c.id,name:c.name+(c.isPrivate?' 🔒':'')}));}
      else{const r=await api(plat==='wecom'?'/api/wecom/chats':'/api/feishu/chats');chats=r.chats;hint=r.hint||'';}
    }catch(e){err=e.message;}};
  await loadChats();
  let picked='',pickedName='';
  const boundIds=new Set(S.groups.map(g=>g.chatId));
  // rows: name + 已绑定 tag。解散按钮只出现在【已绑定】的群上—— 未绑定的群
  // 不归 sbot 管辖;有其他用户时走两步式(群内预告 → 确认解散),空群/仅管理员一步解散。
  const isWe=()=>plat==='wecom';
  // 企微群没有解散按钮(平台上没接口);飞书群已绑定的才出「解散」
  const renderList=()=>(chats&&chats.length?`<div class="chatpick">${chats.map(c=>`<div class="ci" data-cid="${esc(c.chatId)}" data-cname="${esc(c.name)}">
      <span class="cnm"><span class="nm">${esc(c.name)}</span>${boundIds.has(c.chatId)?'<span class="chip set">已绑定</span>':''}</span>
      <span class="inline" style="gap:8px"><span class="cid">${esc(c.chatId)}</span>${(plat==='feishu'&&boundIds.has(c.chatId))?`<button class="btn ghost cdel" data-del="${esc(c.chatId)}" data-dname="${esc(c.name)}" title="解散该群并移除绑定(bot 须为群主;有其他成员时先群内预告再确认)">解散</button>`:''}</span>
    </div>`).join('')}</div>`
    :`<div class="empty">${err?'拉群列表失败:'+esc(err):(isWe()?'还没有机器人被 @ 过的群':plat==='slack'?'机器人还没被拉进任何频道 — 去频道里发 /invite @机器人':'bot 不在任何群 / 未配飞书')} · 可手动填 ${plat==='slack'?'频道 ID':'chatId'}</div>`);
  const manualHint=()=>isWe()?'只列了机器人被 @ 过的群 —— 手填的 id 若机器人不在群里,绑了也收不到消息;单聊填对方账号':plat==='slack'?'只列了机器人已加入的频道 —— 手填的频道 ID 若机器人不在频道里,绑了也收不到消息':'只列了 bot 在里面的群 —— 手填的 id 若 bot 不在群里,绑了也收不到消息';
  const manualPh=()=>isWe()?'wr…':plat==='slack'?'C…':'oc_...';
  // 第一步的头与指引按平台切:飞书 = 「创建新群」;企微 = 三步指引 + 「刷新列表」(新群 @ 过机器人后才出现在候选里)
  const renderHead=()=>plat==='slack'
    ?`<div class="chatpick-head"><span class="ttl">选择 Slack 频道</span><button class="btn" id="mRefresh">${IC.refresh} 刷新列表</button></div>
      <div class="hint" style="margin:-6px 0 10px">在频道里发 <b>/invite @机器人</b> 把它拉进来,刷新后就会出现在这里</div>`
    :isWe()
    ?`<div class="chatpick-head"><span class="ttl">选择企业微信群</span><button class="btn" id="mRefresh">${IC.refresh} 刷新列表</button></div>
      <div class="hint" style="margin:-6px 0 10px">在企业微信里<b>建群 → 从群菜单把机器人加进群 → @ 它一次</b>,刷新后就会出现在这里${hint?' · '+esc(hint):''}</div>`
    :`<div class="chatpick-head"><span class="ttl">选择飞书群</span><button class="btn" id="mNewChat">${IC.plus} 创建新群</button></div>`;
  $('#modal').innerHTML=`<h3>配置群项目</h3>
    ${both?`<div class="inline" style="margin:-4px 0 14px;gap:10px"><span class="faint" style="font-size:12px">平台</span><div class="segtoggle" id="mPlat">${onPlats.map(k=>`<button type="button" class="${plat===k?'on':''}" data-plat="${k}">${PL[k]}${k==='slack'?' 频道':'群'}</button>`).join('')}</div></div>`:''}
    <div id="chatHeadWrap">${renderHead()}</div>
    <div id="chatListWrap">${renderList()}</div>
    <div id="newChatRow" style="display:none;margin-bottom:16px">
      <div class="newchat-row" style="margin-bottom:8px"><input id="mNewName" placeholder="新群名称"/><button class="btn" id="mNewGo">建群</button></div>
      <div class="inline" id="mAutoInvite" style="flex-wrap:wrap;gap:6px;font-size:12px"></div>
    </div>
    <div class="inline" style="justify-content:flex-end;margin:-8px 0 14px"><a class="lnk2" id="mManual" href="#">列表里没有?手动填 ID</a></div>
    <div id="manualRow" class="field" hidden><label class="f">chat id<span class="faint" style="font-weight:400;margin-left:6px" id="mManualHint">${manualHint()}</span></label><div class="inline" style="gap:8px"><input id="mChat" placeholder="${manualPh()}" value="" style="flex:1"/><button class="btn" id="mManualGo">下一步</button></div></div>
    <div id="mStep2" hidden>

// parent dir for the "up" entry; '' at a drive root / POSIX root → back to drive list.
// Pure-string (no Node path/process — this runs in the browser). Handles both
// Windows (D:\…\) and POSIX (/…) path shapes the server returns.
function pathParent(p){
  if(!p) return '';
  const win=/^[A-Za-z]:[\\/]/.test(p);
  const norm=p.replace(/\\/g,'/').replace(/\/+$/,'');
  // drive root like D: → drive list; POSIX root / → drive list/empty
  if(/^[A-Za-z]:$/i.test(norm)) return '';
  if(norm==='/'||norm==='') return '';
  const i=norm.lastIndexOf('/');
  if(i<=0){
    // /foo → /  ;  D:/foo → D:\
    if(norm[0]==='/') return '/';
    if(/^[A-Za-z]:$/i.test(norm.slice(0,2))) return norm.slice(0,2)+'\\';
    return '';
  }
  let parent=norm.slice(0,i);
  if(/^[A-Za-z]:$/i.test(parent)) return parent+'\\'; // D: → D:\
  if(parent==='') return '';
  return win?parent.replace(/\//g,'\\'):parent;
}
