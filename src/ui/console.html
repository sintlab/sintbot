      <div class="kv"><span class="kk">连接方式</span><span class="vv${p.runner!=='codex'&&p.baseUrl?' mono':''}" title="${esc(p.runner==='codex'?'Codex CLI(codex exec · 订阅登录)':(p.baseUrl?displayBase(p.baseUrl):'本机 Claude Code 的登录态 —— 无需 baseUrl / API key'))}">${esc(p.runner==='codex'?'Codex CLI (订阅登录)':(p.baseUrl?displayBase(p.baseUrl).replace('https://',''):'Claude 订阅登录'))}</span></div>
      ${p.vision===false?'<div class="kv"><span class="kk">识图</span><span class="vv" title="纯文本模型:送给它的图片(群里发的图/网页截图/读取的图片文件)自动降级成占位文本,不会 400 崩掉整轮">不支持 · 图片自动降级</span></div>':''}
      ${usage[p.name]?`<div class="kv"><span class="kk" style="flex:none">${esc(usage[p.name].label)}${usageRefreshBtn(false)}</span><span class="vv wrap" title="${esc(usage[p.name].value)}${(usage[p.name].label==='订阅额度'||usage[p.name].label==='subscription usage')?' —— 百分比 = 已用,括号 = 距重置,与这台机器上交互式 Claude Code 共享的订阅窗口':''}" style="color:var(--ok);font-weight:500">${esc(usage[p.name].value)}</span></div>`:''}
      ${(cs&&cs.usageText)?`<div class="kv"><span class="kk" style="flex:none">订阅额度${usageRefreshBtn(true)}</span><span class="vv wrap" title="百分比 = 已用,括号 = 距重置 —— 与交互式 Codex 共享的订阅窗口(时长随官方口径)" style="color:var(--ok);font-weight:500">${esc(cs.usageText)}</span></div>`:''}
      ${(()=>{const ew=p.runner==='codex'?(cs&&cs.envWarnings):(p.loggedIn&&S.claudeStatus?S.claudeStatus.envWarnings:null);return (ew&&ew.length)?`<div class="kv"><span class="kk" style="flex:none">环境冲突</span><span class="vv wrap" title="${esc(ew.map(w=>w.key+' — '+w.reason).join('\n'))}" style="color:var(--warn-ink)" data-i18n-skip>${ew.map(w=>`<span class="mono">${esc(w.key)}</span>`).join(' · ')}</span></div>`:'';})()}
      <div class="acts"><button class="btn" data-act="test" title="测试"><span>测试</span></button>${p.hidden?'<span class="hint" style="align-self:center">已隐藏</span>':''}</div>
      <div class="reply-slot"></div>
    </div>`;
  }).join('');
  const extra=S.providers.filter(p=>p.hidden||!p.configured).length;
  const provLead=runtimeAllows('POST','/api/providers/add')?RUNTIME_UI_TEXT.providers:RUNTIME_UI_TEXT.providersView;
  const provLeadOpen=!!($('#providers .lead-more')||{}).open;
  const toggle=extra?`<label class="pv-only"><input type="checkbox" class="switch" id="showAll"${showAll?' checked':''}/><span>显示全部 (${extra})</span></label>`:'';
  $('#providers').innerHTML=`<div class="pact">${toggle}<button class="btn primary" id="addModel" title="添加模型">${IC.plus}<span>添加模型</span></button></div>
    ${S.runtimeCapabilities?(provLead===RUNTIME_UI_TEXT.providers
      ?`<details class="lead-more"${provLeadOpen?' open':''}><summary><span>在这里管理模型的端点、密钥与登录状态；型号与思考深度按群在「群·项目」里选。</span><span class="lnk2">了解更多</span></summary><div class="hint">${esc(provLead)}</div></details>`
      :`<div class="hint lead">${esc(provLead)}</div>`)
      :`<div class="hint lead">管理模型 · 拖 ${IC.grip} 排序 · ${IC.settings} 配端点/key/压缩 · 型号与思考深度按群在「群·项目」选</div>`}
    <div class="grid cols2 stagger" id="pgrid">${cards||`<button type="button" class="add-tile" id="addModelTile"><span class="pl">${IC.plus}</span><b>添加模型</b><span>Claude 或 Codex 订阅，或填一个 API Key</span></button>`}</div>
    <h2 class="sec">插件库 · MCP</h2>
    <div class="hint lead">本机装好的 MCP · 按运行时分两套 · 命令行安装、即时刷新</div>
    <div id="plugLib"><span class="spin"></span></div>
    <details class="library-fold" id="styleLibFold"${styleLibFoldOpen?' open':''}>
      <summary><span class="caret">${IC.chevronRight}</span><span>设计风格库</span><span class="hint" style="font-size:11px;font-weight:400">按需管理</span></summary>
      <div class="library-fold-content">
        <div class="inline" style="justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap">
          <div class="hint">仅在全新产品且未定方向时按需使用预设</div>
          <div class="inline" style="gap:6px"><button class="btn ghost ic-only" id="styleRescan" title="重新扫描风格预设(导入或改过自定义风格后用)" aria-label="重新扫描">${IC.refresh}</button><button class="btn ic-only" id="styleNew" title="用一张表单配一套自己的风格:色板、圆角、字重逐项定,右侧实时看效果。存进库后全部群都能用" aria-label="新建风格">${IC.plus}</button></div>
        </div>
        <div id="styleLib"><span class="spin"></span></div>
      </div>
    </details>
    <details class="library-fold" id="iconLibFold"${iconLibFoldOpen?' open':''}>
      <summary><span class="caret">${IC.chevronRight}</span><span>图标库</span><span class="hint" style="font-size:11px;font-weight:400">按需查看</span></summary>
      <div class="library-fold-content">
        <div class="hint lead">与设计风格<b>平级</b>:风格管怎么画(颜色/字体/圆角/描边),图标库管图形从哪来、叫什么名 · 一个项目分别选,在「群·项目」页那个群的「图标」行</div>
        <div id="iconLib"><span class="spin"></span></div>
      </div>
    </details>`;
  mountPageActions('providers');
  // 风格库按需展开再加载与绘制,默认折叠以降低存在感;页内重绘时保留用户刚才的展开状态。
  const styleFold=$('#styleLibFold');
  if(styleFold){
    styleFold.addEventListener('toggle',()=>{styleLibFoldOpen=styleFold.open;if(styleFold.open)loadStyleLib();});
    if(styleFold.open)loadStyleLib();
  }
  const iconFold=$('#iconLibFold');
  if(iconFold){
    iconFold.addEventListener('toggle',()=>{iconLibFoldOpen=iconFold.open;if(iconFold.open)loadIconLib();});
    if(iconFold.open)loadIconLib();
  }
  $('#styleRescan').onclick=async()=>{styleLib=null;$('#styleLib').innerHTML='<span class="spin"></span>';await loadStyleLib();toast('风格库已重新扫描','ok');};
  $('#styleNew').onclick=()=>openStyleModal(null);
  if($('#showAll'))$('#showAll').onclick=()=>{showAll=!showAll;renderProviders();};
  $('#addModel').onclick=()=>openProviderModal(null);
  const addModelTile=$('#addModelTile');if(addModelTile)addModelTile.onclick=()=>openProviderModal(null);   // 空状态的虚线卡
  if(runtimeAllows('POST','/api/providers/order'))makeSortable($('#pgrid'),{item:'.pcard:not(.is-preset)',key:c=>c.dataset.prov,save:o=>api('/api/providers/order','POST',{order:o})});
  $$('#pgrid .pcard').forEach(card=>{
    const name=card.dataset.prov, slot=$('.reply-slot',card);
    card.addEventListener('click',async e=>{
      const b=e.target.closest('button[data-act]'); if(!b)return;
      if(b.dataset.act==='edit'){openProviderModal(name,{});return;}
      if(b.dataset.act==='usage'){
        const cx=b.dataset.cx==='1', row=b.closest('.kv'), vv=row&&$('.vv',row);
        b.disabled=true;const old=b.innerHTML;b.innerHTML='<span class="spin"></span>';
        try{
          let text=null;
          if(cx){const r=await api('/api/codex/verify','POST',{force:true});const lg=r.login||{};text=fmtUsage(r.usage);
            /* 探测失败(fmtUsage 给空串)时保住原来的额度:这一行的 DOM 留着旧值,内存态却清空的话,
               下次重画整行会凭空消失 —— 同一份状态两个消费者,漏一个就自相矛盾。 */
            codexStatus[name]={loggedIn:lg.loggedIn,mode:lg.mode,dead:lg.dead,verified:lg.verified,text:lg.text,usageText:text||(lg.dead?'':((codexStatus[name]||{}).usageText||'')),envWarnings:cxEnvWarn(r,name)};}
          else{const r=await api('/api/usage/refresh'+(langOf()==='en'?'?lang=en':''),'POST',{name});if(r.usage){usage[name]=r.usage;text=r.usage.value;}}
          /* 就地改这一行,不走 renderProviders —— 整页重画会把这颗按钮连同它的 finally 一起换掉,
             还会打断 hover 与试跑回执。拉不到时**留着旧值**:清空会被读成「这个模型没额度」。 */
          if(text&&vv)vv.textContent=text;
          toast(text?'额度已更新 · '+text:'暂时取不到额度,显示的仍是上一次的值',text?'ok':'err');
        }catch(e){toast(e.message,'err');}
        finally{b.disabled=false;b.innerHTML=old;loadUsageView();}   // 概览的额度卡跟着取一次(走服务端缓存)
        return;
      }
      if(b.dataset.act==='test'){
        if(preset){slot.innerHTML='<div class="reply err">'+esc(trText('这张模型卡还没填 API Key'))+'</div>';return;}
        b.disabled=true;const old=b.innerHTML;b.innerHTML='<span class="spin"></span>'+old;slot.innerHTML='';
        try{const r=await api('/api/test','POST',{provider:name});
          slot.innerHTML=`<div class="reply ${r.ok?'':'err'}">${r.ok?esc(r.reply)+`\n\n<span class='faint'>— ${esc(r.model)} · ${r.ms}ms</span>`:'<b class="errk">出错</b>'+esc(r.error)}</div>`;
          toast(r.ok?name+' 测试通过':name+' 测试失败',r.ok?'ok':'err');
        }catch(err){slot.innerHTML=`<div class="reply err"><b class="errk">出错</b>${esc(err.message)}</div>`;toast(err.message,'err');}
        finally{b.disabled=false;b.innerHTML=old;}
      }
    });
  });
  // 插件库(Claude Code + codex MCP,住「模型」页底):两套 MCP 各一子卡 —— Claude Code(~/.claude.json,
  // `claude mcp add --scope user`)与 Codex(~/.codex/config.toml,`codex mcp add`,官方
  // developers.openai.com/codex/mcp)。/api/plugins/exec 是操作台开放终端,两卡共用执行/刷新;
  // codex 卡仅在配了 codex provider 时出现。不参与上方模型卡的拖动排序。
  // min-width:0 关键:grid 子项默认 min-width:auto,长命令(npx …)会撑大 min-content 破坏 1fr 1fr → 两卡不等宽。
  const libSection=(id,tag,cls,cfg,arr,ph,help,gated)=>`
    <div class="card" style="min-width:0">
      <div class="inline" style="justify-content:space-between;margin-bottom:9px">
        <span class="cli-tag ${cls}" style="flex:none">${tag}</span>
        <span class="hint" style="white-space:nowrap"><code>${cfg}</code> · ${arr.length}</span></div>
      ${arr.length?arr.map(m=>`<div class="kv" style="min-width:0"><span class="kk mono" style="flex:none">${esc(m.name)}</span><span class="vv" title="${esc(m.detail)}">${esc(m.detail||'MCP')}</span>${reachChip(m.reach)}</div>`).join(''):`<div class="hint" style="padding:3px 0">暂无 · 用下方命令添加</div>`}
      ${arr.some(m=>m.reach&&m.reach.status==='down')?`<div class="hint" style="margin-top:7px;color:var(--warn)">${gated?'有连不上的:多半是它依附的服务当前没在跑。连不上期间各群那一轮会直接跳过不加载，不用改勾选，服务起来后自动恢复。':'有连不上的:多半是它依附的服务当前没在跑。这一套<b>全局加载、没有按群门控</b>,连不上会在每一轮里重试失败 —— 服务起不来就先从这里移除。'}</div>`:''}
      <div class="inline" style="gap:6px;margin-top:11px">
        <input id="${id}In" placeholder="${esc(ph)}" style="flex:1;min-width:0"/>
        <button class="btn ic-only" id="${id}Btn" style="flex:none" title="添加" aria-label="添加">${IC.plus}</button></div>
      <div id="${id}Out" style="display:none;margin-top:6px"></div>
      <div class="hint" style="margin-top:7px">${help}</div>
    </div>`;
  const runLibCmd=async(id)=>{
    const inp=$('#'+id+'In'),btn=$('#'+id+'Btn'),out=$('#'+id+'Out');
    const cmd=inp.value.trim();if(!cmd){toast('先输入命令','err');return;}
    btn.disabled=true;btn.innerHTML='<span class="spin"></span>';
    try{const rr=await api('/api/plugins/exec','POST',{command:cmd});
      out.style.display='block';out.innerHTML='<div class="reply '+(rr.ok?'':'err')+'" style="max-height:180px;overflow:auto">'+esc(rr.output)+'</div>';
      toast(rr.ok?'已执行':'执行失败(看输出)',rr.ok?'ok':'err');
      if(rr.ok){inp.value='';libRefresh();}
    }catch(e){toast(e.message,'err');}
    finally{if(document.body.contains(btn)){btn.disabled=false;btn.innerHTML=IC.plus;}}};
  const libRefresh=()=>api('/api/plugins').then(r=>{
    const el=$('#plugLib');if(!el)return;
    const hasCodex=((S&&S.providers)||[]).some(p=>p.runner==='codex');
    const claudeSec=libSection('libClaude','Claude Code CLI','claude','~/.claude.json',(r.global&&r.global.mcp)||[],
      'claude mcp add --scope user 名 -- npx -y 包','装后到群卡「插件」<b>按群勾选</b>启用',true);
    const codexSec=hasCodex?libSection('libCodex','Codex CLI','codex','~/.codex/config.toml',(r.codex&&r.codex.mcp)||[],
      'codex mcp add 名 -- npx -y 包','<b>全局</b>对所有 codex 群生效(无按群门控)',false):'';
    // 两套 MCP 左右并排(cols2,窄屏自动堆叠);只有 Claude 时单卡限宽。
    el.innerHTML=codexSec?`<div class="grid cols2" style="gap:16px">${claudeSec}${codexSec}</div>`:`<div style="max-width:560px">${claudeSec}</div>`;
    for(const id of ['libClaude','libCodex']){const inp=$('#'+id+'In'),btn=$('#'+id+'Btn');if(!inp||!btn)continue;inp.onkeydown=e=>{if(e.key==='Enter')btn.click();};btn.onclick=()=>runLibCmd(id);}
  }).catch(e=>{const el=$('#plugLib');if(el)el.innerHTML='<div class="reply err">'+IC.x+' '+esc(e.message)+'</div>';});
  libRefresh();
}

/* 第三方(走 API key)模型卡的面板:新建用清单里的预设、编辑清单里认得的卡都走这里(订阅登录与 Codex 面板不变)。
   顺序 = 预设 → API key(唯一要填的,打开就聚焦)+「验证 Key」→ 名称 → 「高级」(端点、小模型 / 子代理、默认思考深度、
   上下文与压缩、识图、环境变量)。没有型号这一项:型号按群在「群·项目」或 /model 里选,卡上存的型号只是没选时的默认。
   「验证 Key」跑一轮短试(与终端向导同一个),失败按人话说原因;成功顺带取一次实时型号清单。不验证也能存,按钮写明「未验证」。
   端点:清单里登记了显示地址的,这里只显示那个地址、不给编辑(存的地址不变),「改用自定义端点」才换成输入框。 */
// A new card's compaction line, as the service gives it (0: left to the executor).
function newCardCompact(codex){return ((S.modelDefaults||{})[codex?'codex':'claude']||{}).autocompactTokens||0;}
function openKeyRouteModal(name,opts){
  opts=opts||{};
  const p=name?S.providers.find(x=>x.name===name):null, edit=!!p;
  const compStart=newCardCompact(false);
  const presetKey=edit?'':(opts.preset||''), pr=edit?null:(PRESETS[presetKey]||{});
  const r=edit?keyRouteOf(p):keyRouteOf(pr);
  if(!r){openProviderModal(name,{...opts,plain:true});return;}
  const base=edit?p.baseUrl:pr.baseUrl;
  const env=edit?{...(p.env||{})}:{...(pr.env||{})};
  const small=env.ANTHROPIC_DEFAULT_HAIKU_MODEL||r.small||'';
  const effDef=env.CLAUDE_CODE_EFFORT_LEVEL||'';
  const shown=displayBase(base), locked=shown!==base;
  const keyPh=edit?(p.keyStatus==='set'?'已设置 · 留空保持':p.keyStatus==='env'?'env:'+esc(p.keyRef)+' · 留空保持':'粘贴 key'):'粘贴 key(存进本地 gitignored 配置)';
  const presetSel=edit?'':`<div class="field"><label class="f">预设(自动填端点/模型/调优)</label><select id="amPreset">${Object.keys(PRESETS).map(k=>`<option value="${esc(k)}" data-logo="${esc(modelLogoId(PRESETS[k]))}" ${presetKey===k?'selected':''}>${esc(k)}</option>`).join('')}</select></div>`;
  const envRows=Object.entries(env).filter(([k])=>!/TOKEN|KEY|SECRET/i.test(k)).map(([k,v])=>`<div><span>${esc(k)}</span>=<span>${esc(v)}</span></div>`).join('');
  $('#modal').innerHTML=`<h3>${edit?'配置 '+esc(name):'添加模型'}</h3>
    ${presetSel}
    <div class="field"><label class="f" for="amKey">API key</label><input id="amKey" autocomplete="off" spellcheck="false" placeholder="${keyPh}"/>
      <div class="inline" style="gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center"><button class="btn" id="amVerify" type="button" title="验证 Key"><span>验证</span></button><span class="hint" id="amVerifyOut" role="status"></span></div></div>
    ${edit?'':`<div class="field"><label class="f" for="amName">名称</label><input id="amName" value="${esc(pr.name||'')}" placeholder="如 glm / my-model"/></div>`}
    <div class="hint" style="margin-bottom:12px">型号与思考深度按群在「群·项目」里选。</div>
    <details class="field library-fold" id="amAdv"><summary><span class="caret">${IC.chevronRight}</span><span>高级</span></summary>
      <div class="library-fold-content">
      <div class="field"><label class="f" for="amBase">端点 baseUrl</label>
        ${locked?`<div class="mono" id="amBaseShow" data-i18n-skip style="padding:6px 0">${esc(shown)}</div><a href="#" class="lnk2" id="amBaseEdit">改用自定义端点</a><input id="amBase" type="hidden" value="${esc(base)}"/>`
          :`<input id="amBase" value="${esc(base)}" placeholder="https://.../anthropic"/>`}</div>
      <div class="field"><label class="f" for="amSmall">小模型 / 子代理</label><input id="amSmall" class="mono" value="${esc(small)}"/>
        <div class="hint" style="margin-top:4px">后台小任务与子代理用这个型号，已按这家的文档预填。</div></div>
      <div class="field"><label class="f" for="amEffDef">默认思考深度</label><select id="amEffDef">${EFFORTS.map(v=>`<option value="${v}" ${v===effDef?'selected':''}>${v||'跟随 Claude Code 默认'}</option>`).join('')}</select>
        <div class="hint" style="margin-top:4px">群里没选思考深度时用它。</div></div>
      <h4 class="sec">上下文与压缩</h4>
      <details class="field"><summary class="hint" style="cursor:pointer">容量与运行信息</summary><div class="dim" id="amWindow" style="padding:9px 0">${edit?esc(providerWindowText(p,true)):'添加后按模型目录或会话上报显示'}</div></details>
      <div class="field"><label class="f" for="amCompMode">自动压缩</label><select id="amCompMode"><option value="default" ${(edit?p.autocompactTokens:compStart)>0?'':'selected'}>执行器默认</option><option value="custom" ${(edit?p.autocompactTokens:compStart)>0?'selected':''}>自定义</option></select></div>
      <div class="field" id="amCompField"><label class="f" for="amComp">压缩窗口(token)</label><input id="amComp" type="number" min="100000" max="1000000" step="1" value="${edit?(p.autocompactTokens||400000):(compStart||400000)}"/>
        <div class="hint" style="margin-top:5px">自定义压缩窗口为 10万–100万。Claude Code 会预留空间，可能提前压缩。</div></div>
      <div class="inline" style="margin:2px 0 2px"><input type="checkbox" class="switch" id="amVision" ${(edit?p.vision===false:pr.vision===false)?'checked':''}/> <span class="dim">此模型不支持识图(纯文本模型)</span></div>
      <div class="field" style="margin-top:10px"><label class="f">环境变量</label><div class="hint mono" id="amEnvSum" data-i18n-skip style="word-break:break-all">${envRows||'—'}</div></div>
      ${edit?`<div class="inline" style="margin:2px 0 10px"><input type="checkbox" class="switch" id="amHide" ${p.hidden?'checked':''}/> <span class="dim">在列表中隐藏此模型</span></div>`:''}
      </div>
    </details>
    <div class="mfoot" style="justify-content:space-between">
      ${edit?'<button class="btn ghost" id="amDel" title="移除"><span>移除</span></button>':'<span></span>'}
      <div class="inline"><span class="am-note" id="amSaveNote"></span><button class="btn" id="amCancel" title="取消">${IC.x}<span>取消</span></button><button class="btn primary" id="amSave"></button></div></div>`;
  $('#modalBg').classList.add('show');
  $('#modal').oninput=null;$('#modal').onchange=null;
  const compSync=()=>{$('#amCompField').hidden=$('#amCompMode').value!=='custom';};
  $('#amCompMode').onchange=compSync;compSync();
  // 保存按钮的字:新填的 key 没验证过就写明「未验证」;编辑时留空保持原 key 不算新填。
  let verified=false;
  const label=()=>{const typed=!!$('#amKey').value.trim(),un=(typed||!edit)&&!verified,sv=$('#amSave');sv.innerHTML=edit?IC.check+'<span>保存</span>':IC.plus+'<span>添加</span>';sv.title=(edit?'保存':'添加')+(un?'（未验证）':'');$('#amSaveNote').textContent=un?'未验证':'';};
  label();
  $('#amKey').oninput=()=>{verified=false;const o=$('#amVerifyOut');o.textContent='';o.style.color='';label();};
  if(!edit)$('#amPreset').onchange=()=>{const k=$('#amPreset').value,np=PRESETS[k]||{};
    if(np.registry)openKeyRouteModal(null,{preset:k});else openProviderModal(null,{codex:np.runner==='codex',preset:k});};
  const be=$('#amBaseEdit');
  if(be)be.onclick=(e)=>{e.preventDefault();const v=$('#amBase').value;const wrap=be.parentElement;
    $('#amBaseShow').remove();be.remove();$('#amBase').remove();
    wrap.insertAdjacentHTML('beforeend',`<input id="amBase" value="${esc(v)}" placeholder="https://.../anthropic"/>`);$('#amBase').focus();};
  // 要交给服务端的 env:预设 / 卡上的调优,小模型替换后台与子代理两档,默认深度只在选了时写。
  const envOut=()=>{const out={},sm=$('#amSmall').value.trim(),ed=$('#amEffDef').value;
    if(!edit)Object.assign(out,env);
    if(sm&&sm!==small){out.ANTHROPIC_DEFAULT_HAIKU_MODEL=sm;if(env.CLAUDE_CODE_SUBAGENT_MODEL)out.CLAUDE_CODE_SUBAGENT_MODEL=sm;}
    if(ed&&ed!==effDef)out.CLAUDE_CODE_EFFORT_LEVEL=ed;
    return out;};
  $('#amVerify').onclick=async()=>{const vb=$('#amVerify'),o=$('#amVerifyOut');
    if(!edit&&!$('#amKey').value.trim()){o.textContent='先填 API key';o.style.color='var(--fail)';$('#amKey').focus();return;}
    vb.disabled=true;const old=vb.innerHTML;vb.innerHTML='<span class="spin"></span>'+old;o.textContent='';o.style.color='';
    try{const t=await api('/api/providers/test','POST',{name:edit?name:'',baseUrl:$('#amBase').value.trim(),apiKey:$('#amKey').value.trim(),env:{...(edit?{}:env),...envOut()},vision:!$('#amVision').checked,en:langOf()==='en'});
      if($('#amVerifyOut')!==o)return;
      if(t.ok){verified=true;o.textContent=`可用 ✓ · 取到 ${t.count} 个型号，到「群 · 项目」里按群选`;o.style.color='var(--ok)';}
      else{verified=false;o.textContent=t.reason||'没验证通过';o.style.color='var(--fail)';}
      label();
    }catch(e){o.textContent=e.message;o.style.color='var(--fail)';}
    finally{if(document.body.contains(vb)){vb.disabled=false;vb.innerHTML=old;}}};
  $('#amCancel').onclick=closeModal;
  if(edit)$('#amDel').onclick=async()=>{if(!await askConfirm('移除模型 '+name+' ?'))return;try{S=await api('/api/providers?name='+encodeURIComponent(name),'DELETE');toast('已移除','ok');closeModal();renderProviders();}catch(e){toast(e.message,'err');}};
  $('#amSave').onclick=async()=>{const nm=edit?name:$('#amName').value.trim();if(!nm){toast('名称必填','err');$('#amName').focus();return;}
    if($('#amCompMode').value==='custom'&&!$('#amComp').value.trim()){toast('请填写压缩值','err');return;}
    const b={name:nm,baseUrl:$('#amBase').value.trim(),autocompactTokens:$('#amCompMode').value==='default'?0:Number($('#amComp').value),vision:!$('#amVision').checked};
    if(!Number.isInteger(b.autocompactTokens)||b.autocompactTokens<0||($('#amCompMode').value==='custom'&&(b.autocompactTokens<100000||b.autocompactTokens>1000000))){toast('压缩阈值须为 0 或 10万–100万 token','err');return;}
    const k=$('#amKey').value.trim();if(k)b.apiKey=k;
    // 新卡存清单推荐的型号作为默认(群没选时用它);编辑不动卡上存的型号。
    if(!edit)b.model=pr.model;
    const e=envOut();if(Object.keys(e).length)b.env=e;
    if(edit)b.hidden=$('#amHide').checked;
    try{const res=await api('/api/providers/add','POST',b);S=res;
      let msg=edit?'已保存':'已添加 '+nm;if(S.runtimeCapabilities)msg+=runtimeChangeNote(res.providerChange||{});
      toast(msg,'ok');closeModal();renderAll();loadUsage();
    }catch(err){toast(err.message,'err');}};
  setTimeout(()=>{const kf=$('#amKey');if(kf)kf.focus();},0);
}

// unified add / edit model panel (⚙ on a card = edit; 添加模型 = add)
function openProviderModal(name,opts){
  opts=opts||{};
  const p=name?S.providers.find(x=>x.name===name):null, edit=!!p;
  // 清单里的第三方(新建选了它的预设,或编辑认得出的卡):换用上面的 API key 面板。
  if(!opts.plain&&((edit&&keyRouteOf(p))||(!edit&&(PRESETS[opts.preset]||{}).registry))){openKeyRouteModal(name,opts);return;}
  // Codex CLI backend: 无 baseUrl / 无 key / 无 claude 思考深度,订阅登录。
  // 新建时由预设决定(选「GPT via Codex」⇒ 面板整个换形态,靠下面 apply() 里重开一次实现)——
  // 这些字段的**有无**是结构性的,不是显隐,拿 CSS 藏不干净。
  const isCodex=(edit&&p.runner==='codex')||(!edit&&!!opts.codex);
  const cxKey=edit?name:'codex'; // 登录态/额度是**机器级**的,新建时也能验(缓存键先用预设名)
  // Claude 订阅登录:不填端点、不填 key 就是它的正确形态(认证走本机 `claude auth login`)。
  // 官方 API key 按量计费明确不做(产品决定)⇒ 这两个字段对它只会误导,整块不显示。
  const isClaudeLogin=edit&&!isCodex&&!p.baseUrl;
  // ⚠ option 必须写 value:没有 value 时 select.value 读的是**显示文本**,而下面拿它当 PRESETS[key]
  //    查表 —— 界面语言一切成英文,选项文本变了,预设联动就整个失效(逻辑不许依赖显示文本)。
  const preset=edit?'':`<div class="field"><label class="f">预设(自动填端点/模型/调优)</label><select id="amPreset">${Object.keys(PRESETS).map(k=>`<option value="${esc(k)}" data-logo="${esc(modelLogoId(PRESETS[k]))}" ${(opts.preset||'自定义')===k?'selected':''}>${esc(k)}</option>`).join('')}</select></div>`;
  const keyPh=edit?(p.keyStatus==='set'?'已设置 · 留空保持':p.keyStatus==='env'?'env:'+esc(p.keyRef)+' · 留空保持':'粘贴 key'):'粘贴 key(存进本地 gitignored 配置)';
  const compStart=newCardCompact(isCodex);
  const codexNote=isCodex?'<div class="hint" style="margin-bottom:12px">使用本机 ChatGPT 订阅登录，额度与本机 Codex 共享。</div>':'';
  // Durable hosts: model and thinking depth are chosen per group (group card / /model);
  // only a third-party endpoint keeps its model here as connection configuration.
  // 清单里的第三方(按群选型号):编辑时按卡的端点认,新建时按选中的预设认。
  const isKeyRoute=(edit&&!!keyRouteOf(p))||(!edit&&!!(PRESETS[opts.preset]||{}).registry);
  const perGroup=!!S.runtimeCapabilities||isKeyRoute;
  const showModelSec=!edit||!perGroup||(!isCodex&&!isClaudeLogin&&!isKeyRoute);
  $('#modal').innerHTML=`<h3>${edit?'配置 '+esc(name):'添加模型'}</h3>
    ${preset}
    ${codexNote}
    ${showModelSec?`<h4 class="sec">${perGroup?'名称与型号':'型号与推理'}</h4>`:''}
    ${edit?'':'<div class="field"><label class="f" for="amName">名称</label><input id="amName" placeholder="如 glm / my-model"/></div>'}
    ${perGroup?`<div class="hint" style="margin-bottom:12px">型号与思考深度按群在「群·项目」里选${(isCodex||isClaudeLogin||isKeyRoute)?'':'<span id="amModelHint">；这个端点的型号在下面填，各群共用</span>'}。</div>`:''}
    ${isKeyRoute?'':isCodex&&perGroup?'':isCodex?`<div class="field"><label class="f">模型 model</label>
      <select id="amModelSel"><option value="${edit?esc(p.model):''}" selected>${edit&&p.model?esc(p.model):'(未设 — 用 codex 默认)'}</option></select>
      <input id="amModel" value="${edit?esc(p.model):''}" placeholder="如 gpt-5.6-sol" style="display:none;margin-top:8px"/>
      <div class="hint" id="amModelSrc" style="margin-top:4px">加载模型列表…</div></div>`
    :isClaudeLogin&&perGroup?'':isClaudeLogin?`<div class="field" id="clModelWrap"><label class="f">模型 model</label>
      <div class="hint">检测登录中…</div></div>`
    :`<div class="field"><label class="f">模型 model</label><input id="amModel" value="${edit?esc(p.model):''}" placeholder="如 glm-5.2[1m]"/></div>`}
    ${isCodex&&!perGroup?`<div class="field"><label class="f">推理强度</label><select id="amRE">${RE_CODEX.concat(edit&&p.reasoningEffort&&!RE_CODEX.includes(p.reasoningEffort)?[p.reasoningEffort]:[]).map(v=>`<option value="${v}" ${edit&&v===(p.reasoningEffort||'')?'selected':''}>${v||'默认(模型内置)'}</option>`).join('')}</select>
      <div class="hint" style="margin-top:4px">默认沿用模型推荐强度；更高强度通常需要更多时间和额度。</div></div>`:''}
    ${isCodex||perGroup?'':`<div class="field"><label class="f">思考深度</label><select id="amEff">${EFFORTS.map(v=>`<option value="${v}" ${edit&&v===p.effort?'selected':''}>${v||'默认'}</option>`).join('')}</select>
      <div class="hint" style="margin-top:5px">默认沿用模型推荐强度；更高强度通常需要更多时间和额度。</div></div>`}
    <h4 class="sec">上下文与压缩</h4>
    <details class="field"><summary class="hint" style="cursor:pointer">容量与运行信息</summary><div class="dim" id="amWindow" style="padding:9px 0">${edit?esc(providerWindowText(p,true)):'添加后按模型目录或会话上报显示'}</div></details>
    ${isCodex?`<div class="field"><label class="f" for="amContextMode">上下文窗口</label><select id="amContextMode"><option value="default" ${!edit||!p.contextWindowTokens?'selected':''}>执行器默认</option><option value="custom" ${edit&&p.contextWindowTokens>0?'selected':''}>自定义</option></select></div>
      <div class="field" id="amContextField"><label class="f" for="amContext">窗口大小(token)</label><input id="amContext" type="number" min="100000" max="1050000" step="1" value="${edit?(p.contextWindowTokens||500000):500000}"/>
      <div class="hint" id="amContextMax" style="margin-top:5px">${edit&&p.contextWindowMax?esc((langOf()==='en'?'Catalog limit: ':'目录上限：')+fmtContextTokens(p.contextWindowMax)):'自定义值不能超过执行器支持的上限，超出已知上限无法保存。'}</div></div>`:''}
    <div class="field"><label class="f" for="amCompMode">自动压缩</label><select id="amCompMode"><option value="default" ${(edit?p.autocompactTokens:compStart)>0?'':'selected'}>执行器默认</option><option value="custom" ${(edit?p.autocompactTokens:compStart)>0?'selected':''}>自定义</option></select></div>
    <div class="field" id="amCompField"><label class="f" for="amComp">${isCodex?'压缩阈值(token)':'压缩窗口(token)'}</label><input id="amComp" type="number" min="100000" max="1000000" step="1" value="${edit?(p.autocompactTokens||400000):(compStart||400000)}"/>
      <div class="hint" style="margin-top:5px">${isCodex?'自定义阈值为 10万–100万。Codex 可能按当前窗口提前压缩。':'自定义压缩窗口为 10万–100万。Claude Code 会预留空间，可能提前压缩。'}</div></div>
    <div class="hint" style="margin-bottom:14px">默认沿用执行器配置；自定义从下轮生效，保留当前会话。</div>
    <h4 class="sec">连接与登录</h4>
    ${(isCodex||isClaudeLogin)?'':`<div class="field"><label class="f">端点 baseUrl</label><input id="amBase" value="${edit?esc(p.baseUrl):''}" placeholder="https://.../anthropic"/></div>`}
    ${(isCodex||isClaudeLogin)?'':`<div class="field"><label class="f">API key</label><input id="amKey" placeholder="${keyPh}"/></div>`}
    ${isClaudeLogin?`<div class="field"><label class="f">Claude 订阅登录</label>
      <div id="clStatus" class="statbox">${clStatusHtml()}</div>
      <button class="btn" id="clVerify" style="margin-top:8px" title="检测登录"><span>检测</span></button> ${rlBoxHtml('claude')}
      <div class="hint" id="clModelsNote" style="margin-top:6px;display:none"></div>
      <div class="hint" id="clCli" style="margin-top:6px;display:none"></div>
      <div class="hint" style="margin-top:6px">检查本机 Claude Code 登录状态，不发起模型对话。</div></div>`:''}
    ${isCodex?`<div class="field"><label class="f">Codex 订阅登录 / 额度</label>
      <div id="cxStatus" class="statbox">${cxStatusHtml(cxKey)}</div>
      <button class="btn" id="cxVerify" style="margin-top:8px" title="验证登录 / 刷新额度"><span>验证</span></button> ${rlBoxHtml('codex')}
      <div class="hint" id="cxModelsNote" style="margin-top:6px;display:none"></div>
      <div class="hint" id="cxCli" style="margin-top:6px;display:none"></div>
      <div class="hint" style="margin-top:6px">显示本机账号返回的额度与重置时间，不发起模型对话。</div></div>`:''}
    ${(isCodex||isClaudeLogin)?'':`<div class="inline" style="margin:2px 0 2px"><input type="checkbox" class="switch" id="amVision" ${edit&&p.vision===false?'checked':''}/> <span class="dim">此模型不支持识图(纯文本模型)</span></div>
      <div class="hint" style="margin:0 0 10px">勾选后,送给它的图片(群里发的图、网页截图、读取的图片文件)会自动降级成一句占位文本 —— 不勾则整轮会被模型以「只支持文本输入」打断。拿不准就先跑一轮试:报这个错就回来勾上。</div>`}
    ${edit?`<div class="inline" style="margin:2px 0 10px"><input type="checkbox" class="switch" id="amHide" ${p.hidden?'checked':''}/> <span class="dim">在列表中隐藏此模型</span></div>`:''}
    <div class="mfoot" style="justify-content:space-between">
      ${edit?'<button class="btn ghost" id="amDel" title="移除"><span>移除</span></button>':'<span></span>'}
      <div class="inline"><button class="btn" id="amCancel" title="取消">${IC.x}<span>取消</span></button><button class="btn primary" id="amSave" title="${edit?'保存':'添加'}">${edit?IC.check+'<span>保存</span>':IC.plus+'<span>添加</span>'}</button></div></div>`;
  $('#modalBg').classList.add('show');
  $('#modal').oninput=null;$('#modal').onchange=null;
  const syncMode=(id,field)=>{$('#'+field).hidden=$('#'+id).value!=='custom';};
  $('#amCompMode').onchange=()=>syncMode('amCompMode','amCompField');$('#amCompMode').onchange();
  if(isCodex){$('#amContextMode').onchange=()=>syncMode('amContextMode','amContextField');$('#amContextMode').onchange();}
  if(edit){
    const refreshWindow=()=>{const sel=$('#amModelSel'),input=$('#amModel');const selected=sel&&sel.value!=='__custom__'?sel.value:input?.value?.trim();
      const box=$('#amWindow');if(box)box.textContent=selected===(p.model||'')?providerWindowText(p,true):'新型号保存后刷新';
      const maximum=$('#amContextMax');if(maximum)maximum.textContent=selected===(p.model||'')&&p.contextWindowMax?(langOf()==='en'?'Catalog limit: ':'目录上限：')+fmtContextTokens(p.contextWindowMax):(langOf()==='en'?'The selected model limit will be checked on save.':'保存时核对所选型号的上限。');};
    $('#modal').oninput=e=>{if(e.target.id==='amModel'||e.target.id==='amModelSel')refreshWindow();};
    $('#modal').onchange=e=>{if(e.target.id==='amModel'||e.target.id==='amModelSel')refreshWindow();};
  }
  if(!edit){const apply=()=>{const key=$('#amPreset').value,pr=PRESETS[key]||{};
    // ⚠ codex 形态是**结构性**的(没有端点/key/思考深度,多出模型下拉与订阅额度),
    //   靠显隐凑不出来 ⇒ 切换时原地重开一次面板,把选中的预设带过去。
    if(!!pr.runner!==!!isCodex||!!pr.registry!==!!isKeyRoute){openProviderModal(null,{codex:pr.runner==='codex',preset:key});return;}
    const $b=$('#amBase'),$m=$('#amModel');
    if(pr.name)$('#amName').value=pr.name;if(pr.baseUrl&&$b){$b.value=pr.baseUrl;if($m)$m.value=pr.model||'';}
    // 订阅登录预设:端点/key 清空并隐藏 —— 留着只会让人以为"还得填点什么"。
    // 型号也清空:新建时先跟随 Claude Code 默认,要钉死进卡片 ⚙ 里选(那儿才有真清单)。
    if(pr.login){if($b)$b.value='';if($m)$m.value='';const kf=$('#amKey');if(kf)kf.value='';}
    // 型号输入框也一起藏:订阅登录新建时跟随 Claude Code 默认,型号按群在「群·项目」里选(或进卡片 ⚙ 钉死)。
    for(const [el,hide] of [[$('#amBase'),!!pr.login],[$('#amKey'),!!pr.login],[$m,!!pr.login]]){const f=el&&el.closest('.field');if(f)f.style.display=hide?'none':'';}
    const mh=$('#amModelHint');if(mh)mh.style.display=pr.login?'none':'';
    const vb=$('#amVision');if(vb){vb.checked=pr.vision===false;const w=vb.closest('.inline');if(w)w.style.display=pr.login?'none':'';const h=w&&w.nextElementSibling;if(h&&h.classList.contains('hint'))h.style.display=pr.login?'none':'';}
    if($('#amEff'))$('#amEff').value=pr.env?.CLAUDE_CODE_EFFORT_LEVEL||'';
    $('#amPreset').dataset.env=JSON.stringify(pr.env||{});};$('#amPreset').onchange=apply;apply();}
  // Claude 订阅登录:先探登录态,登录了才画模型下拉 —— 没登录时**一个型号都不列**
  // (列了也没意义:没登录任何型号都跑不起来,还会让人以为只差选个模型)。
  if(isClaudeLogin){
    const paintModels=(d)=>{
      const wrap=$('#clModelWrap');if(!wrap)return;
      const cur=p.model||'';
      if(!d||!d.loggedIn){
        wrap.innerHTML='<label class="f">模型 model</label>'
          +'<div class="hint">未登录,暂不列型号 —— 先在这台机器上跑一次 <span class="mono">claude auth login</span>,再回来点下方「检测登录」。'
          +(cur?'<br>当前配置里写的是 <span class="mono">'+esc(cur)+'</span>(保存时保持不变)。':'')+'</div>';
        return;
      }
      const list=d.models||[];
      wrap.innerHTML='<label class="f">模型 model</label>'
        +`<select id="amModelSel">${claudeModelOptions(list,cur)}</select>`
        +`<input id="amModel" value="${esc(cur)}" placeholder="如 claude-opus-5" style="display:${list.some(m=>m.id===cur)?'none':'block'};margin-top:8px"/>`
        +`<div class="hint" style="margin-top:5px"><b>默认(跟随 Claude Code)</b> = 不指定型号,用这台机器上 Claude Code 自己的默认 —— 随 CLI 升级自动跟上,不会停在某一代。`
        +(d.source==='account'?' ★ = 你账号额外可用的型号。':'')
        +` 清单是挑选快捷方式,能用什么以 Claude Code 里 <span class="mono">/model</span> 为准;要别的型号选「自定义…」直接填。</div>`;
      const sel=$('#amModelSel'),inp=$('#amModel');
      if(sel)sel.onchange=()=>{const c=sel.value==='__custom__';inp.style.display=c?'':'none';if(c){inp.value='';inp.focus();}};
    };
    (async()=>{try{paintModels(await api('/api/claude/models'));}catch(e){paintModels(null);}})();
    loadClaudeCli();
    const btn=$('#clVerify');
    if(btn)btn.onclick=async()=>{const t=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spin"></span>'+t;
      try{const r=await api('/api/claude/verify','POST',{force:true});S.claudeStatus=r;
        const box=$('#clStatus');if(box)box.innerHTML=clStatusHtml();
        try{paintModels(await api('/api/claude/models'));}catch{} // 刚登录完点它 ⇒ 型号随即出现
        renderProviders();  // 卡片 chip 同步
        toast(r.ok?(r.loggedIn?'已登录'+(r.plan?' · '+r.plan:''):'未登录 — 在这台机器上跑 claude auth login'):'未验证 — '+(r.error||''), (r.ok&&r.loggedIn)?'ok':'err');
        if(r.ok&&r.loggedIn&&runtimeAllows('POST','/api/models/refresh')){await refreshModelList('claude',$('#clModelsNote'));}
      }catch(e){toast(e.message,'err');}finally{btn.disabled=false;btn.innerHTML=t;}};

/* ── 风格图标 ────────────────────────────────────────────────────────────────
   服务端(src/design.js swatchLayout)算好的图元表 → SVG。这里**只做 rect → <rect> 的机械映射**:
   群里那张 PNG 走的是同一份 layout,一旦在这儿自己算坐标,两端就会各画各的 —— 而「控制台的图标
   和群里发出去的不一样」这种不一致,用户根本不会当成 bug 报上来。
   rx 要在这里 clamp:SVG 规范把 rx 收到 width/2、ry 收到 height/2 ⇒ 胶囊哨兵(9999)在宽扁的
   按钮上会渲成椭圆,而光栅器给的是两端半圆。取 min(r, w/2, h/2) 才和 PNG 一致。 */
let SWG=0; /* 渐变 id 计数:一页上会有十几张风格图,defs 的 id 重了后面那张会去用前面那张的渐变 */
function swatchSvg(lay,w,style){
  if(!lay||!lay.rects)return'';
  const h=Math.round(w*lay.h/lay.w);
  /* 渐变(v0.11.22):图元多带一个 grad 就画成线性渐变。角度公式与光栅那侧**同一个向量**
     (CSS 口径:0deg 自下而上、90deg 自左向右)—— 各写一份就会出现「控制台朝右下、群里朝右上」。 */
  let defs='';
  const fillOf=r=>{
    if(!r.grad)return esc(r.fill);
    const id='swg'+(++SWG),a=(Number(r.grad.angle)||0)*Math.PI/180,dx=Math.sin(a),dy=-Math.cos(a);
    defs+=`<linearGradient id="${id}" x1="${(.5-dx/2).toFixed(3)}" y1="${(.5-dy/2).toFixed(3)}" x2="${(.5+dx/2).toFixed(3)}" y2="${(.5+dy/2).toFixed(3)}">`
      +`<stop offset="0" stop-color="${esc(r.fill)}"/><stop offset="1" stop-color="${esc(r.grad.to)}"/></linearGradient>`;
    return `url(#${id})`;
  };
  const body=lay.rects.map(r=>{const rr=Math.min(r.r,r.w/2,r.h/2);const f=fillOf(r);
    return `<rect x="${r.x.toFixed(2)}" y="${r.y.toFixed(2)}" width="${r.w.toFixed(2)}" height="${r.h.toFixed(2)}"${rr>0?` rx="${rr.toFixed(2)}"`:''} fill="${f}"/>`;}).join('');
  return `<svg viewBox="0 0 ${lay.w} ${lay.h}" width="${w}" height="${h}" aria-hidden="true" style="display:block;flex:none;${style||''}">`
    +(defs?`<defs>${defs}</defs>`:'')+body+'</svg>';
}
/* 群卡「图标」行那排缩略图。⚠ **异步填充**:群卡是同步渲染的,先留空位、拉回来再填 ——
   把整块渲染卡在一个网络请求上,换来的是每次刷新群卡都要闪一下。
   ⚠ 同一份 svg 在两处按不同尺寸画(库里 22px / 群卡 18px):尺寸由外层格子定,svg 撑满它。 */
async function paintGroupIconStrips(){
  const slots=$$('#gsheet [data-sysstrip]'); if(!slots.length)return;
  const lib=await ensureIconLib();
  const by={}; for(const s of ((lib&&lib.systems)||[]))by[s.system]=s;
  for(const el of slots){
    const s=by[el.dataset.sysstrip];
    // 取不到就如实说,不留空排 —— 空排会被读成「这套系统没有图标」
    if(!s||!s.icons||!s.icons.length){el.innerHTML='<span class="hint" style="font-size:11px">样张取不到</span>';continue;}
    /* 按生效形态取样张。⚠ **「要实心但这套没有实心」必须当场说破**:那时真正取到的是线性
       (iconStyleGap 说的就是这条),界面若跟着声明画一排线性还标着「实心」,就成了
       「声明与事实不符」——本项目最贵的一类 bug,而且这行本来是用来看「现在长什么样」的。 */
    const wantFilled=el.dataset.sysstyle==='filled';
    const hasFilled=!!(s.filled&&s.filled.length);
    const use=wantFilled&&hasFilled?s.filled:s.icons;
    el.innerHTML=(wantFilled&&!hasFilled?'<span class="chip warn" style="flex:none" title="风格档/图标档声明的是实心,但这套系统没有实心目录 —— 实际取到的是下面这排线性图">这套没有实心</span>':'')
      +use.map(i=>`<span title="${esc(i.sem+' → '+i.name)}" style="flex:none;width:18px;height:18px">${i.svg}</span>`).join('');
  }
  const box=$('#gsheet'); if(box)fitStrips(box);
}

/* 图标库(只读):代码里预先整理好的两套系统,**不开放自定义**(2026-08-25 拍板)。
   ⭐ 与设计风格库**平级** —— 它回答的是「图形从哪来、叫什么名」,风格回答「怎么画它」;
   一个项目分别选,换风格不该把图标一起换掉。
   ⚠ 每套配 8 个**真实渲染**的图标做样张:挑哪套是「认不认得出」的判断,断言判不了,
   必须按真实尺寸摆出来看(教训 31)。而这 8 个正是实测两库几何全不同的那几个 ——
   把它们并排放,「换一套到底换了什么」一眼就有答案。
   ⚠ 图标包不随产品分发(四套合计约 160MB) ⇒ 没装的如实标「未安装」,不留空白(空白会被读成「这套是空的」)。*/
let iconLib=null;
let iconLibFoldOpen=false;
/* 取一次就缓存。⚠ 样张是**系统的属性、不是项目的属性** ⇒ 它不进 /api/state 那条 15s 心跳:
   塞进去就是每个绑定群每次心跳多读 8 个 svg、多背几 KB,而这份数据全部群共用同一套。
   群卡「图标」行那排缩略图因此也走这里,前端按系统名对上 —— 同一份数据两处用,服务端零额外开销。*/
async function ensureIconLib(){
  if(iconLib)return iconLib;
  try{iconLib=await api('/api/design/icons');}catch(e){iconLib=null;}
  return iconLib;
}
async function loadIconLib(){
  const box=$('#iconLib'); if(!box)return;
  await ensureIconLib();
  if(!iconLib){box.innerHTML='<div class="card"><div class="hint">图标库读取失败</div></div>';return;}
  /* 一排样张:左边一个窄标签说这排是什么形态,右边是图 + 它在这套系统里的名字。
     名字必须跟着图走 —— 「换一套系统连叫法都变了」是这张卡最该传达的一件事,
     而只看图看不出 house / home 的区别。 */
  /* 一排样张:标签独立成行 + 图标**定宽格子**平铺。
     ⚠ 定宽是「按卡片宽度自适应」的前提 —— 格子等宽,能摆几个才算得出来;图标名因此从格子里
     撤掉(名字宽度各不相同,留着就没法算),改成行下面那句「叫法」,一行说清两套的差别。
     实际画几个由 fitStrips() 在**布局之后**按真实宽度决定(见下),这里先全画出来。 */
  const CELL=22, GAP=13;
  const strip=(label,icons,note)=>`
    <div style="margin-top:11px;min-width:0">
      <div class="hint" style="font-size:11px;opacity:.6;margin-bottom:6px">${label}</div>
      ${icons.length
        ? `<div class="iconstrip inline" data-cell="${CELL}" data-gap="${GAP}" style="gap:${GAP}px;flex-wrap:nowrap;overflow:hidden;color:var(--ink);min-width:0">${icons.map(i=>
            `<span title="${esc(i.sem+' → '+i.name)}" style="flex:none;width:${CELL}px;height:${CELL}px">${i.svg}</span>`).join('')}</div>`
        : `<span class="hint faint" style="font-size:11px">${note}</span>`}
    </div>`;
  /* 叫法那一句:同一个语义在两套系统里叫什么。**这是「换一套等于换一整套名字」的证据**,
     从格子里撤掉名字后由它承担。只挑差得最明显的三个,多了就成噪音。 */
  const naming=s=>{const pick=['more','home','delete'].map(k=>(s.icons.find(i=>i.sem===k)||{}).name).filter(Boolean);
    return pick.length?`<div class="hint faint" style="margin-top:9px;font-size:11px">叫法:${pick.map(esc).join(' · ')}</div>`:'';};
  const card=s=>`
    <div class="card" style="min-width:0">
      <div class="inline" style="gap:8px;align-items:baseline;flex-wrap:wrap">
        <span style="font-size:13px;font-weight:600">${esc(s.label)}</span>
        ${s.installed?`<span class="hint" style="font-size:11px">${s.count?esc(String(s.count))+' 个图标 · ':''}语义名 ${s.semantics} 条${s.fallbackLibrary?' · 兜底 '+esc((iconLib.systems.find(x=>x.library===s.fallbackLibrary)||{}).label||s.fallbackLibrary):''}</span>`
          :'<span class="chip warn" title="这套的图标包没装在这台机器上(几个包合计约 160MB,不随产品分发)—— 别的功能不受影响,但选了它取图标会取不到。装一次即可">未安装</span>'}
      </div>
      ${s.installed
        ? strip('线性',s.icons,'')+strip('实心',s.styles.includes('filled')?s.filled:[],'这套没有实心 —— 要实心得选另一套')+naming(s)
        : `<div class="hint faint" style="margin-top:10px;font-size:11px">装上 ${esc(s.pkg)} 后这里会出样张</div>`}
    </div>`;
  box.innerHTML=`<div class="grid cols2 stagger">${(iconLib.systems||[]).map(card).join('')}</div>`
    +`<div class="hint faint" style="margin-top:8px">每套的画法<b>逐个都不一样</b>,连叫法都不同(同一个「更多」:more-horizontal / dots / dots-three)—— 换一套是换一整套图形和名字,不是换个皮肤。已选的那套写在项目里,跟着代码走</div>`;
  fitStrips(box);
}
/* 一行画几个图标 —— **按卡片实际宽度算,不写死个数**。
   ⚠ 只能在布局之后量:innerHTML 刚写完时 clientWidth 是最终值(同步布局),但窗口一变、
   侧边一收,同一张卡的宽度就变了 ⇒ 必须挂 ResizeObserver 跟着重算,否则窄屏下这排图会被
   `overflow:hidden` 齐刷刷切掉半个图标(比少画几个难看得多)。
   ⚠ 同一张卡的线性排与实心排取**同一个 n**:两排是要逐列对照看的,各算各的就错位了。 */
function fitStrips(box){
  // ⚠ **观察这一排本身,不是外面的卡片** —— 实测:把容器压窄时,这一排从 306px 掉到 53px,
  //   而挂在卡片上的 ResizeObserver **一次都没触发**(卡片宽度没变,变的是排内可用空间)。
  //   判据挂错对象的表现是「窄屏下图标被 overflow:hidden 切掉半个」,而那比少画几个难看得多。
  const calc=(s)=>{
    const w=s.clientWidth; if(!w)return; // 页面还没显示时宽度为 0:先不动,等 RO 拿到真实宽度再算
    // 格子尺寸**每排自带**:图标库那张卡 22px,群卡缩到 18px —— 写死一个常量必然有一处算错
    const CELL=+(s.dataset.cell||22), GAP=+(s.dataset.gap||13);
    const n=Math.max(1,Math.floor((w+GAP)/(CELL+GAP))); // 最后一个格子后面不占 gap
    [...s.children].forEach((el,i)=>{el.style.display=i<n?'':'none';});
  };
  const strips=[...box.querySelectorAll('.iconstrip')];
  strips.forEach(calc);
  // ⚠ **不能只靠 ResizeObserver**:实测这页上它连初次回调都不给(卡片 454→206、这一排 279→58,
  //   两个 RO 各 0 次)。⇒ 关键时刻**确定性地重算一次**:刚画完时页面可能还没显示(宽度为 0),
  //   下一帧再补一次;切页与改窗口大小各再算一次。RO 留着当锦上添花,不当依靠。
  requestAnimationFrame(() => strips.forEach(calc))
  if(window.ResizeObserver){
    const ro=new ResizeObserver(es=>{for(const e of es)calc(e.target);});
    strips.forEach(s=>ro.observe(s));
    if(box._iconRO)box._iconRO.disconnect(); // 重画时把上一批观察者收掉,别越攒越多
    box._iconRO=ro;
  }
  if(!window._iconFitBound){ // 只绑一次:每次重画都绑会越攒越多
    window._iconFitBound=1

    addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(refitAllStrips,120)})

}
// 全部样张排重算一次。切页 / 改窗口大小 / 数据到齐后各调一次 —— 这三处正是「刚画的时候宽度还不对」
// 的全部来源,而宽度不对的表现是被 overflow:hidden 切掉半个图标。
function refitAllStrips(){for(const id of ['#iconLib','#gsheet']){const b=$(id);if(b)fitStrips(b);}}
/* 风格库(只读):内置预设 + ~/.sbot/design-styles 自定义。 */
let styleLib=null;
let styleLibFoldOpen=false;
async function loadStyleLib(){
  const box=$('#styleLib'); if(!box)return;
  if(styleLib){paintStyleLib();return;}
  try{const _r=await api('/api/design/styles');styleLib=_r;registerStyleI18n(_r.styles);paintStyleLib();}
  catch(e){box.innerHTML=`<div class="card"><div class="hint">风格库读取失败:${esc(e.message)}</div></div>`;}

/* 风格的英文名与一句话写在各自的风格档里(name_en / description_en),这里登记进翻译表 ——
   卡片照旧按中文渲染,英文界面由那套 MutationObserver 逐节点换掉,切回中文也是同一条路。
   「适合 · 内容阅读 · 品牌门面」那行按 · 分段逐段译,场景词的译文在 I18N_EN 里。 */
function registerStyleI18n(list){
  for(const s of list||[]){
    if(s.name&&s.nameEn&&s.name!==s.nameEn)I18N_MAP.set(s.name,s.nameEn);
    if(s.description&&s.descriptionEn&&s.description!==s.descriptionEn)I18N_MAP.set(s.description,s.descriptionEn);
  }
}
/* 启动后在后台登记一次:群卡上的项目风格名多半照抄自内置预设,英文界面里也要换掉 —— 不能等人点开「模型 · 库」才登记。
   只登记一次(styleLib 已有就跳过);取不到就算了,风格库那页打开时还会再取。 */
let styleI18nAsked=false;
function preloadStyleI18n(){
  if(styleI18nAsked||styleLib)return; styleI18nAsked=true;
  api('/api/design/styles').then(r=>{if(!styleLib)styleLib=r;registerStyleI18n(r.styles);if(langOf()==='en')applyI18n(document.body);}).catch(()=>{styleI18nAsked=false;});
}
function paintStyleLib(){
  const box=$('#styleLib'); if(!box||!styleLib)return;
  // 特征标签只标「有性格」的信号:衬线/深色/等宽/圆角值 —— 「无衬线」「直角」是大多数的常态,
  // 8 张卡有 6 张挂同一个标签就成噪音了(常态不用说,例外才值得标)。
  const feat=s=>[s.source==='user'?'<span class="tag">自定义</span>':'',
    /* 载体单独一枚驼色标(v0.11.22):它不是「特征」而是**分类** —— 标了就说明这套只服务
       那种载体,是挑档时第一眼要看的东西。绝大多数风格不标(通用),所以它一出现就有信息量。 */
    s.platform?`<span class="chip tan" title="这套风格是按这个载体定的(小程序与后台网站的圆角、间距、字号本就不该一样)">${esc(s.platform)}</span>`:'',
    s.dark?'<span class="chip cap" title="底色为深色">深色</span>':'',
    s.serif?`<span class="chip cap" title="${esc(s.fontStack||'')}">衬线</span>`:'',
    s.mono?'<span class="chip cap" title="字体族里有等宽(代码/数据)">等宽</span>':'',
    /* ⚠ 只标**不走常规那一路**的那几套(裁决在服务端 cjkState 三态,别在这儿判)——
       那个词的权威在 design.js 的 CJK_KIND_RE,前端抄一份必然漂移。常规那路是压倒性
       常态:18 张卡 12 张,标了就违反上面那条「常态不用说」,还把该看见的 6 张淹掉。
       第三态「未声明」是给自建档留的防线:v0.11.65 曾把它与「走黑体」合成同一个不标。 */
    s.cjkState==='exception'?`<span class="chip cap" title="这套风格的汉字不走黑体那条常规路(混用时按出现顺序列出)· 没有这枚标签 = 走系统黑体">中文${esc((s.cjkKinds||[]).join('·'))}</span>`
      :s.cjkState==='missing'?`<span class="chip cap" title="这份档写了字体,但栈里一个中文族都没有 —— 汉字会掉到浏览器默认字体,不受这套风格控制(纯英文产品可忽略)">中文未声明</span>`:'',
    s.radius>=100?'<span class="chip cap">胶囊圆角</span>':(s.radius>0?`<span class="chip cap">圆角 ${s.radius}px</span>`:''),
    /* ⚠ 这里**故意不标图标库**(2026-08-25 拿掉了 v0.11.52 那枚 chip):图标库与设计风格
       **平级** —— 用哪套图标是**项目**的选择(见下面「图标库」那一节 + 群卡的「图标」行),
       不是这份风格档的属性。在风格卡上标「图标 tabler」会让人以为换风格就换图标,
       而那正是要拆开的绑定。风格只管**怎么画**图标,那是下面这枚描边标签。 */
    s.icons&&s.icons.strokeWidth?`<span class="chip cap" title="${esc('这套风格里图标的画法:'+(s.icons.style==='filled'?'实心':'线性')+' · 描边 '+s.icons.strokeWidth+' · 端点 '+(s.icons.linecap||'round')+(s.icons.sizes?' · 尺寸档 '+s.icons.sizes+' 个':'')+'。图形从哪来是另一件事,由项目的图标系统决定')}">图标描边 ${esc(String(s.icons.strokeWidth))}</span>`:''].filter(Boolean).join('');
  const card=s=>{const ft=feat(s);return `
    <div class="card" style="min-width:0" data-slug="${esc(s.slug)}">
      <div class="inline" style="gap:14px;align-items:flex-start">
        ${swatchSvg(s.layout,106)}
        <div style="min-width:0;flex:1">
          <div class="inline" style="gap:7px;align-items:baseline;flex-wrap:wrap">
            <span style="font-size:13px;font-weight:600">${esc(s.name||s.slug)}</span>${ft}</div>
          <div class="hint" style="margin-top:5px">${esc(s.description||'—')}</div>
          ${s.suits?`<div class="hint" style="margin-top:5px;opacity:.8">适合 · ${esc(s.suits)}</div>`:''}
          <div class="inline" style="gap:4px;flex-wrap:wrap;margin-top:9px">${(s.palette||[]).map(c=>
            `<span title="${esc(c.key)}: ${esc(c.hex)}" style="width:13px;height:13px;border-radius:2px;background:${esc(c.hex)};box-shadow:inset 0 0 0 1px var(--line);flex:none"></span>`).join('')}</div>
          <div class="inline" style="gap:6px;flex-wrap:wrap;margin-top:10px">
            ${s.source==='user'?`<button class="btn primary ic-only" data-styleedit="${esc(s.slug)}" title="改这一套本身(存回同一个名字)—— 正文默认原样保留,除非你勾「按新设定重写正文」" aria-label="修改">${IC.pencil}</button>`:''}
            <button class="btn ic-only" data-styledup="${esc(s.slug)}" title="以这一套为起点建一个**新的**:色板、圆角、字重都预填好,改成自己的即可(原来那套不动)" aria-label="复制为新款">${IC.copy}</button>
            ${s.source==='user'?`<button class="btn ghost" data-styledel="${esc(s.slug)}" title="从风格库移除这一套(只删自己建的)"><span>删除</span></button>`:''}
          </div>
        </div></div>
    </div>`;};
  /* 自定义排最前,并与内置预设**分成两块** —— 库里内置十几种,自己建的那两三套按字母混在
     中间就得逐个找,而它们恰恰是最常用的。次序由服务端 listStyles 定(同一份也管 CLI 那侧的
     组内先后),这里只按 source 切块,前端不自己排。
     ⚠ 分组标题只在**有**自定义时才出现:一套都没有时,孤零零一个「内置预设」标题是纯噪音
     —— 与上面特征标签同一条判据:常态不用说,例外才值得标。 */
  const all=styleLib.styles||[];
  const mine=all.filter(s=>s.source==='user'),stock=all.filter(s=>s.source!=='user');
  const grid=arr=>`<div class="grid cols2 stagger">${arr.map(card).join('')}</div>`;
  const head=(label,n,note,top)=>`<div class="inline" style="gap:9px;align-items:baseline;margin:${top}px 0 8px">
      <span style="font-size:13px;font-weight:600;color:var(--ink)">${label}</span>
      <span class="hint">${n} 套${note?' · '+note:''}</span></div>`;
  const body=!all.length?'<div class="empty">风格库是空的</div>'
    :!mine.length?grid(stock)
    :head('自定义',mine.length,'这台机器上配的 · 全部群都能用',0)+grid(mine)+head('内置预设',stock.length,'',26)+grid(stock);
  box.innerHTML=body+`
    <div class="hint faint" style="margin-top:8px">「${IC.plus} 新建风格」配一套自己的(比如把公司品牌色配成一款)· 已经在某个项目里打磨好的那份,可在「群·项目」页那个群的「设计风格」行收录进来</div>`;
  /* 卡片动作走事件委托:整块会被「重新扫描 / 保存 / 删除」反复重画,逐个 onclick 绑定
     每次都要重来一遍,而委托只绑一次在容器上(容器本身不重建)。 */
  box.onclick=async(e)=>{
    /* 修改 = 改这一套本身(存回同一个 slug);复制为新款 = 拿它当起点建**另**一套。
       两者预填数据同源,差别全在 openStyleModal 的模式上。 */
    const ed=e.target.closest('[data-styleedit]');
    if(ed){const s=(styleLib.styles||[]).find(x=>x.slug===ed.dataset.styleedit);if(s)openStyleModal(s.form||null,{edit:s});return;}
    const dup=e.target.closest('[data-styledup]');
    if(dup){const s=(styleLib.styles||[]).find(x=>x.slug===dup.dataset.styledup);if(s)openStyleModal(s.form||null,{from:s});return;}
    const del=e.target.closest('[data-styledel]');
    if(!del)return;
    const slug=del.dataset.styledel;
    const s=(styleLib.styles||[]).find(x=>x.slug===slug);
    if(!await askConfirm('从风格库移除「'+((s&&s.name)||slug)+'」?\n项目里已经用上它的那些不受影响。'))return;
    del.disabled=true;
    try{const r=await api('/api/design/styles','DELETE',{slug});
      styleLib=null;await loadStyleLib();
      toast(r.revertedToBuiltin?'已移除 · 同名的内置风格重新可用':'已从风格库移除','ok');
    }catch(err){toast(err.message,'err');if(document.body.contains(del))del.disabled=false;}
  };
}

/* ── 新建 / 复制自定义风格 ────────────────────────────────────────────────────
   为什么是「配一套」而不是「传一份文档」:operator 手里有品牌色和对气质的直觉,没有一份写好的
   规范 —— 那套 front matter 格式是实现细节,不该要求人手写。所以入口是六项表单,系统去编档。
   右列**实时预览**是这张表单的全部价值所在:每一项都对应预览图上的一条通道,改哪儿图上立刻变哪儿。
   ⚠ 预览图元一律由服务端算(POST /api/design/preview → 现成的 swatchSvg 画)—— 布局逻辑只许
   有一份,前端自己算坐标就会和群里发出去的那张 PNG 长得不一样,而这种不一致没人会当 bug 报。 */
const NS_SCENES=['内容阅读','品牌门面','工具产品','活动推广','生图插画'];
/* 载体与场景是两个轴:场景答「做什么」、载体答「在哪儿看」。留空 = 载体无关(常态)。
   ⚠ 词表与服务端 design.js 的 PLATFORM_WORDS 必须一致 —— 那侧是权威(落盘校验按它);
   这里多一个词,人挑得到却存不进去。 */
const NS_PLATFORMS=['小程序','后台网站','网页前台','移动 App','印刷物料'];
const NS_ROUNDS=[['sharp','直角'],['subtle','微圆'],['soft','柔圆'],['pill','胶囊']];
/* 三样有预览通道的属性(v0.11.22)。⚠ 档位 id 与服务端 ELEV_LEVELS / STATUS_KEYS 必须一致 ——
   那侧是权威(落盘校验按它),这边多一个档,人选得到却存不进去。 */
const NS_ELEVS=[['none','无'],['flat','轻'],['soft','明显'],['color','彩色']];
const NS_STATUS=[['success','成功'],['warning','警告'],['danger','危险']];
const /* ⚠ 三个默认值必须过 WCAG AA 正文(配白底 ≥4.5:1)—— 它们会直接落进用户建的档,
   而 `design doctor` 会把不达标的报成硬问题 ⇒ 那个项目此后每次交付都多一行常驻噪音。
   审计实测:旧值 warning #D4A017 = 2.38:1 · danger #E53935 = 4.23:1,两个都不达标。
   新值同色相压明度(#B45309 = 5.02 · #C62828 = 5.62),不是另挑一个能过线的颜色。 */
NS_STATUS_DEF={success:'#2E7D32',warning:'#B45309',danger:'#C62828'};
const NS_WEIGHTS=[['light','轻'],['medium','中'],['heavy','重']];
/* ⚠ 字体不在表单里选(2026-09-02 产品决定去掉整个「字体」栏):中文字体是低频决定,占一格不值;
   要换字体在群里说一句更省事。生成的档恒定用一套**系统字体优先**的栈,见服务端 SANS_STACK。
   ⚠ 手写的内置档不受此限 —— 新中式该用宋体、precision-mono 该用等宽,那是它们的设计身份。 */
const NS_CKEYS=[['bg','底色'],['ink','文字'],['accent','强调'],['muted','次要']];
const NS_BLANK={name:'',description:'',suits:[],platforms:[],colors:{bg:'#FFFFFF',ink:'#1A1D24',accent:'#6D28D9',muted:'#6B7280'},rounded:'subtle',weight:'medium',elevation:'flat',gradientTo:'',statusColors:null};
let nsTimer=null,nsSeq=0;
/* 提炼带回来的两样东西,存在这里而不是 DOM 上:
   nsExtra = 补充色 [{hex,count,on}](勾选态就是 on) · nsTokens = 字距/描边/间距/字号/行高
   两者都随 nsReadForm() 一起进预览与保存;弹窗每次打开都重置(见 openStyleModal)。 */
let nsExtra=[],nsTokens=null,nsSug=null;
/* 标识的形状。**本文件里只此一份** —— 建风格、收录、由名称推标识三处原本各写一份同样的
   字面量,改一处漏两处是迟早的事。(与服务端 design.js 那份跨端重复是架构现状,不在这里解) */
const NS_SLUG_RE=/^[a-z0-9][a-z0-9-]{0,40}$/;
/* 颜色文本框的归一,与服务端 _normHex 同判:#abc 展开成 #AABBCC,认不出返回 null。
   ⚠ 认不出时**不许**静默退回取色器的现值 —— 那等于替用户存下一个他没打算要的颜色,
   而且全程零提示(v0.11.21 审查)。归一给预览用,拦截在保存那一步。 */
const NS_HEX_RE=/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/;
function nsNormHex(v){
  const m=NS_HEX_RE.exec(String(v==null?'':v).trim());
  if(!m)return null;
  const h=m[1];
  return '#'+(h.length===3?h[0]+h[0]+h[1]+h[1]+h[2]+h[2]:h).toUpperCase();
}
/* 压深一个色(勾上「用渐变」时给的起点值)。只服务这一个交互 —— 落盘的渐变两端色以表单为准,
   服务端不做任何派生,所以这里算得糙一点也不会让档和图对不上。 */
function nsDarken(hex,t){
  const n=nsNormHex(hex);if(!n)return'#000000';
  const c=[1,3,5].map(i=>parseInt(n.slice(i,i+2),16));
  return '#'+c.map(v=>Math.round(v*(1-t)).toString(16).padStart(2,'0')).join('').toUpperCase();
}
/* 四个色框逐个查,返回第一处非法的标签(全合法 ⇒ null)。红字提示与保存拦截共用它。 */
function nsHexCheck(){
  let bad=null;
  for(const [k,l] of NS_CKEYS){
    const t=$('#nsHex_'+k);if(!t)continue;
    const ok=!!nsNormHex(t.value);
    t.style.borderColor=ok?'':'var(--fail)';
    if(!ok&&!bad)bad=l;
  }
  const el=$('#nsColErr');
  if(el){
    el.style.display=bad?'block':'none';
    el.innerHTML=bad?'<span style="color:var(--fail)">'+bad+'不是合法的颜色值 —— 写成 #RRGGBB 或 #RGB;没改对之前存不进去</span>':'';
  }

/* 名称 → 建议标识。只在名称是纯 ASCII 时给得出(中文名转不出有意义的拼写,不硬转) */
function nsSuggestSlug(name){
  const s=String(name||'').trim().toLowerCase();
  if(!s||!/^[\x20-\x7e]+$/.test(s))return'';
  const out=s.replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,41).replace(/-+$/,'');
  return NS_SLUG_RE.test(out)?out:'';
}
function nsReadForm(){
  const colors={};
  for(const [k] of NS_CKEYS){
    const t=$('#nsHex_'+k),c=$('#nsCol_'+k),v=(t?t.value:'').trim();
    /* 预览期间可以拿取色器的现值顶上(边填边看不该中途黑屏),但这条路进不了保存 ——
       nsSave 会先跑 nsHexCheck 把非法值拦下来 */
    colors[k]=nsNormHex(v)||(c?c.value.toUpperCase():'#000000');
  }
  const on=(sel,def)=>{const b=$(sel+' .on');return b?b.dataset.v:def;};
  return {name:$('#nsName').value,description:$('#nsDesc').value,
    suits:$$('#nsSuits .nschk.on').map(e=>e.dataset.v),
    platforms:$$('#nsPlats .nschk.on').map(e=>e.dataset.v),
    colors,rounded:on('#nsRound','subtle'),weight:on('#nsWeight','medium'),
    elevation:on('#nsElev','flat'),
    /* 勾掉即当场清空(不是留着上次填的值不写)—— 所见即所存,与补充色那条同一口径 */
    gradientTo:$('#nsGradOn').checked?(nsNormHex($('#nsGradHex').value)||$('#nsGradCol').value.toUpperCase()):'',
    statusColors:$('#nsStatOn').checked
      ?NS_STATUS.reduce((o,[k])=>{o[k]=nsNormHex($('#nsStHex_'+k).value)||$('#nsSt_'+k).value.toUpperCase();return o;},{})
      :null,
    /* 勾掉的补充色**当场从表单里消失** —— 预览的色板条会少一格,所见即所存 */
    extraColors:nsExtra.filter(x=>x.on).map(x=>x.hex),
    extraTokens:nsTokens||{}};
}
function nsPreview(){
  clearTimeout(nsTimer);
  nsTimer=setTimeout(async()=>{
    const my=++nsSeq, form=nsReadForm();
    try{const r=await api('/api/design/preview','POST',{form});
      if(my!==nsSeq)return;                      // 慢请求后到就丢弃,别让旧图盖住新图
      const el=$('#nsPrev'); if(el)el.innerHTML=swatchSvg(r.card.layout,178);
    }catch(e){const el=$('#nsPrev'); if(el)el.innerHTML='<span class="hint">预览暂时出不来</span>';}
  },240);
}
/* 提炼回填:只覆盖「参考里读得出来」的那几项(色板/圆角),名称与描述留着不动 ——
   那两项是人写的,被一次提炼冲掉最恼人。
   ⚠ 读不到的项**不动表单**:一个颜色都没读到时 form.colors 是模板默认值、没读到圆角时 rounded 是兜底的「微圆」,
   照填就是把默认值当成提炼结果,还冲掉人已经选好的(实测 linear.app)。字重提炼器根本不读,
   只有目录里本来就有风格档(styledoc)时才是真值。 */
function nsFill(f,ev){
  if(!f)return;
  const e=ev||{};
  if(e.colorsFound!==false)for(const [k] of NS_CKEYS){const v=nsNormHex((f.colors||{})[k]);if(!v)continue;
    $('#nsCol_'+k).value=v;$('#nsHex_'+k).value=v;}

/* 提炼带回来的三样属性(v0.11.22)。同一条纪律:**提不出的项一概不动表单** ——

function nsFillTraits(tr){
  if(!tr)return;

  if(tr.gradientTo){const v=nsNormHex(tr.gradientTo);

      $('#nsSt_'+k).value=v;$('#nsStHex_'+k).value=v;}}

/* 提炼带回来的建议落进本地状态。两条纪律:

      想换成这句,证据区那颗「用这句」点一下。
   ② 名称一律不动。 */
function nsApplySuggest(sug){

/* 「还读到」那一行:只列真读出来的项,一项都没有就整行不出现(不写「未读到字距」这种废话) */
function nsTokensSummary(t){
  if(!t)return'';
  const p=[];
  if(t.letterSpacing!=null)p.push('字距 '+t.letterSpacing+'em');
  if(t.borderWidth!=null)p.push('描边 '+t.borderWidth+'px');
  if(t.spacingUnit!=null)p.push('间距 '+t.spacingUnit+'px 网格');
  if(t.headlineSize!=null&&t.bodySize!=null)p.push('标题/正文 '+t.headlineSize+'/'+t.bodySize);
  if(t.lineHeight!=null)p.push('行高 '+t.lineHeight);

}
/* 可勾选补充色块的骨架。**证据区与「复制为新款」共用同一份** —— 两处各写一份,勾选逻辑

  return '<span id="'+id+'" class="nschips" style="display:inline-flex;vertical-align:-4px;margin-left:2px">'
    +nsExtra.map((c,i)=>`<span class="nschk${c.on?' on':''}" data-i="${i}"><span class="sw" style="background:${esc(c.hex)}"></span>${esc(c.hex)}${c.count?'<span class="faint"> ×'+c.count+'</span>':''}</span>`).join('')+'</span>';
}
/* innerHTML 重写过就要重新挂 —— 所以绑定与骨架分开两个函数 */
function nsBindChips(id){

function nsEvidence(ev){

  else if(ev.source==='dir')rows.push('扫了 '+(ev.files||0)+' 个样式文件');

  if(sw)rows.push('提到最多的颜色 · '+sw);
  else if(ev.colorsFound===false)rows.push('没读到颜色,四个颜色保持原样');
  if((ev.fonts||[]).length)rows.push('字体族 · '+ev.fonts.map(f=>esc(f)).join(' / '));

  const tr=(nsSug&&nsSug.traits)||{};

  if(tr.elevation)trs.push('投影 '+({none:'一处都没有 ⇒ 无',flat:'很浅 ⇒ 轻',soft:'明显',color:'带颜色 ⇒ 彩色'}[tr.elevation]||tr.elevation));

  if(trs.length)rows.push('还读到 · '+trs.join(' · ')+' <span class="faint">(没提到的那几样保持原样)</span>');
  if(nsExtra.length)rows.push('补充色(勾上的会一起写进这套风格)· '+nsChipsHtml('nsExtraChips'));
  if(nsSug&&nsSug.description)rows.push('这一句只说事实,可以直接当描述 · <span class="dim">'+esc(nsSug.description)

/* 展开着的定时任务详情(按 cron id)。必须存在渲染之外 —— 启停任务、切页签回来、群卡上任何
   写操作都会 renderGroups() 重画整块,不记住的话每点一次启停,正读着的全文就没了。 */
const cronOpen=new Set();
/* 任务正文的轻量分层。不做 markdown 解析,只认这个产品自己的体裁约定:①②③ 起步骤 ·
   「· 」起条目 · ⚠ 起提醒 · 缩进两格是命令或样例。认不出的行一律当普通段落 —— 所以随手写的
   任务照样正常显示,分层是锦上添花而不是解析器,不会因为格式不合就渲染坏。 */
function cronFullHtml(text){
  // ⚠ 在正文里三种位置都出现(独立成行 / 挂在条目开头 / 夹在句子中间),只按行首判断会漏掉
  // 后一种 —— 实测这份任务 4 个 ⚠ 里就有 2 个夹在句中,而它们恰恰是最该跳出来的。
  // 所以位置分层之外,再把符号本身标一下,三种位置就都覆盖了。
  const E=s=>esc(s).replace(/⚠/g,'<b class="cw">'+IC.warn+'</b>');
  return String(text||'').split('\n').map((ln,i)=>{
    if(!ln.trim())return '<div class="cbl-sp"></div>';
    if(/^\s{2,}\S/.test(ln))return `<div class="cbl-code">${esc(ln.trim())}</div>`;   // 缩进行 = 命令/样例,原样不加标记
    const t=ln.trim();
    if(i===0)return `<div class="cbl-t">${E(t)}</div>`;                               // 首行 = 任务名
    if(/^[①②③④⑤⑥⑦⑧⑨⑩]/.test(t))return `<div class="cbl-h">${E(t)}</div>`;
    if(/^⚠/.test(t))return `<div class="cbl-warn">${E(t)}</div>`;
    // 条目:剥掉「· 」再判断 —— 有的提醒写成「· ⚠ …」挂在条目上,不先剥就落进普通条目、警示性丢失
    if(/^[·•]\s*/.test(t)){const b=t.replace(/^[·•]\s*/,'');return `<div class="cbl-li${/^⚠/.test(b)?' warn':''}">${E(b)}</div>`;}
    if(/^\d+\.\s/.test(t))return `<div class="cbl-li num">${E(t)}</div>`;
    return `<div class="cbl-p">${E(t)}</div>`;
  }).join('');
}

  (card.querySelectorAll('[data-gov]')||[]).forEach(a=>a.onclick=e=>{if(e){e.preventDefault();e.stopPropagation();}const b=$('nav button[data-tab="overview"]');if(b)b.click();});
}
// tick:新的视图到了,只换每张卡上随状态变的几块(卡片本身、拖动把手、正在填的面板都不动)
function groupsLive(){
  if(!S||!$('#gcards')||document.querySelector('.card.dragging'))return;
  for(const card of $$('#gcards .gcard')){
    const g=gvGroup(card.dataset.gid);if(!g)continue;
    const lp=gvLiveParts(g,gvOf(g.chatId)), sig=JSON.stringify(lp);
    if(card.dataset.live===sig)continue;
    card.dataset.live=sig;
    const ctl=card.querySelector('.gctl'),stat=card.querySelector('.gstat-w'),note=card.querySelector('.gnote-w');
    if(ctl)ctl.innerHTML=lp.ctl;if(stat)stat.innerHTML=lp.stat;if(note)note.innerHTML=lp.note;
    card.classList.toggle('gpaused',lp.paused);
    gvBindLive(card);
  }
}
// 四个控制键,接口与提示都和概览原来那几颗键一样;键关着时不做事(说明里写了原因)
async function gvKey(chatId,id,btn){
  const v=gvOf(chatId), c=v&&(v.controls||[]).find(x=>x&&x.id===id);
  if(!c||!c.on||btn.dataset.busy)return;
  if(c.kind==='say')return openSay(chatId);
  if(c.kind==='chat'){const b=$('nav button[data-tab="playground"]');if(b)b.click();if(typeof lcLoad==='function'&&lc.chat!==chatId)lcLoad(chatId);return;}
  btn.dataset.busy='1';
  try{
    if(c.kind==='fresh'){
      const lv=gvLive(chatId);
      if(!S.runtimeCapabilities&&lv.busy&&!await askConfirm('该群任务运行中 — 中断当前任务、清空队列并开新会话?'))return;
      const r=await api('/api/groups/interrupt','POST',{chatId});toast(r.wasBusy?'已中断并开新会话':'已开新会话','ok');
    }else if(c.kind==='stop'){
      const r=await api('/api/groups/stop','POST',{chatId});toast(S.runtimeCapabilities?(r.ok?'已请求停止，等待结束确认':'当前没有可停止的运行任务'):(r.ok?'已停止当前任务':'没有正在运行的任务'),'ok');
    }else if(c.kind==='pause'||c.kind==='resume'){
      const on=c.kind==='pause';
      if(on&&!await askConfirm(S.runtimeCapabilities?gvNoun(v).pause+'只有任务结束且记录全部结账后才能暂停；暂停期间不处理新消息，配置和会话保留。'
        :'暂停本群?\n期间消息不处理(静默丢弃)、排队清空、定时任务与画布播报停发;进行中的任务会跑完。\n完全可逆:配置/会话/画布全保留,点「恢复」即原样回来。'))return;
      S=await api('/api/groups/pause','POST',{chatId,paused:on});renderGroups();renderOverview();
      toast(S.runtimeCapabilities?(on?'已暂停':'已恢复'):(on?'已暂停 · 群内已通知':'已恢复 · 群内已通知'),'ok');
    }
  }catch(e){toast(e.message,'err');}
  finally{delete btn.dataset.busy;}
}
// 从别处(概览的群名)打开某个群的设置面板
function openGroupPanel(chatId){
  if(!gvGroup(chatId))return;
  const b=$('nav button[data-tab="groups"]');if(b&&!b.classList.contains('active'))b.click();
  if(!$('#gcards'))renderGroups();
  gpOpen(chatId,$$('#gcards .gcard').find(c=>c.dataset.gid===chatId)||null);
}

/* ── 设置面板 ──
   开合只切类名(动效才连得上);入场做完后挂 settled,之后面板内重画不再重放入场动效。
   各节按视图的 panel 列表出;旧服务对照路径才有的几行(基础技能、预览、仓库、设计风格、图标、画布、旧定时任务)
   照原来的条件画在相应的节里。 */
const GP={chatId:null,settle:0,clear:0,opener:null,plug:null};
function gpOpen(chatId,opener){
  const bg=$('#gsheetBg'),sheet=$('#gsheet');if(!bg||!sheet||!bg.classList||!gvGroup(chatId))return;
  const same=GP.chatId===chatId&&bg.classList.contains('show');
  GP.chatId=chatId;GP.opener=opener||GP.opener;if(!same)GP.plug=null;
  gpPaint(!same);
  $$('#gcards .gcard').forEach(c=>c.classList.toggle('sel',c.dataset.gid===chatId));
  if(same)return;
  bg.classList.remove('settled');clearTimeout(GP.settle);clearTimeout(GP.clear);
  void sheet.offsetWidth;bg.classList.add('show');   // 先让浏览器记下起点,再切类名,过渡才会播
  GP.settle=setTimeout(()=>bg.classList.add('settled'),700);
  setTimeout(()=>{const x=sheet.querySelector&&sheet.querySelector('[data-gpclose]');if(x&&x.focus)try{x.focus({preventScroll:true});}catch(e){}},0);
}
function gpClose(){
  const bg=$('#gsheetBg'),was=GP.chatId,opener=GP.opener;
  GP.chatId=null;GP.opener=null;GP.plug=null;
  if(bg&&bg.classList){bg.classList.remove('show');bg.classList.remove('settled');}
  // 退场动效做完再清空面板(之后再打开会重画)
  clearTimeout(GP.clear);GP.clear=setTimeout(()=>{const sh=$('#gsheet');if(!GP.chatId&&sh)sh.innerHTML='';},220);
  $$('#gcards .gcard').forEach(c=>c.classList.remove('sel'));
  rmClose();
  if(was&&opener&&opener.isConnected&&opener.focus)try{opener.focus({preventScroll:true});}catch(e){}
}
function gpPaint(opening){
  const sheet=$('#gsheet');if(!sheet||!GP.chatId)return;
  const g=gvGroup(GP.chatId);if(!g){gpClose();return;}   // 群已被移除
  const body=sheet.querySelector&&sheet.querySelector('.gd-body'), y=body?body.scrollTop:0;
  const open=new Set(opening?[]:[...(sheet.querySelectorAll?sheet.querySelectorAll('details[open]'):[])].map(d=>d.dataset.gdetails));
  sheet.innerHTML=groupPanelHtml(g,gvOf(g.chatId),open);
  const nb=sheet.querySelector&&sheet.querySelector('.gd-body');if(nb&&!opening)nb.scrollTop=y;
  gpBind(g,opening);
}

`;

}

// 面板里各控件的接线(保存逻辑与接口照旧,选择器换成面板)

    try{const body={chatId:cid,workdir:wd};if(g.platform)body.platform=g.platform;

    if(sel.value==='__custom__'){if(box){box.hidden=false;box.querySelector('input').focus();}return;}

    if(!v){toast('填写型号 id','err');return;}saveGroupBrain(b.dataset.gcustom,{model:v});});

  $$('#gsheet .gseg').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.g,mode=b.dataset.mode,wantBypass=mode==='bypassPermissions';

    if(wantBypass===curBypass)return;

    try{S=await api('/api/groups/policy','POST',{chatId:id,permissionMode:mode});renderGroups();toast(wantBypass?'已设为完全访问 · 下轮生效':'已设为受限 · 下轮生效','ok');}
    catch(e){toast(e.message,'err');}});

// 旧服务对照路径那几行的接线(原样)
function gvBindLegacy(){

      toast(r.cleared?'已解除仓库关联':(r.initialized?'已关联 · 项目目录已 git init':(r.replaced?'已关联 · origin 已更新':'已关联')),'ok');}

    try{const r=await api('/api/groups/repo/test','POST',{repo:v});

/* ── 移除对话框:只有设置面板「移除」一节这一个入口 ──
   按视图的 remove 画:飞书群多一个「同时解散这个飞书群」(默认不勾),勾上要输完整群名;群里有其他成员时
   服务端先在群里预告,这里倒数冷静期再确认;解散成功而移除失败时直接给「再试一次移除」。
   页面内对话框(桌面 App 里没有原生对话框)。 */
let RM={chatId:null};
function rmOpen(chatId){
  const v=gvOf(chatId),g=gvGroup(chatId);if(!g||!v||!v.remove||!v.remove.on)return;
  clearTimeout(RM.timer);
  RM={chatId,rm:v.remove,noun:v.noun,name:gName(g)||chatId,disband:false,typed:'',phase:'ask',busy:false,users:0,names:[],token:'',left:0,timer:0,err:''};
  rmPaint();
}
function rmClose(){
  clearTimeout(RM.timer);RM={chatId:null};
  const bg=$('#rmBg');if(bg&&bg.classList){bg.classList.remove('show');bg.innerHTML='';}
}
function rmHtml(){
  const nn=GV_NOUN[RM.noun]||GV_NOUN.group, nm=RM.name, can=!!(RM.rm&&RM.rm.disband);
  const btns=(ok,label,danger)=>`<div class="upg-btns"><button type="button" class="btn" data-rmx="0" title="取消">${IC.x}<span>取消</span></button><button type="button" class="btn primary${danger?' danger':''}" data-rmx="1"${ok&&!RM.busy?'':' disabled'}>${IC.check}${label}</button></div>`;
  if(RM.phase==='retry')return `<div class="modal grm" role="alertdialog" aria-modal="true"><h3>${nn.title}「${esc(nm)}」</h3>
    <p class="bad" title="${esc(RM.err)}">飞书群已经解散，但群项目没能移除。</p>
    ${btns(true,'再试一次移除',false)}</div>`;
  if(RM.phase==='cool')return `<div class="modal grm" role="alertdialog" aria-modal="true"><h3>解散并移除「${esc(nm)}」</h3>
    <p>${esc('群里还有 '+RM.users+' 名成员（'+(RM.names||[]).join('、')+'），已在群里发出预告。\n冷静期过后才能确认解散。')}</p>
    <div class="upg-btns"><button type="button" class="btn" data-rmx="0" title="取消">${IC.x}<span>取消</span></button><button type="button" class="btn primary danger" data-rmx="1"${RM.left>0||RM.busy?' disabled':''}>${IC.check}<span>确认解散</span><span class="rmleft" data-i18n-skip>${RM.left>0?'('+RM.left+'s)':''}</span></button></div></div>`;
  const ok=!RM.disband||RM.typed.trim()===nm;
  return `<div class="modal grm" role="alertdialog" aria-modal="true"><h3>${nn.title}「${esc(nm)}」</h3>
    <p>${nn.body}${RM.rm&&RM.rm.heldNote?'\n<span>上一个任务结果不明，它的记录会归档保留，不会重发。</span>':''}</p>
    ${can?`<label class="opt${RM.disband?' on':''}"><input type="checkbox" data-rmdis="1"${RM.disband?' checked':''}/><div><b>同时解散这个飞书群</b><span>成员全部移出，群和聊天记录不可恢复。机器人须是群主；群里有其他成员时会先在群里预告。</span></div></label>`:''}
    ${can&&RM.disband&&RM.rm.typeName?`<div class="confirm-name"><label for="rmName">输入完整群名确认：</label><input id="rmName" data-i18n-skip autocomplete="off" spellcheck="false" placeholder="${esc(nm)}" value="${esc(RM.typed)}"/></div>`:''}
    ${btns(ok,RM.disband?'解散并移除':'移除',RM.disband)}</div>`;
}
function rmPaint(){
  let bg=$('#rmBg');
  if(!bg){bg=document.createElement('div');bg.className='modal-bg';bg.id='rmBg';document.body.appendChild(bg);bg.onclick=e=>{if(e.target===bg)rmClose();};}
  const focus=document.activeElement&&document.activeElement.id==='rmName';
  bg.innerHTML=rmHtml();bg.classList.add('show');
  bg.querySelectorAll('[data-rmx]').forEach(b=>b.onclick=()=>b.dataset.rmx==='1'?rmGo():rmClose());
  const dis=bg.querySelector('[data-rmdis]');if(dis)dis.onchange=()=>{RM.disband=dis.checked;RM.typed='';rmPaint();if(RM.disband){const n=$('#rmName');if(n)n.focus();}};
  const nm=bg.querySelector('#rmName'), go=bg.querySelector('[data-rmx="1"]');
  if(nm){nm.oninput=()=>{RM.typed=nm.value;if(go)go.disabled=RM.busy||RM.typed.trim()!==RM.name;};
    nm.onkeydown=e=>{if(e.key==='Enter'&&go&&!go.disabled){e.preventDefault();rmGo();}};
    if(focus)nm.focus();}
  if(!nm&&go&&!go.disabled)setTimeout(()=>{try{go.focus();}catch(e){}},0);
}
function rmTick(){
  clearTimeout(RM.timer);if(RM.phase!=='cool')return;
  const left=$('#rmBg .rmleft'),go=$('#rmBg [data-rmx="1"]');
  if(left)left.textContent=RM.left>0?'('+RM.left+'s)':'';
  if(go)go.disabled=RM.left>0||RM.busy;
  if(RM.left>0)RM.timer=setTimeout(()=>{RM.left--;rmTick();},1000);
}
const rmDisbandUrl=(chatId,t)=>'/api/feishu/chats?chatId='+encodeURIComponent(chatId)+(t?('&confirm=1&dtoken='+encodeURIComponent(t)):'');
async function rmGo(){
  const st=RM;if(!st.chatId||st.busy)return;
  const nn=GV_NOUN[st.noun]||GV_NOUN.group, done=()=>{if(RM===st){rmClose();gpClose();}renderAll();};
  const fail=e=>{if(RM!==st)return;st.busy=false;
    // 解散成功、移除没成:对话框直接给「再试一次移除」
    if(e&&e.payload&&e.payload.disbanded===true&&st.rm&&st.rm.retry){st.phase='retry';st.err=e.message||'';rmPaint();return;}
    toast(e.message,'err');rmPaint();};
  st.busy=true;rmPaint();
  try{
    if(st.phase==='retry'||!st.disband){
      S=await api('/api/groups?chatId='+encodeURIComponent(st.chatId),'DELETE');toast(nn.done+'「'+st.name+'」','ok');return done();
    }
    if(st.phase!=='cool'){
      const r=await api(rmDisbandUrl(st.chatId),'DELETE');
      if(r.users>0){if(RM!==st)return;Object.assign(st,{phase:'cool',busy:false,users:r.users,names:r.names||[],token:r.disbandToken,left:Math.max(0,Math.floor(Number(r.coolDownSec)||0))});rmPaint();rmTick();return;}
      st.token=r.disbandToken;
    }
    S=await api(rmDisbandUrl(st.chatId,st.token),'DELETE');toast('已解散飞书群「'+st.name+'」并移除群项目','ok');done();
  }catch(e){fail(e);}
}

// 群卡插件面板 — 勾选 = 本群加载该 MCP,即存即生效(下轮)。勾选就是字面意思:取消勾选的那几个本群
// 不加载,其余一概不动(清单之外的 Claude 插件、账号连接器照常)。哪些勾着、哪些这一轮被跳过由服务端
// 给(r.view,内置核心的计划),这里只照着画、把当前勾选发回去。checkbox 即真相,故无需「恢复默认」
// 按钮(要全恢复 = 全勾)。项目级 MCP 恒载入(只读、禁勾)。
// 命令(detail)只进 title 悬浮,行内不显 —— 群卡按名勾选即可,完整命令看模型页「插件库」。
// 用户级 skills 仍不列(2026-07-03 拍板:列表累赘);**项目级技能改为只读显示**(2026-08-03 拍板
// v0.11.2 —— 当年拍板针对的是用户级列表噪音,项目自带 cloudbase 这类重量级技能不显示 = 能力隐身)。
// 摘要行带项目级计数(g.proj,服务端读 workdir 声明):不点开「配置」也看得见项目自带什么。
function plugSummary(g){
  const p=g&&g.plug, pr=(g&&g.proj)||{mcp:[],skills:[]};
  const proj=[pr.mcp.length?`项目 ${pr.mcp.length}`:'',pr.skills.length?`技能 ${pr.skills.length}`:''].filter(Boolean).join(' · ');
  const lib=!p||!p.managed?'默认加载':p.off?`已停用 ${p.off} 个`:'全部加载';
  return proj?`${proj} · ${lib}`:lib;
}
// MCP 可达性徽标 —— 插件库与群卡两处共用。
// ⚠ **只标例外**:逐个标「可达」是噪音(本项目「常态不用说,例外才值得标」那条),
//   而这次要治的恰恰是「连不上的那个长得和好的一模一样」。
//   down = 确定不可用(勾了它的群那一轮直接跳过不加载);unknown = 本机直连没探通,
//   但仍照常加载(直连不走代理,探不通 ≠ 不可用),所以用最弱的样式,别喊。
function reachChip(r){
  if(!r||r.status==='ok')return '';
  const bad=r.status==='down';
  const tip=(r.detail||'')+(bad?' · 连不上期间各群这一轮都会跳过它,不加载也不重试;服务起来后自动恢复'
    :' · 仍会照常加载 —— 本机直连探测不走代理,探不通不代表它不可用');
  return `<span class="chip ${bad?'warn':'none'}" title="${esc(tip)}" style="flex-shrink:0;margin-left:6px">${bad?'连不上':'未确认'}</span>`;
}
function renderPlugBox(cid,box,r,isCodex,ro){
  const mrow=(name,detail,reach)=>`<div class="kv" style="padding:3px 0;border-top:none"><span class="kk mono" style="white-space:nowrap">${esc(name)}</span><span class="vv" title="${esc(detail||'')}">${esc(detail||'MCP')}</span>${reachChip(reach)}</div>`;

      +`<div class="hint" style="margin-top:7px">codex <b>全局加载</b>全部 · 对所有 codex 群一致 · 在「模型 · 库」页「插件库」管理</div>`;
    return;
  }
  const view=r.view||{checked:[],skipped:[]},on=new Set(view.checked||[]),skipped=new Set(view.skipped||[]);
  // detail(完整命令)只进 label title 悬浮;行内只显 checkbox + 名 + 来源 chip。只读或固定的行不给手形。
  const row=(type,name,src,detail,checked,fixed,reach)=>`<label class="inline" style="gap:7px;font-size:11px;padding:3px 0;cursor:${fixed||ro?'default':'pointer'}" title="${esc(detail||'')}">
    <input type="checkbox" class="${type}" value="${esc(name)}" ${checked?'checked':''} ${fixed||ro?'disabled':''} style="width:auto"/>
    <span class="mono" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(name)}</span>

  // 勾着 + 连不上:这一轮跳过不加载(对所有群都一样),这里直说,并说清「不用动勾选」。

  const skillRow=ps.length?`<div class="hint" style="margin-top:6px;border-top:1px solid var(--line);padding-top:6px" title="${esc(ps.map(s=>s.name+(s.description?' — '+s.description.slice(0,80):'')).join('\n'))}">项目技能(随项目自动加载):<span class="mono">${ps.map(s=>esc(s.name)).join('、')}</span></div>`:'';
  const deadRow=dead.length?`<div class="hint" style="margin-top:6px;color:var(--warn)" title="${esc(dead.map(m=>m.name+' — '+((m.reach&&m.reach.detail)||'')).join('\n'))}">勾着但连不上:<span class="mono">${dead.map(m=>esc(m.name)).join('、')}</span> — 这一轮会跳过不加载(否则每轮都白等它启动失败)。<b>不用取消勾选</b>,服务起来后自动恢复。</div>`:'';
