   ⚠ 群正忙时**先说这句会落在哪**(加入当前任务 / 排到它后面,以及为什么),按钮名跟着变 ——
   2026-11-05 之前只说「已插入」,管理员以为指令已交给正在跑的任务,实际排了 3 分多钟。 */
function openSay(chatId){
  const g=(S.groups||[]).find(x=>x.chatId===chatId); if(!g) return;
  $('#modal').innerHTML=`<h3>向「${esc(g.name||g.chatId.slice(-8))}」插一句</h3>
    <div class="say-busy" id="sayBusy"></div>
    <textarea id="sayT" rows="4" maxlength="2000" placeholder="要它做什么,像跟人说话那样写…" style="width:100%;resize:vertical;min-height:96px"></textarea>
    <div class="say-foot">
      <span class="say-lab">群里可见</span>
      <label class="say-sw" for="sayShow" title="你插的这句话本身要不要发进群(会标着「管理员」)"><input type="checkbox" class="switch" id="sayShow" checked>插话</label>
      <label class="say-sw" for="sayReply" title="它做完之后的回复要不要发进群;取消后连报错也不会说"><input type="checkbox" class="switch" id="sayReply" checked>回复</label>
    </div>
    <div class="hint say-tip" id="sayPreview"></div>
    <div class="mfoot">
      <button class="btn" id="sayCancel">取消</button>
      <button class="btn primary" id="sayGo"><span id="sayGoTxt">插入</span><span class="say-kbd">⌘⏎</span></button>
    </div>`;
  $('#modalBg').classList.add('show');
  const ta=$('#sayT'), sw=$('#sayShow'), rp=$('#sayReply'), pv=$('#sayPreview'), go=$('#sayGo'), goTxt=$('#sayGoTxt'), bz=$('#sayBusy');
  const v1=!!S.runtimeCapabilities; let sending=false, req=null;
  // 当前版本两个开关固定勾上:只支持「这句话进群 + 回复进群」,开关留着,让人看见这句会以什么样子出现
  if(v1){ for(const c of [sw,rp]){ c.checked=true; c.disabled=true; c.parentElement.title='当前版本固定:这句话和回复都发进群'; } }
  const preview=()=>{ const a=sw.checked,b=rp.checked, plan=sayPlan(chatId,b);
    if(v1){
      const why=sayV1Blocked(chatId), lv=((S.live||{}).groups||{})[chatId]||{};
      bz.innerHTML=lv.busy?`<span class="dot"></span><span>${lv.finalizing?'正在收尾':'正在处理任务'}</span> · ${fmtDur(lv.sinceMs)}`:why==='held'?'<span class="dot"></span>待人工确认':'';
      const detail=lv.busy?(lv.followups?'将尝试跟进当前任务；长命令执行期间需等待工具步骤结束，实际进度请查看实时活动。':'当前任务暂不接收跟进，这句话会排队处理。'):'';
      pv.innerHTML=why?esc(SAY_V1[why]||SAY_V1.closed):`<span>${esc(detail)}</span> <span>${esc(SAY_V1.ok)}</span>`;
      if(!sending){ go.disabled=!!why; goTxt.textContent=why?'暂不能插':lv.busy?(lv.followups?'发送补充':'排队'):'插入'; }
      return;
    }
    const vis = a&&b ? '群里会看到:你插的这句话(标着「管理员」)和它做完的回复。'
      : a&&!b ? '群里只看到你插的这句话 —— 它做完<b>不出声</b>,结果去「实时活动」看。'
      : !a&&b ? '群里只看到它的回复 —— 群成员看不出是谁让做的。'
      : '群里<b>什么都不会出现</b>,连出错也不会说 —— 状态去「实时活动」看。';
    if(!plan.busy){ bz.innerHTML=''; pv.innerHTML=vis; if(!go.disabled) goTxt.textContent='插入'; return }
    const q=plan.lv.queue||0;
    bz.innerHTML=`<span class="dot"></span>${plan.why==='closing'?'正在收尾':'正在处理任务 · 已 '+sayAge(plan.lv.sinceMs)}${q?` · 还有 ${q} 条在排队`:''}`;
    const after = q ? `排到当前任务和前面 ${q} 条之后` : '排到当前任务结束后';
    const where = plan.join ? (a ? '这句会<b>加入当前任务</b>,它会边做边调整;回复卡片会跟到这句话下面,做完答案就在群底部。'
        : '这句会<b>加入当前任务</b>,它会边做边调整;这句话不进群,结果更新在原来那张卡片里(卡上会标一行「已加入管理员的补充」)。')
      : plan.why==='quiet' ? `不回复的插话<b>不加入</b>当前任务(免得结果混进群里那张卡片),会${after}单独处理。`
      : plan.why==='closing' ? `它的回答已经发出,这句会${after}马上处理。`
      : plan.why==='turn' ? `当前任务是定时任务或不回复的插话发起的,不接收中途消息 —— 这句会<b>${after}</b>处理。`
      : plan.why==='off' ? `这句会<b>${after}</b>处理。想让插话直接加入当前任务,在「群·项目」打开这个群的「忙时跟进」。`
      : `这句会<b>${after}</b>处理。`;
    pv.innerHTML=where+'<br>'+vis;
    if(!go.disabled) goTxt.textContent=plan.join?'加入当前任务':'排队';
  };
  sw.onchange=rp.onchange=preview; preview(); sayRefresh=preview;
  ta.focus();
  ta.onkeydown=(e)=>{ if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){ e.preventDefault(); go.click() } };
  $('#sayCancel').onclick=closeModal;
  go.onclick=async()=>{
    const text=(ta.value||'').trim(); if(!text){ ta.focus(); return }
    if(!req||req.text!==text) req={id:sayRequestId(),text};   // 没成功前同一段文字重试 = 同一个键
    go.disabled=true; sending=true; const old=goTxt.textContent; goTxt.textContent='插入中…';
    try{
      const r=await api('/api/groups/say','POST',{chatId,text,show:sw.checked,reply:rp.checked,requestId:req.id});
      const inj=r.sayInjected; delete r.sayInjected;   // 瞬态字段,读完即删(别进状态签名)
      S=r; closeModal(); renderOverview();
      if(v1&&inj&&inj.where&&inj.where.state==='duplicate'){ toast('这次提交已经插入过,没有重复处理','ok'); return }
      // 回报照实说清两件事:这句**落在哪**(服务端按引擎实际落点回报),以及群里会/不会出现什么 —— 只说「已插入」等于没说
      const vis = inj&&inj.show ? (inj.reply?'群里能看到这句话和回复':'群里只看到这句话') : (inj&&inj.reply?'群里只会出现回复':'群里不会有任何动静');
      const w=(inj&&inj.where)||{};
      const head = w.state==='following' ? '已受理 · 等待模型读取，尚未确认加入'
        : w.state==='accepted' ? '已受理 · 处理状态请查看实时活动'
        : w.state==='done' ? '已处理'
        : w.state==='joined' ? '已加入当前任务'+(inj&&inj.show?' · 回复卡片会跟到这句话下面':'')
        : w.state==='queued' ? (w.join ? '已排队 · 当前任务一就绪就会加入' : '群正忙,已排队'+(w.ahead?`(前面还有 ${w.ahead} 条)`:'')+' · 当前任务结束后处理')
        : '已插入';
      toast(head+' · '+vis,'ok');
    }catch(e){ toast(e.message,'err'); sending=false; go.disabled=false; const t2=$('#sayGoTxt'); if(t2) t2.textContent=old; if(v1&&$('#sayT')) preview() }
  };
}
function closeModal(){clearTimeout(nsTimer);nsTimer=null;nsSeq++;sayRefresh=null;$('#modalBg').classList.remove('show');$('#modal').className='modal';
  try{upgOnClose();}catch{}} // 升级弹窗:升级照常进行,只收起
$('#modalBg').onclick=e=>{if(e.target.id==='modalBg')closeModal();};

/* ── playground ── */
let pg={session:null,running:false,abort:null};
function pgMsgEl(role){const m=document.createElement('div');m.className='msg '+role;m.innerHTML=`<div class="role">${role==='user'?'你':'agent'}</div><div class="bubble"></div><div class="tools"></div>`;return m;}
function renderPlayground(){
  const el=$('#playground');
  if(S.runtimeCapabilities&&S.runtimeCapabilities.localChat){renderLocalChat(el);return;}
  if(S.runtimeCapabilities){el.innerHTML='<div class="card"><div class="hint">'+esc(S.runtimeCapabilities.reason)+'</div></div>';return;}
  if(el.dataset.built)return; // build once — keep the conversation across state refreshes
  const provs=S.providers.filter(p=>!p.hidden&&p.configured).map(p=>`<option ${p.name===S.defaultProvider?'selected':''}>${esc(p.name)}</option>`).join('');
  const wd=(S.groups[0]&&S.groups[0].workdir)||'';
  el.innerHTML=`
    <div class="pg-ctl">
      <select id="pgProv">${provs}</select>
      <input id="pgWd" placeholder="workdir 绝对路径(留空=daemon 目录)" value="${esc(wd)}"/>
      <button class="btn" id="pgNew">${IC.plus} 新会话</button>
    </div>
    <div class="pg-msgs" id="pgMsgs"><div class="pg-empty">选 provider、填 workdir,输入任务开始试跑</div></div>
    <div class="pg-in"><textarea id="pgInput" placeholder="输入任务…(Enter 发送 · Shift+Enter 换行)"></textarea><button class="btn primary" id="pgSend">发送</button></div>`;
  el.dataset.built='1';
  $('#pgSend').onclick=()=>{if(pg.running){pg.abort&&pg.abort.abort();}else pgSend();};
  $('#pgNew').onclick=()=>{pg.session=null;$('#pgMsgs').innerHTML='<div class="pg-empty">新会话已开始</div>';toast('新会话','ok');};
  $('#pgInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#pgSend').click();}});
}
async function pgSend(){
  const input=$('#pgInput'),text=input.value.trim();if(!text||pg.running)return;
  const prov=$('#pgProv').value,wd=$('#pgWd').value.trim(),msgs=$('#pgMsgs');
  if($('.pg-empty',msgs))msgs.innerHTML='';
  const um=pgMsgEl('user');$('.bubble',um).textContent=text;msgs.appendChild(um);
  const am=pgMsgEl('agent'),bubble=$('.bubble',am),tools=$('.tools',am);bubble.innerHTML='<span class="cursor"></span>';msgs.appendChild(am);
  msgs.scrollTop=msgs.scrollHeight;input.value='';
  pg.running=true;const send=$('#pgSend');send.textContent='停止';send.classList.remove('primary');
  const ac=new AbortController();pg.abort=ac;const toolSet=new Set();
  try{
    const resp=await fetch('/api/playground/run',{method:'POST',headers:{'Content-Type':'application/json','X-Sbot-Token':TOKEN},body:JSON.stringify({provider:prov,workdir:wd,prompt:text,sessionId:pg.session}),signal:ac.signal});
    await streamSSE(resp,(ev,d)=>{
      if(ev==='session')pg.session=d.sessionId;
      else if(ev==='delta'){bubble.innerHTML=esc(d.text)+'<span class="cursor"></span>';msgs.scrollTop=msgs.scrollHeight;}
      else if(ev==='tool'){(d.tools||[]).forEach(t=>toolSet.add(t));tools.innerHTML=IC.wrench+' '+[...toolSet].map(t=>`<span class="tchip">${esc(t)}</span>`).join('');}
      else if(ev==='done'){bubble.innerHTML=esc(d.text||'(无输出)');if(d.usage)tools.innerHTML+=` <span class="faint">${IC.down}${fmtTok(d.usage.out)}</span>`;if(d.sessionId)pg.session=d.sessionId;if(d.status&&d.status!=='ok')tools.innerHTML+=` <span class="faint">· ${esc(d.status)}</span>`;}
      else if(ev==='error'){bubble.innerHTML='<span style="color:var(--fail)">'+IC.x+' '+esc(d.error)+'</span>';}
    });
  }catch(e){
    const cur=$('.cursor',bubble);if(cur)cur.remove();
    if(e.name==='AbortError')bubble.innerHTML=(bubble.textContent||'')+' <span class="faint">(已停止)</span>';
    else bubble.innerHTML='<span style="color:var(--fail)">'+IC.x+' '+esc(e.message)+'</span>';
  }finally{
    pg.running=false;pg.abort=null;send.textContent='发送';send.classList.add('primary');
    const cur=$('.cursor',bubble);if(cur)cur.remove();msgs.scrollTop=msgs.scrollHeight;
  }
}

/* ── 本机对话(持久处理流程)──
   一段对话 = 一条 platform:'local' 的群项目路由:这里发的话与群消息走同一个受理入口、同一种持久收据,
   回答由服务写进本机的对话记录(src/platform/local.js),页面只读它。所以这一页不保存任何状态:
   刷新、重启服务、换浏览器看到的都是同一份记录。 */
const lc={chat:null,msgs:[],ids:new Set(),loading:false,sending:false,unread:new Set(),timer:null,note:''};
const lcChats=()=>(S.groups||[]).filter(g=>g.platform==='local');
const lcLive=id=>(S.live&&S.live.groups&&S.live.groups[id])||{};
const lcHomePath=p=>{const m=/^(\/(?:Users|home)\/[^/]+)(\/.*)?$/.exec(p||'');return m?'~'+(m[2]||''):(p||'');};
const lcClock=ts=>{const d=new Date(ts),z=n=>String(n).padStart(2,'0');const day=new Date().toDateString()===d.toDateString()?'':(d.getMonth()+1)+'-'+d.getDate()+' ';return day+z(d.getHours())+':'+z(d.getMinutes());};
const lcSecs=ms=>{const t=Math.max(0,Math.round(ms/1000));return t<60?t+'s':Math.floor(t/60)+'m '+z2(t%60)+'s';};
const z2=n=>String(n).padStart(2,'0');
/* 回答里的轻量 Markdown:围栏代码块、行内代码、粗体、标题行、裸链接。先转义再加标签,别的一概当文字。 */
function lcInline(seg){
  let h=esc(seg).replace(/^\n+|\n+$/g,'');
  h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')
    .replace(/^#{1,4}\s+(.+)$/gm,'<b class="lc-hd">$1</b>')
    .replace(/(^|[\s(（])(https?:\/\/[^\s<)）]+)/g,(m,a,u)=>a+'<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>');
  return h?'<span class="lc-text">'+h+'</span>':'';
}
function lcMd(src){
  return String(src).split('```').map((seg,i)=>{
    if(!(i%2))return lcInline(seg);
    const nl=seg.indexOf('\n');const code=(nl>=0?seg.slice(nl+1):seg).replace(/\n$/,'');
    return '<pre class="lc-code"><code>'+esc(code)+'</code></pre>';
  }).join('');
}
function lcMsgEl(m){
  const d=document.createElement('div');d.className='lc-msg '+m.role;d.dataset.id=m.id;
  // 对话内容是用户与模型自己的话,不进界面翻译层;服务给的提示行(notice)照常翻译
  if(m.role!=='notice')d.setAttribute('data-i18n-skip','');
  d.innerHTML=m.role==='notice'
    ?'<span class="lc-note">'+esc(m.text)+'</span>'
    :'<div class="lc-bubble">'+(m.role==='assistant'?lcMd(m.text):esc(m.text))+'</div><div class="lc-meta">'+esc(lcClock(m.ts))+'</div>';
  return d;
}
function lcAppend(list,{scroll=true}={}){
  const box=$('#lcMsgs');if(!box)return;
  const near=box.scrollHeight-box.scrollTop-box.clientHeight<120;
  let added=0;
  for(const m of list){if(!m||lc.ids.has(m.id))continue;lc.ids.add(m.id);lc.msgs.push(m);box.appendChild(lcMsgEl(m));added++;}
  const hint=$('.lc-hello',box);if(hint&&lc.msgs.length)hint.remove();
  if(added&&scroll&&near)box.scrollTop=box.scrollHeight;
}
async function lcLoad(chatId){
  lc.chat=chatId;lc.msgs=[];lc.ids=new Set();lc.unread.delete(chatId);lc.note='';
  const box=$('#lcMsgs');if(box)box.innerHTML='<div class="lc-hello">读取中…</div>';
  lcPaint();
  lc.loading=true;
  try{
    const r=await api('/api/local/history?chatId='+encodeURIComponent(chatId)+'&limit=300');
    if(lc.chat!==chatId)return;
    if(box)box.innerHTML=r.messages.length?'':'<div class="lc-hello">直接说要做什么。它会在上面的项目目录里，用这台电脑上的 Claude Code 或 Codex 处理，结果回到这里。</div>';
    lcAppend(r.messages);lc.toBottom=true;lcStick();
  }catch(e){if(box)box.innerHTML='<div class="lc-hello">读取失败：'+esc(e.message)+'</div>';}
  finally{lc.loading=false;}
}
/* 刚读完一段对话时页签可能还没显示(高度为 0),滚到底要等它真的可见 */
function lcStick(){const box=$('#lcMsgs');if(lc.toBottom&&box&&box.clientHeight>0){box.scrollTop=box.scrollHeight;lc.toBottom=false;}}
async function lcSync(){
  if(!lc.chat||lc.loading)return;
  const chatId=lc.chat,last=lc.msgs.length?lc.msgs[lc.msgs.length-1].id:'';
  try{const r=await api('/api/local/history?chatId='+encodeURIComponent(chatId)+(last?'&after='+encodeURIComponent(last):'')+'&limit=300');
    if(lc.chat===chatId)lcAppend(r.messages);}catch{}
}
/* 服务每写进一行就推一次(SSE local-message);不在看的那段对话记一个未读点 */
function lcReceive(ev){
  if(!ev||!ev.message||!ev.chatId)return;
  if(ev.chatId===lc.chat&&$('#playground').classList.contains('on'))lcAppend([ev.message]);
  else if(ev.chatId===lc.chat)lcAppend([ev.message],{scroll:false});
  else if(ev.message.role!=='user'){lc.unread.add(ev.chatId);lcPaintList();}
}
function lcPaintList(){
  const list=$('#lcList');if(!list)return;
  list.innerHTML=lcChats().map(g=>{const lv=lcLive(g.chatId);
    const st=g.paused?'paused':lv.held?'held':lv.busy?'busy':'idle';
    return `<button type="button" class="lc-item${g.chatId===lc.chat?' on':''}" data-lc="${esc(g.chatId)}"><span class="lc-dot ${st}"></span><span class="lc-nm" data-i18n-skip>${esc(g.name||'本机对话')}</span><span class="lc-sub" data-i18n-skip>${esc((g.workdir||'').split('/').filter(Boolean).pop()||'')}</span>${lc.unread.has(g.chatId)?'<span class="lc-new" title="有新回复"></span>':''}</button>`;}).join('');
  $$('#lcList .lc-item').forEach(b=>b.onclick=()=>{if(b.dataset.lc!==lc.chat)lcLoad(b.dataset.lc);});
}
function lcPaint(){
  lcPaintList();
  const g=lcChats().find(x=>x.chatId===lc.chat),head=$('#lcHead'),busy=$('#lcBusy');
  if(!g||!head)return;
  const lv=lcLive(g.chatId),full=g.permissionMode==='bypassPermissions';
  const brain=g.brain||{};
  head.innerHTML=`<div class="lc-title"><span class="lc-name" data-i18n-skip>${esc(g.name||'本机对话')}</span>
      <span class="chip" data-i18n-skip>${esc(brain.provider||g.effectiveProvider||g.provider||S.defaultProvider||'')}${brain.model?' · '+esc(brain.model):''}</span>
      <span class="chip ${full?'warn':''}" title="${full?'完全访问：可读写整台电脑。在「群 · 项目」里可改回只读':'只读：需要确认的操作会被拒绝。在「群 · 项目」里可放开'}">${full?'完全访问':'只读'}</span></div>
    <div class="lc-path mono" data-i18n-skip title="${esc(g.workdir||'')}">${esc(lcHomePath(g.workdir))}</div>
    <div class="lc-acts"><button class="btn sm" id="lcReset" title="忘掉之前聊的，从头开始（要等手头任务结束）">${IC.rotate} 新会话</button><button class="btn sm" id="lcConf" title="模型、权限、项目目录在「群 · 项目」里改">${IC.settings} 设置</button></div>`;
  $('#lcReset').onclick=async()=>{try{await api('/api/groups/new','POST',{chatId:g.chatId});toast('已开新会话，之前聊的不再带入','ok');}catch(e){toast(e.message,'err');}};
  $('#lcConf').onclick=()=>{const b=$('[data-tab="groups"]');if(b)b.click();};
  const paused=!!g.paused,held=!!lv.held;
  const input=$('#lcInput'),send=$('#lcSend');
  if(input){input.disabled=paused;input.placeholder=paused?'这段对话已暂停，在「群 · 项目」里恢复后再发':'交代一件事…';}
  if(send)send.disabled=paused||lc.sending;
  if(busy){
    if(held){busy.hidden=false;busy.className='lc-busy warn';busy.innerHTML=IC.warn+' <span>上一个任务结果不明，这段对话已暂停处理，等待确认；重启服务后仍如此时，按使用指南封存后继续。</span>';}
    else if(lv.busy||lv.waitingForCapacity){busy.hidden=false;busy.className='lc-busy';
      busy.innerHTML=`<span class="lc-spin" aria-hidden="true"></span><span class="lc-st"><span>${lv.waitingForCapacity&&!lv.busy?'等待空闲名额':(lv.finalizing?'正在收尾':'正在处理')}</span><i>·</i><span id="lcSecs" data-i18n-skip>${esc(lcSecs(lv.sinceMs||0))}</span>${lv.queue?'<i>·</i><span>排队 '+lv.queue+'</span>':''}</span><button class="btn sm" id="lcStop">${IC.square} 停止</button>`;
      $('#lcStop').onclick=async()=>{try{const r=await api('/api/groups/stop','POST',{chatId:g.chatId});toast(r.ok?'已请求停止，等待结束确认':'当前没有可停止的运行任务','ok');}catch(e){toast(e.message,'err');}};
      lc.busyAt=Date.now()-(lv.sinceMs||0);}
    else{busy.hidden=true;busy.innerHTML='';}
  }
}
function lcWhere(w){
  if(!w)return '';
  if(w.state==='queued')return '已排队'+(w.ahead?'，前面还有 '+w.ahead+' 条':'');
  if(w.state==='following'||w.state==='joined')return '已加入正在处理的任务';
  if(w.state==='duplicate')return '这句已经提交过，不会重复处理';
  if(w.state==='unconfirmed')return '已记下，但还没确认开始处理；稍后看这里的回复';
  return '';
}
async function lcSend(){
  const input=$('#lcInput');if(!input||lc.sending||!lc.chat)return;
  const text=input.value;if(!text.trim())return;
  // 同一次提交只用一个编号:发送失败后原样再点,落到同一句上,不会变成两句
  if(lc.pendingText!==text){lc.pendingText=text;lc.pendingId=sayRequestId();}
  lc.sending=true;$('#lcSend').disabled=true;
  try{
    const r=await api('/api/local/send','POST',{chatId:lc.chat,text,requestId:lc.pendingId});
    input.value='';lc.pendingText=null;lcGrow();
    const note=lcWhere(r.where);if(note)toast(note,'ok');
  }catch(e){toast(e.message,'err');}
  finally{lc.sending=false;$('#lcSend').disabled=false;await lcSync();const box=$('#lcMsgs');if(box)box.scrollTop=box.scrollHeight;input.focus();}
}
function lcGrow(){const t=$('#lcInput');if(!t)return;t.style.height='auto';t.style.height=Math.min(180,Math.max(36,t.scrollHeight))+'px';}

function renderLocalChat(el){
  // 导航与页头的名字改成「对话」(静态标记里仍是旧版的「试跑」,旧的非持久路径继续用它)
  const nav=$('[data-tab="playground"]');
  if(nav&&!nav.dataset.lc){nav.dataset.lc='1';nav.title='对话 — 在这台电脑上直接和它说话';const sp=$('span',nav);if(sp)sp.textContent='对话';const ic=$('use',nav);if(ic)ic.setAttribute('href','#lu-say');const h=$('.ptitle>[data-for="playground"]');if(h)h.textContent='对话';}
  if(!el.dataset.lc){
    el.dataset.lc='1';
    el.innerHTML=`<div class="lc">
      <aside class="lc-side"><div class="lc-side-h"><span>本机对话</span><button type="button" class="iconbtn sm" id="lcNew" title="新建本机对话" aria-label="新建本机对话">${IC.plus}</button></div><div class="lc-list" id="lcList"></div></aside>
      <section class="lc-main" id="lcMain">
        <div class="lc-head" id="lcHead"></div>
        <div class="lc-msgs" id="lcMsgs" aria-live="polite"></div>
        <div class="lc-busy" id="lcBusy" hidden></div>
        <div class="lc-in"><textarea id="lcInput" rows="1" placeholder="交代一件事…"></textarea><button class="btn primary" id="lcSend">发送</button></div>
        <div class="lc-foot"><span>Enter 发送，Shift+Enter 换行</span><i>·</i><span>发 /help 看可用命令</span><i>·</i><span>对话记录只保存在这台电脑上</span></div>
      </section>
      <section class="lc-none" id="lcNone" hidden><div class="lc-none-in"><div class="lc-none-t">在这台电脑上直接对话</div>
        <div class="hint">不用接入聊天平台。选一个项目目录，它用这台电脑上的 Claude Code 或 Codex 在里面处理你交代的事。</div>
        <button class="btn primary" id="lcNew2">${IC.plus} 新建本机对话</button></div></section>
    </div>`;
    $('#lcNew').onclick=lcOpenNew;$('#lcNew2').onclick=lcOpenNew;
    $('#lcSend').onclick=lcSend;
    const input=$('#lcInput');
    input.addEventListener('input',lcGrow);
    // 输入法组字时的回车是确认候选词,不是发送
    input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();lcSend();}});
    // 忙时的计时每秒走一格;服务的心跳只隔几秒带一次进度
    //   ——忙闲、排队、暂停一变就重画页头与状态条(心跳只换 S.live,不会重画这一页)
    lc.timer=setInterval(()=>{
      if(!lc.chat||!$('#playground').classList.contains('on'))return;
      const lv=lcLive(lc.chat),g=lcChats().find(x=>x.chatId===lc.chat)||{};
      const sig=[lv.busy,lv.finalizing,lv.waitingForCapacity,lv.queue,lv.held,g.paused,g.permissionMode,g.name].join('|');
      if(sig!==lc.liveSig){lc.liveSig=sig;lcPaint();if(!lv.busy)lcSync();}
      const n=$('#lcSecs');if(n&&lc.busyAt)n.textContent=lcSecs(Date.now()-lc.busyAt);
    },1000);
  }
  const chats=lcChats();
  $('#lcNone').hidden=!!chats.length;$('#lcMain').hidden=!chats.length;$('.lc-side',el).hidden=!chats.length;
  if(!chats.length){lc.chat=null;return;}
  if(!lc.chat||!chats.some(c=>c.chatId===lc.chat))lcLoad(chats[0].chatId);
  else{lcPaint();lcStick();lcSync();}
  lcLandOnce();
}

let settingsSpyHold=0;
function settingsSpy(){
  const tab=$('#settings'),toc=$('#setToc'),pb=$('.pbody'); if(!tab||!toc||!pb||!tab.classList.contains('on'))return;
  if(Date.now()<settingsSpyHold)return;                                  // 刚点过目录:平滑滚动途中不跟着跳
  const cards=settingsCards(); if(!cards.length)return;
  const own=getComputedStyle(pb).overflowY!=='visible';                  // 桌面:.pbody 自己滚;窄窗:整页滚

function bindWecomCard(){
  if(!$('#wecomCard'))return;
  if(!$('#wecomCard'))return;
  const parseNames=()=>{const out={};for(const line of $('#wNames').value.split(/\n+/)){const m=line.trim().match(/^(\S+)[\s=:,]+(.+)$/);if(m)out[m[1]]=m[2].trim();}return out;};
  const creds=()=>{const b={};const id=$('#wId').value.trim();if(id)b.botId=id;const sec=$('#wSecret').value.trim();if(sec)b.secret=sec;return b;}; // 空值不回传:env: 引用时字段渲染为空,回传空串会清掉凭据
  $('#wSave').onclick=async()=>{const b={...creds(),welcome:$('#wWelcome').value.trim(),names:parseNames(),pollSec:$('#wPoll').value.trim(),followSec:$('#wFollow').value.trim(),gatekeeper:{provider:$('#wGate').value,model:$('#wGateModel').value.trim()},keywords:$('#wKeywords').value.trim(),cliOff:$('#wCliOff').checked};
    try{S=await api('/api/wecom','POST',b);toast('企业微信已保存','ok');renderAll();}catch(e){toast(e.message,'err');}};
  $('#wIdentRefresh').onclick=async()=>{const btn=$('#wIdentRefresh');btn.disabled=true;btn.innerHTML='<span class="spin"></span> 取中…';
    try{const r=await api('/api/wecom/identity','POST',{});if(r.name){S=r.state||S;const via=r.source==='identity'?`(身份接口${r.user&&r.user.name?' · 授权用户 '+r.user.name:''})`:`(近 ${r.groups} 个群 · ${r.total} 条 @ 里 ${r.count} 条是它)`;toast((r.changed?`机器人名已更新为「${r.name}」`:`仍是「${r.name}」`)+via,'ok');renderAll();}else toast(r.hint||'没取到','err');}
    catch(e){toast(e.message,'err');}finally{btn.disabled=false;btn.textContent='刷新身份';}};
  $('#wPrecheck').onclick=async()=>{const btn=$('#wPrecheck'),box=$('#wCheck');
    btn.disabled=true;btn.innerHTML='<span class="spin"></span> 预检中…';box.innerHTML='';
    try{const c=creds();if(Object.keys(c).length)S=await api('/api/wecom','POST',c); // 预检读的是已存配置,先把填的凭据落盘
      const r=await api('/api/wecom/precheck','POST',{});
      const cls={ok:'ok',warn:'warn',fail:'fail',skip:'skip'};
      box.innerHTML=`<div class="fx-check">${(r.checks||[]).map(c=>`<div class="fx-crow"><span class="dot ${cls[c.status]||'skip'}"></span><span class="cl">${esc(c.label)}</span><span class="cd">${esc(c.detail||'')}</span></div>`).join('')}<div class="fx-note">${esc(r.note||'')}</div></div>`;
      toast('预检完成','ok');
    }catch(e){box.innerHTML=`<div class="fx-check"><div class="fx-crow"><span class="dot fail"></span><span class="cd" style="color:var(--fail)">${esc(e.message)}</span></div></div>`;toast(e.message,'err');}
    finally{btn.disabled=false;btn.innerHTML=IC.steth+' 预检';}};
}

/* UPGRADE_PROGRESS_BEGIN ── 控制台升级的进度弹窗 ──────────────────────────────────────────
   点「现在升级」→ 页内确认 → 进度弹窗。升级期间每 1.5 秒读一次 GET /api/update;服务切换那几秒
   连不上(或反代回 502)就显示「服务正在重启，页面会自动重连」,不当成错误;重启后旧令牌作废(环回
   免密模式)则交给 checkStaleAuth 整页重载。新版本连上全部群、任务记为 done 后,这一页还是旧版前端
   ⇒ 倒数 3 秒整页刷新,刷新后按 sessionStorage 记下的任务 id 再把结果弹出来一次。
   每一步的状态只从任务记录(state / prefix / installed / steps)推出来,不靠页面记忆。 */
const UPG_PHASES=[
  ['wait','等待所有群空闲'],
  ['install','下载并安装新版本'],
  ['stop','停止旧服务'],
  ['backup','核对群记录并备份数据'],
  ['preflight','新版本预检'],
  ['start','切换并启动新版本'],
  ['connect','等待全部群连上'],
];
function upgIsActive(j){return !!(j&&['queued','installing','switching'].includes(j.state));}
function upgVer(v){return String(v||'').trim().replace(/^v/i,'');}
function upgStep(j,name){const s=((j&&j.steps)||[]).find(x=>x&&x.step===name);return s?(s.ok?'ok':'bad'):'';}
// → [{key,label,state:'done'|'active'|'fail'|'todo'}]:最后一个已到达的步骤之前全算完成,下一步是
//   进行中(任务还在跑)或失败(任务已失败 / 已换回);换回旧版本时多一行「换回 vX」。
function upgPhases(j){
  if(!j)return [];
  const st=j.state, ok=n=>upgStep(j,n)==='ok';
  const reached={
    wait:!!(j.prefix||j.installed)||st==='installing'||st==='switching',
    install:!!j.installed,
    stop:ok('stop service'),
    backup:ok('journals unchanged')&&ok('data backed up'),
    preflight:ok('new version preflight'),
    start:ok('service entry replaced')&&ok('start new version'),
    connect:st==='done',
  };
  let last=-1;UPG_PHASES.forEach(([k],i)=>{if(reached[k])last=i;});
  if(st==='done')last=UPG_PHASES.length-1;
  const active=upgIsActive(j), failed=st==='failed'||st==='rolled-back';
  const out=UPG_PHASES.map(([key,label],i)=>({key,label,
    state:i<=last?'done':i===last+1?(active?'active':failed?'fail':'todo'):'todo'}));
  if(upgStep(j,'rollback')){
    const back=upgStep(j,'previous version started');
    out.push({key:'rollback',label:`换回 v${upgVer(j.from)}`,state:back==='ok'||st==='rolled-back'?'done':back==='bad'||st==='failed'?'fail':'active'});
  }
  return out;
}
// 连不上时是不是在切换:已进入安装 / 已装好 / 已在切换(排队等空闲时服务不会自己重启)
function upgRestarting(j){return !!(j&&(j.state==='switching'||j.state==='installing'||j.installed));}
function upgDur(ms){const s=Math.max(0,Math.round(ms/1000));return s<60?`${s} 秒`:`${Math.floor(s/60)} 分 ${String(s%60).padStart(2,'0')} 秒`;}
/* UPGRADE_PROGRESS_LOGIC_END */
const upg={timer:0,tick:0,polling:false,open:false,view:'',offlineSince:0,waiting:[],reloadAt:0,toasted:''};
const UPG_PAGE_VERSION=upgVer((document.querySelector('.mark .ver')||{}).textContent);
function upgWatchId(){try{return sessionStorage.getItem('sbot-upgrade-watch')||'';}catch{return '';}}
function upgSetWatch(id){try{if(id)sessionStorage.setItem('sbot-upgrade-watch',id);else sessionStorage.removeItem('sbot-upgrade-watch');}catch{}}
// 「在后台继续」收起的任务 id:服务重启后页面会整页重载(环回免密模式换令牌),收起的弹窗不能因此又弹出来
function upgHiddenId(){try{return sessionStorage.getItem('sbot-upgrade-hidden')||'';}catch{return '';}}
function upgSetHidden(id){try{if(id)sessionStorage.setItem('sbot-upgrade-hidden',id);else sessionStorage.removeItem('sbot-upgrade-hidden');}catch{}}
function upgJob(){return (S&&S.update&&S.update.job)||null;}
function upgManaged(){return !!(S&&S.update&&S.update.mode==='managed');}
function upgModalShown(){return !!(upg.open&&upg.view==='progress'&&$('#modalBg').classList.contains('show')&&$('#modal').classList.contains('upg'));}
function upgSchedule(ms=1500){clearTimeout(upg.timer);upg.timer=setTimeout(upgPoll,ms);}
// 由 updateTopUpdateBadge 在每次状态更新时调用:任务在跑就保证轮询在走;这一页发起(或看过)的任务
// 刚结束、页面刚刷新过来 ⇒ 把结果弹出来一次。
function upgEnsureWatch(){
  if(!upgManaged())return;
  const j=upgJob();if(!j)return;
  if(upgIsActive(j)&&!upg.timer&&!upg.polling)upgSchedule(1500);
  if(upg.open||upgWatchId()!==j.id||$('#modalBg').classList.contains('show'))return;
  if(upgHiddenId()!==j.id)upgOpen(false);
  else if(!upgIsActive(j))upgNotifyDone(j);   // 收起过:结束时只发一条提示
}
function upgNotifyDone(j){
  if(!j||upg.toasted===j.id)return;
  upg.toasted=j.id;upgSetWatch('');upgSetHidden('');
  toast(j.message||(j.state==='done'?`已升级到 v${upgVer(j.to)}`:'升级没有完成'),j.state==='done'?'ok':'err');
}
async function upgPoll(){
  upg.timer=0;if(upg.polling)return;upg.polling=true;
  let r=null,data=null;
  try{
    try{r=await fetch('/api/update',{headers:{'X-Sbot-Token':TOKEN},cache:'no-store'});}catch{}
    if(r&&r.status===401){upgRender();checkStaleAuth();return;}  // 重启后令牌作废:整页重载或落到登录框
    if(r&&r.ok){try{data=await r.json();}catch{}}
    if(!data||!data.currentVersion){                            // 断线 / 反代 502 / 服务重启中
      if(!upg.offlineSince)upg.offlineSince=Date.now();
      upgRender();upgSchedule(2000);return;
    }
    const wasOffline=!!upg.offlineSince;upg.offlineSince=0;
    upg.waiting=Array.isArray(data.waitingGroups)?data.waitingGroups:[];
    const {waitingGroups,...update}=data;
    S.update={...(S.update||{}),...update};
    const j=update.job;
    if(upgIsActive(j)){upgRender();updateTopUpdateBadge();upgSchedule(1500);return;}
    upgFinished(j,update,wasOffline);
  }finally{upg.polling=false;}
}
// 任务结束(done / failed / rolled-back):这一页是旧版前端就倒数刷新;弹窗被收起了就只发一条提示。
async function upgFinished(j,update,wasOffline){
  const mine=!!(j&&upgWatchId()===j.id);
  const stale=!!(j&&j.state==='done'&&UPG_PAGE_VERSION&&upgVer(update.currentVersion)!==UPG_PAGE_VERSION);
  if(j&&mine&&stale&&upgModalShown()&&!upg.reloadAt){
    upg.reloadAt=Date.now()+3000;upgRender();updateTopUpdateBadge();setTimeout(()=>location.reload(),3000);return;
  }
  if(j&&mine&&!upgModalShown())upgNotifyDone(j);
  upgRender();
  try{S=await api('/api/state');}catch{}
  updateTopUpdateBadge();
  if(!busyInteracting()){renderSettings();renderOverview();}
  else if(wasOffline&&!upgModalShown())renderOverview();
}

// 打开进度 / 结果弹窗。user=true:用户点的(「查看进度」、版本徽章旁的图标、刚确认),记下任务 id 以便刷新后接着看。

// 弹窗被关掉(按钮、点遮罩、别的弹窗):升级照常进行,版本徽章旁的图标保持转圈,结束时只发提示
function upgOnClose(){
  if(!upg.open)return;
  const wasProgress=upg.view==='progress';
  upg.open=false;upg.view='';clearInterval(upg.tick);upg.tick=0;
  const j=upgJob();
  if(wasProgress&&upgIsActive(j))upgSetHidden(j.id);
  else if(wasProgress&&j&&upgWatchId()===j.id){upgSetWatch('');upgSetHidden('');}
  // 结果看完了:设置页那张卡在弹窗开着时没重画,这里补一次
  if(wasProgress&&!upgIsActive(j))setTimeout(()=>{if(!busyInteracting()){renderSettings();renderOverview();}},0);
}
function upgRender(){
  const j=upgJob(), statusBox=$('#updateStatus');
  if(statusBox&&j&&upgManaged()&&upgIsActive(j)){
    const text=upg.offlineSince?(upgRestarting(j)?'服务正在重启，页面会自动重连…':'暂时连不上服务，正在重试…')
      :j.state==='switching'&&upgStep(j,'start new version')==='ok'?'新版本已启动，正在等全部群连上…':(j.message||j.state);
    statusBox.innerHTML=`<span class="spin"></span><span>${esc(text)}</span>`;
  }
  if(!upgModalShown()||!j)return;
  // 安装一结束,切换进程不到一秒就停掉旧服务:页面最后看到的多半还是「安装中」。这时连不上 = 正在切换
  const view=upg.offlineSince&&upgRestarting(j)&&j.state!=='switching'?{...j,state:'switching',installed:true}:j;
  const active=upgIsActive(view), st=view.state, phases=upgPhases(view);
  const end=active?Date.now():(+j.finishedAt||+j.updatedAt||Date.now());
  const took=upgDur(end-(+j.createdAt||end));
  const doneN=phases.filter(p=>p.key!=='rollback'&&p.state==='done').length;
  const pct=st==='done'?100:Math.max(4,Math.round(doneN/UPG_PHASES.length*100));
  const to=esc(upgVer(j.to)), from=esc(upgVer(j.from));
  const head=st==='done'?`<span class="upg-mark ok">✓</span><span>已升级到 v${to}</span>`
    :active?`<span class="spin"></span><span>正在升级到 v${to}</span>`
    :`<span class="upg-mark fail">!</span><span>升级没有完成</span>`;
  let note,noteCls='';
  if(active&&upg.offlineSince){note=st==='switching'?'服务正在重启，页面会自动重连…':'暂时连不上服务，正在重试…';noteCls='warn';}
  else if(st==='switching'&&upgStep(view,'start new version')==='ok'){note='新版本已启动，正在等全部群连上…';}
  else if(st==='queued'&&upg.waiting.length){note=`还在运行的群：${upg.waiting.map(g=>g.name).join('、')}`;}
  else if(st==='done'&&upg.reloadAt){note=`页面将在 ${Math.max(0,Math.ceil((upg.reloadAt-Date.now())/1000))} 秒后刷新，载入新版控制台`;}
  else{note=j.message||st;if(!active&&st!=='done')noteCls='fail';}
  const icon=p=>p.state==='done'?'✓':p.state==='fail'?'!':p.state==='active'?'<span class="spin"></span>':'';
  const btns=active?`<button class="btn" id="upgHide">在后台继续</button>`
    :st==='done'&&upg.reloadAt?`<button class="btn primary" id="upgReload">现在刷新</button>`
    :`<button class="btn${st==='done'?' primary':''}" id="upgDone">${st==='done'?'完成':'关闭'}</button>`;
  $('#modal').innerHTML=`<h3>${head}</h3>
    <div class="upg-sub"><span class="mono">v${from} → v${to}</span><span>${active?`已用 ${took}`:`用时 ${took}`}</span></div>
    <div class="upg-bar ${active?'run':st==='done'?'ok':'fail'}"><i style="width:${pct}%"></i></div>
    <ol class="upg-steps">${phases.map(p=>`<li class="${p.state}"><span class="dot">${icon(p)}</span><span>${esc(p.label)}</span></li>`).join('')}</ol>
    <div class="upg-note ${noteCls}">${esc(note)}</div>
    <div class="upg-btns">${btns}</div>`;
  const hide=$('#upgHide');if(hide)hide.onclick=()=>closeModal();
  const done=$('#upgDone');if(done)done.onclick=()=>closeModal();
  const rl=$('#upgReload');if(rl)rl.onclick=()=>location.reload();
}

// 飞书 WS 连接健康度 —— 与 server.js connHealthStatus/connHealthDetail 同口径(SSE 无重放,
// 心跳带 conn 兜底)。connected=绿 · connecting/reconnecting=黄(自愈中)· 其它=红。
function connStatus(c){if(!c)return 'warn';if(c.state==='connected')return 'ok';if(c.state==='connecting'||c.state==='reconnecting')return 'warn';return 'fail';}
function connDetail(c){if(!c)return '';const label={connected:'已连接',connecting:'连接中',reconnecting:'重连中',failed:'连接失败',stopped:'已停止'}[c.state]||c.state;const bits=[label];if(c.reconnects)bits.push('重连 '+c.reconnects);if(c.rebuilds)bits.push('重建 '+c.rebuilds);if(c.state!=='connected'&&c.lastError)bits.push(String(c.lastError).slice(0,60));return bits.join(' · ');}
// 在概览「健康」卡里就地更新各平台连接行(免整卡重渲染)。S.conn 是按平台名的字典 {feishu,wecom}(双平台并存,
// 服务端 connHealthRows 同口径;旧形状的单个快照按飞书算)。行的出现/消失(daemon 起停)= 少见,才回退整卡
// renderOverview;稳态只补 dot/文案 + 顶部汇总 pill。
const CONN_LABEL={feishu:'飞书连接',wecom:'企业微信连接',slack:'Slack 连接'};
function connDict(c){if(!c)return {};return typeof c.state==='string'?{feishu:c}:c;}
function updateConnLive(){
  if(!S)return;
  const d=connDict(S.conn);
  // 设置页企微卡的「身份与连接」条先同步(就地改文案,不重渲染表单 —— 用户可能正在填);放在最前:下面概览那段遇到行增减会整卡重画后 return
  {const wl=$('#wConnLine'); if(wl){const c=d.wecom; wl.textContent=wecomConnText(c); const ws=$('#wConnSt'); if(ws){const st=connStatus(c); ws.className='fx-ident-st '+(st==='ok'?'on':(st==='fail'?'off':'')); ws.textContent=c?(c.state==='connected'?'长连接在线':connDetail(c)):'未连接';}}}
  if(!$('#overview').innerHTML)return;
  for(const [k,label] of Object.entries(CONN_LABEL)){
    const c=d[k]; const row=document.querySelector('#ovHrows .hrow[data-hk="'+label+'"]');
    if((c&&!row)||(!c&&row)){renderOverview();return;} // 连接行出现/消失 → 整卡重画
    if(!c||!row)continue;
    const st=connStatus(c),dt=connDetail(c);
    row.querySelector('.dot').className='dot '+st;
    const v=row.querySelector('.v'); v.textContent=dt; v.title=dt;
    // 同步 S.health.rows + 汇总 pill,使就地补丁与整卡重渲染口径一致
    if(S.health&&S.health.rows){let r=S.health.rows.find(x=>x.label===label); if(!r){r={label};S.health.rows.push(r);} r.status=st; r.detail=dt;}
  }
  if(S.health&&S.health.rows){S.health.fails=S.health.rows.filter(x=>x.status==='fail').length; S.health.warns=S.health.rows.filter(x=>x.status==='warn').length;
    const pill=$('#ovHealthPill'); if(pill)pill.className='hpill '+healthClass(S.health); const txt=$('#ovHealthTxt'); if(txt)txt.textContent=healthText(S.health);
    syncHealthFold();}
}
function fmtUptime(ms){if(!ms)return '';const s=ms/1000,d=Math.floor(s/86400),h=Math.floor(s%86400/3600);return (d?d+'d':'')+h+'h';}
/* 页头服务器时钟:显示的是**服务器主机**的时区和时间(hostTz/hostOffsetMin)——
   访客本地钟浏览器自带、群内口径固定(cfg.timezone,默认北京),服务器自己的钟才是
   控制台独有信息;两口径不同时在悬浮提示注明。加载时用 now 校准一次「服务器-浏览器」
   时差,之后本地 setInterval 走秒 —— 不轮询。 */
let svSkew=0;
function fmtOffset(m){const s=m<0?'-':'+';m=Math.abs(m);return 'UTC'+s+pad2(Math.floor(m/60))+':'+pad2(m%60);}
function tickClock(){
  const t=S&&S.time,el=$('#svTime');if(!t||!el)return;
  const d=new Date(Date.now()+svSkew+t.hostOffsetMin*60000); // 服务器本地时间,按 UTC 取分量
  const hm=pad2(d.getUTCHours())+':'+pad2(d.getUTCMinutes()),ss=':'+pad2(d.getUTCSeconds());
  el.textContent=hm;$('#svSec').textContent=ss;
  $('#svClockWrap').firstChild.title='服务器时间 '+d.getUTCFullYear()+'-'+pad2(d.getUTCMonth()+1)+'-'+pad2(d.getUTCDate())+' '+hm+ss+' · '+(t.hostTz?t.hostTz+' ':'')+fmtOffset(t.hostOffsetMin)
    +(t.tz&&t.tz!==t.hostTz?' · 群内时间口径 '+t.tz+(t.tz==='Asia/Shanghai'?'(北京时间)':''):'');
}
function startClock(){
  const t=S&&S.time;if(!t)return;
  svSkew=t.now-Date.now();
  $('#svTz').textContent=t.hostTz||fmtOffset(t.hostOffsetMin);
  $('#svClockWrap').hidden=false;tickClock();
  if(!startClock._timer)startClock._timer=setInterval(tickClock,1000);
}

/* 主题:跟随系统(默认)→ 亮色 → 暗色,三态轮换。独立于 renderAll —— 切主题不重渲染卡片。
   data-theme-pref = 用户选的档(system / light / dark);data-theme = 算好的 light / dark,样式只认后者。
   跟随系统 = 不存 localStorage(首屏那段脚本没读到值就按系统定),系统外观变了页面当场跟着变。 */
const THEME_MQ=(()=>{try{return matchMedia('(prefers-color-scheme: dark)');}catch(e){return null;}})();
function themePref(){const p=document.documentElement.dataset.themePref;return p==='light'||p==='dark'?p:'system';}
function themeOf(){return document.documentElement.dataset.theme||'dark';}
/* 图标语义 = 当前这一档:显示器(跟随系统)/ 太阳(亮色)/ 月亮(暗色);提示里写明点了会去哪 */
const THEME_UI={system:['monitor','主题：跟随系统 · 点击切换到亮色'],light:['sun','主题：亮色 · 点击切换到暗色'],dark:['moon','主题：暗色 · 点击切换到跟随系统']};
function updateThemeBtn(){const b=$('#themeBtn');if(!b)return;const u=THEME_UI[themePref()];b.innerHTML=IC[u[0]];b.setAttribute('title',u[1]);b.setAttribute('aria-label',u[1]);}
function setTheme(p){p=p==='light'||p==='dark'?p:'system';const d=document.documentElement;
  d.dataset.themePref=p;d.dataset.theme=p==='system'?(THEME_MQ&&THEME_MQ.matches?'dark':'light'):p;
  try{if(p==='system')localStorage.removeItem('sbot-theme');else localStorage.setItem('sbot-theme',p);}catch(e){}
  updateThemeBtn();}
$('#themeBtn').onclick=()=>setTheme({system:'light',light:'dark',dark:'system'}[themePref()]);
if(THEME_MQ){const follow=()=>{if(themePref()==='system')setTheme('system');};
  if(THEME_MQ.addEventListener)THEME_MQ.addEventListener('change',follow);else if(THEME_MQ.addListener)THEME_MQ.addListener(follow);}
updateThemeBtn();

const I18N_BACK=(()=>{const m=new Map();for(const p of I18N_EN)if(!m.has(p[1]))m.set(p[1],p[0]);return m;})();

    // 重放不刷新 runAt:/api/activity 在每次 SSE 重连时都会重放整段,刷新的话闸门被无限推后、永不自愈
    if(entry.status==='running'&&activity[i].runAt)entry.runAt=activity[i].runAt;
    activity[i]=entry;} else activity.push(entry);
  activity.sort((x,y)=>(y.ts||0)-(x.ts||0)); activity=activity.slice(0,20);
}
// Replay recent activity from the daemon ring buffer — fills SSE gaps: open-into-empty,
// reconnect drops, and rows the self-heal resolved to a bare '✓' without their real done
// data. Idempotent (id-keyed merge). Called on load + on every SSE (re)connect.
async function syncActivity(repaint){
  if(S?.runtimeCapabilities&&typeof activityPanel!=='undefined')return activityPanel.sync();
  try{const d=await api('/api/activity'); if(d&&d.activity){d.activity.forEach(applyTurnEvent); if(repaint&&$('#overview').innerHTML)updateOverviewLive();}}catch(e){}
}

/* live push — EventSource can't send headers, so the token rides the query string. */
let esRef=null,helloN=0;
function startLive(){
  try{
    if(esRef){try{esRef.close();}catch{}}
    helloN=0;
    const es=new EventSource('/api/events?token='+encodeURIComponent(TOKEN));esRef=es;
    es.addEventListener('activity-update',ev=>{try{activityPanel.receive(JSON.parse(ev.data));}catch{}});
    es.addEventListener('local-message',ev=>{try{lcReceive(JSON.parse(ev.data));}catch{}});
    // hello fires on first connect AND every native reconnect → replay the buffer to
    // recover whatever SSE dropped while we were away (SSE has no replay of its own);
    // 重连(非首连)还拉一次全量 state —— 断流期间的 live/conn 变化就地补齐,不整页重渲染。
    es.addEventListener('hello',()=>{$('#conn').classList.add('live');if(typeof activityPanel!=='undefined')activityPanel.connected(true);syncActivity(true);
      if(++helloN>1)api('/api/state').then(r=>{S=r;updateDaemon();updateTopUpdateBadge();updateOverviewLive();updateConnLive();startClock();}).catch(()=>{});});
    es.addEventListener('tick',ev=>{try{const d=JSON.parse(ev.data);if(S){if(d.live)S.live=d.live;if('conn' in d)S.conn=d.conn;}if(d.activity)d.activity.forEach(applyTurnEvent);updateDaemon();updateOverviewLive();updateConnLive();}catch{}});
    startAutoRefresh();
    es.addEventListener('conn',ev=>{try{const c=JSON.parse(ev.data);if(S){S.conn=Object.assign({},connDict(S.conn),{[c.platform||'feishu']:c});updateConnLive();}}catch{}}); // 连接状态变化即时推(不等心跳);事件带 platform 名,落进字典对应槽
    es.addEventListener('turn',ev=>{try{const d=JSON.parse(ev.data);applyTurnEvent(d);updateOverviewLive();
      // 收件箱跟着轮次走:刚失败的要尽快出现,重说成功的要尽快消失 —— 不等 60 秒的例行刷新;只取这一块,不拉整份 state
      if(d.kind==='done')refreshInbox();}catch(e){}});
    es.onerror=()=>{$('#conn').classList.remove('live');if(typeof activityPanel!=='undefined')activityPanel.connected(false);checkStaleAuth();};
  }catch(e){}
}
/* SSE 断流自愈:daemon 重启会作废内存里的 token(页面 token / 登录 session 都是),
   已打开的页面会静默变死(重连永远 401、实时活动/状态全部冻结)。探一针:确是 401 ⇒
   30s 内首次先整页自动重载(环回模式拿新注入 token 直接复活;密码模式落到登录框);
   仍 401(如 30s 内已试过)⇒ 清 token 弹登录。非 401 = 普通断网,交给 EventSource 自动重连。 */
let staleChecking=false;
async function checkStaleAuth(){
  if(staleChecking)return;staleChecking=true;
  try{
    const r=await fetch('/api/activity',{headers:{'X-Sbot-Token':TOKEN}});
    if(r.status===401){
      const last=+sessionStorage.getItem('sbot-reload-ts')||0;
      dropToken();
      if(Date.now()-last>30000){sessionStorage.setItem('sbot-reload-ts',String(Date.now()));location.reload();return;}
      TOKEN='';if(esRef){try{esRef.close();}catch{}}showLogin();
    }
  }catch{}finally{staleChecking=false;}
}
function boot(){ load(); startLive(); }

/* Login gate: shown when the page has no token (password is set). On success the
   session token replaces TOKEN and the console boots normally. No cookie — the token
   lives in memory + sessionStorage, sent via x-sbot-token like everywhere else. */
function showLogin(){
  if($('#loginBg'))return;
  const bg=document.createElement('div');bg.id='loginBg';
  bg.style.cssText='position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg)';
  // 公网域名上只出「用飞书登录」(公网入口不放密码登录);本机 / 局域网 IP 仍可密码登录。
  // 服务端没配好飞书登录(FEISHU_LOGIN 为空)时一律出密码框 —— 别把人锁在外面。
  const privateHost=/^(\d{1,3}\.){3}\d{1,3}$|^localhost$|^\[?::1\]?$/.test(location.hostname);
  const showPw=!FEISHU_LOGIN||privateHost;
  const btnCss='display:block;width:100%;box-sizing:border-box;height:32px;line-height:32px;padding:0 14px;font-size:13px;border-radius:6px;border:0;font-weight:600;cursor:pointer;font-family:var(--sans);text-align:center;text-decoration:none';
  const feishuBtn=FEISHU_LOGIN?`<a id="loginFeishu" href="/api/auth/feishu/start" style="${btnCss};background:var(--primary-bg);color:var(--primary-ink)">用飞书登录</a>
    <div style="font-size:12px;color:var(--faint);margin:8px 2px 0">只有管理员名单里的人能进</div>`:'';
  const divider=(FEISHU_LOGIN&&showPw)?`<div style="display:flex;align-items:center;gap:8px;margin:14px 0 10px;color:var(--faint);font-size:11px"><span style="flex:1;height:1px;background:var(--line-hi)"></span>或用密码<span style="flex:1;height:1px;background:var(--line-hi)"></span></div>`:'';
  const pwForm=showPw?`<input id="loginPw" type="password" autocomplete="current-password" placeholder="密码"/>
    <div id="loginErr" style="color:var(--fail);font-size:12px;min-height:15px;margin:7px 2px 0"></div>
    <button type="submit" style="${btnCss};margin-top:6px;${FEISHU_LOGIN?'background:var(--ctl-bg);color:var(--ink);border:1px solid var(--ctl-line);line-height:30px':'background:var(--primary-bg);color:var(--primary-ink)'}">登录</button>`:'';
  bg.innerHTML=`<form id="loginForm" style="background:var(--modal-bg);border:1px solid var(--line);padding:24px;border-radius:14px;width:min(340px,90vw);box-shadow:var(--sh-lg)">
    <div style="font-size:15px;font-weight:600;color:var(--ink)">SintBot 控制台</div>
    <div style="font-size:12px;color:var(--faint);margin:4px 0 16px">${FEISHU_LOGIN?'用你的飞书账号登录':'请输入访问密码'}</div>
    ${feishuBtn}${divider}${pwForm}</form>`;
  document.body.appendChild(bg);
  const form=$('#loginForm');
  if(!showPw){form.onsubmit=e=>e.preventDefault();return;}
  const pw=$('#loginPw');if(!FEISHU_LOGIN)pw.focus();
  form.onsubmit=async(e)=>{e.preventDefault();const errEl=$('#loginErr');errEl.textContent='';
    try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw.value})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok||!j.token){errEl.textContent=(r.status===403&&!privateHost)?'公网入口只支持飞书登录,请管理员先在「设置 → 飞书应用」填公网地址':(j.error||('登录失败 (HTTP '+r.status+')'));pw.select();return;}
      TOKEN=j.token;try{localStorage.setItem('sbot-token',TOKEN);sessionStorage.setItem('sbot-token',TOKEN);}catch{}bg.remove();boot();
    }catch(err){errEl.textContent='网络错误';}};
}

if(TOKEN)boot();else showLogin();
</script>
</body>
</html>
