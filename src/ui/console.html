// opts(群 · 项目页「没连接的 Slack 会话」的「添加」):{plat, pick, name} —— 打开时切到这个平台、选中这个会话(新绑定)
async function openBind(pre,opts){
  // 多平台并存:配了两个以上才显示切换;只配了一个就直接那一种(Slack 列 bot 已加入的频道)。企微形态 = 指引 + 刷新 + 候选(机器人被 @ 过的群)+ 手填,
  // 没有建群 / 解散(平台上没接口);第二步「项目与模型」两边共用;保存时写入 platform。
  const plats=S.platforms||{feishu:true,wecom:false};
  const PL={feishu:'飞书',wecom:'企业微信',slack:'Slack'};
  const onPlats=Object.keys(PL).filter(k=>plats[k]);
  const both=onPlats.length>1;
  let plat=(plats.feishu||!onPlats.length)?'feishu':onPlats[0];
  // 从群卡进来 = 修改这个群:候选列表按它自己的平台拉,打开后直接选中它
  const preG=pre?S.groups.find(x=>x.chatId===pre):null;
  if(preG&&preG.platform&&PL[preG.platform]&&plats[preG.platform])plat=preG.platform;
  else if(!preG&&opts&&PL[opts.plat]&&plats[opts.plat])plat=opts.plat;
  let chats=null,err=null,hint='';
  const loadChats=async()=>{chats=null;err=null;hint='';
    try{
      // ⚠ 都只列「bot 在里面的」:Slack 列 bot 已加入的频道(没 /invite 的频道绑了也收不到消息)
      if(plat==='slack'){const r=await api('/api/slack/channels');chats=(r.channels||[]).map(c=>({chatId:c.id,name:c.name+(c.isPrivate?' 🔒':'')}));}
      else{const r=await api(plat==='wecom'?'/api/wecom/chats':'/api/feishu/chats');chats=r.chats;hint=r.hint||'';}
    }catch(e){err=e.message;}};
  await loadChats();
  let picked='',pickedName='';
  const boundIds=new Set(S.groups.map(g=>g.chatId));
  // rows: name + 已绑定 tag。解散按钮只出现在【已绑定】的群上—— 未绑定的群
  // 不归 sbot 管辖;有其他用户时走两步式(群内预告 → 确认解散),空群/仅管理员一步解散。
  const isWe=()=>plat==='wecom';
  // 企微群没有解散按钮(平台上没接口);飞书群已绑定的才出「解散」
  const renderList=()=>(chats&&chats.length?`<div class="chatpick">${chats.map(c=>`<div class="ci" data-cid="${esc(c.chatId)}" data-cname="${esc(c.name)}">
      <span class="cnm"><span class="nm">${esc(c.name)}</span>${boundIds.has(c.chatId)?'<span class="chip set">已绑定</span>':''}</span>
      <span class="inline" style="gap:8px"><span class="cid">${esc(c.chatId)}</span></span>
    </div>`).join('')}</div>`
    :`<div class="empty">${err?'拉群列表失败:'+esc(err):(isWe()?'还没有机器人被 @ 过的群':plat==='slack'?'机器人还没被拉进任何频道 — 去频道里发 /invite @机器人':'bot 不在任何群 / 未配飞书')} · 可手动填 ${plat==='slack'?'频道 ID':'chatId'}</div>`);
  const manualHint=()=>isWe()?'只列了机器人被 @ 过的群 —— 手填的 id 若机器人不在群里,绑了也收不到消息;单聊填对方账号':plat==='slack'?'只列了机器人已加入的频道 —— 手填的频道 ID 若机器人不在频道里,绑了也收不到消息':'只列了 bot 在里面的群 —— 手填的 id 若 bot 不在群里,绑了也收不到消息';
  const manualPh=()=>isWe()?'wr…':plat==='slack'?'C…':'oc_...';
  // 第一步的头与指引按平台切:飞书 = 「创建新群」;企微 = 三步指引 + 「刷新列表」(新群 @ 过机器人后才出现在候选里)
  const renderHead=()=>plat==='slack'
    ?`<div class="chatpick-head"><span class="ttl">选择 Slack 频道</span><button class="btn gi" id="mRefresh" title="刷新列表" aria-label="刷新列表">${IC.refresh}</button></div>
      <div class="hint" style="margin:-6px 0 10px">在频道里发 <b>/invite @机器人</b> 把它拉进来,刷新后就会出现在这里</div>`
    :isWe()
    ?`<div class="chatpick-head"><span class="ttl">选择企业微信群</span><button class="btn gi" id="mRefresh" title="刷新列表" aria-label="刷新列表">${IC.refresh}</button></div>
      <div class="hint" style="margin:-6px 0 10px">在企业微信里<b>建群 → 从群菜单把机器人加进群 → @ 它一次</b>,刷新后就会出现在这里${hint?' · '+esc(hint):''}</div>`
    :`<div class="chatpick-head"><span class="ttl">选择飞书群</span><button class="btn gi" id="mNewChat" title="创建新群" aria-label="创建新群">${IC.plus}</button></div>`;
  $('#modal').innerHTML=`<h3 id="mTitle">添加群项目</h3>
    <div id="mStep1">
    ${both?`<div class="inline" style="margin:-4px 0 14px;gap:10px"><span class="faint" style="font-size:12px">平台</span><div class="segtoggle" id="mPlat">${onPlats.map(k=>`<button type="button" class="${plat===k?'on':''}" data-plat="${k}" title="${PL[k]}${k==='slack'?' 频道':'群'}">${platLogo(k)}<span>${PL[k]}</span></button>`).join('')}</div></div>`:''}
    <div id="chatHeadWrap">${renderHead()}</div>
    <div id="chatListWrap">${renderList()}</div>
    <div id="newChatRow" style="display:none;margin-bottom:16px">
      <div class="newchat-row" style="margin-bottom:8px"><input id="mNewName" placeholder="新群名称"/><button class="btn" id="mNewGo" title="建群">${IC.plus}<span>建群</span></button></div>
      <div class="inline" id="mAutoInvite" style="flex-wrap:wrap;gap:6px;font-size:12px"></div>
    </div>
    <div class="inline" style="justify-content:flex-end;margin:-8px 0 14px"><a class="lnk2" id="mManual" href="#">列表里没有?手动填 ID</a></div>
    <div id="manualRow" class="field" hidden><label class="f">chat id<span class="faint" style="font-weight:400;margin-left:6px" id="mManualHint">${manualHint()}</span></label><div class="inline" style="gap:8px"><input id="mChat" placeholder="${manualPh()}" value="" style="flex:1"/><button class="btn" id="mManualGo" title="下一步">${IC.chevronRight}<span>下一步</span></button></div></div>
    </div>
    <div id="mStep2" hidden>
    <div class="fx-sub" style="margin-top:2px">项目与模型</div>
    <div id="mPicked" class="picked-row"></div>
    <div class="field"><label class="f">项目目录${(S.projectsRoots&&S.projectsRoots.length)?`<span class="faint" style="font-weight:400;margin-left:6px">须在 ${esc(S.projectsRoots.join(' 或 '))} 下</span>`:''}</label>
      <div class="inline" style="gap:10px"><button class="btn gi" id="mBrowse" title="选择目录…" aria-label="选择目录…">${IC.folder}</button><span id="mWdShow" class="faint" style="flex:1;min-width:0;font-family:var(--mono);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">未选择</span><a class="lnk2" id="mWdManual" href="#" style="white-space:nowrap">手动填写</a></div>
      <div id="mWdManualRow" hidden style="margin-top:6px"><input id="mWd" placeholder="${esc((S.projectsRoots&&S.projectsRoots[0])||'/path/to/proj')}${(S.projectsRoots&&S.projectsRoots[0]&&/^[A-Za-z]:\\/.test(S.projectsRoots[0]))?'\\':'/'}项目名" style="width:100%"/></div></div>
    <div class="field"><label class="f">模型</label><select id="mProv">${S.providers.filter(p=>!p.hidden&&p.configured).map(p=>`<option ${p.name===S.defaultProvider?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
    <div class="mfoot"><button class="btn" id="mCancel" title="取消">${IC.x}<span>取消</span></button><button class="btn primary" id="mSave" title="创建" disabled>${IC.plus}<span>创建</span></button></div>
    </div>`;
  $('#modalBg').classList.add('show');
  // ── 两步流:先选群(或建群 / 手动填 ID),选定了才出现「项目与模型」(用户 2026-09-07 提出)。
  //   原先四样并列(列表 · 手填 id · workdir · 模型),看不出哪个是主动作;点列表也只是把 id 静默
  //   灌进一个文本框。现在:选定 ⇒ 摘要行 + 第二步展开 + 焦点落到 workdir;「换一个」回第一步。
  const step2=$('#mStep2'),pickedRow=$('#mPicked');
  const updateSave=()=>{const b=$('#mSave');if(b)b.disabled=!(picked&&$('#mWd').value.trim());};
  // 提交键:新绑定写 Create,改已绑定的群写 Save;中文说法进提示
  const saveKey=edit=>{const b=$('#mSave');if(!b)return;b.innerHTML=(edit?IC.check:IC.plus)+'<span>'+(edit?'保存':'创建')+'</span>';b.title=edit?'保存修改':'创建';};
  // 目录以「选择目录…」为主入口(选择器天然在项目根目录之内,不会撞围栏);#mWd 仍是唯一的值来源,手填折叠着。
  const setWd=(v)=>{$('#mWd').value=v||'';const sh=$('#mWdShow');if(sh){sh.textContent=v||'未选择';sh.classList.toggle('faint',!v);}updateSave();};
  const select=(cid,name,manual)=>{
    picked=cid;pickedName=name||'';$('#mChat').value=cid;
    $$('#modal .ci').forEach(x=>x.classList.toggle('sel',x.dataset.cid===cid));
    // 已绑定的群:载入现有绑定(workdir/模型),按钮转「保存修改」(upsert 保留权限)
    const g=S.groups.find(x=>x.chatId===cid);
    // 改既有群:平台以群本身为准(切换器只是候选列表的来源,不能把企微群改写成飞书 —— 对抗审查逮到的)
    if(g&&g.platform&&g.platform!==plat){plat=g.platform;$$('#mPlat button').forEach(b=>b.classList.toggle('on',b.dataset.plat===plat));}
    pickedRow.innerHTML=`<span class="chip ${g?'set':'cap'}">${g?'已绑定':(manual?'手动填写':'新绑定')}</span>${both?`<span class="chip tan">${PL[plat]}</span>`:''}<span class="pnm">${esc(name||cid)}</span>${name?`<span class="cid">${esc(cid)}</span>`:'<span class="cid"></span>'}<a class="lnk" id="mRepick" href="#">换一个</a>`;
    $('#mRepick').onclick=(e)=>{e.preventDefault();repick();};
    if(g){setWd(g.workdir||'');if(g.provider)$('#mProv').value=g.provider;saveKey(true);}
    else{setWd('');saveKey(false);}
    // 选中已绑定的群 = 修改这个群的目录与模型:标题跟着说「修改」,换回别的群再变回「添加」
    $('#mTitle').textContent=g?'修改群项目':'添加群项目';
    $('#manualRow').hidden=true;step2.hidden=false;updateSave();$('#mBrowse').focus();
  };
  const repick=()=>{$('#mStep1').hidden=false;picked='';pickedName='';$('#mChat').value='';$$('#modal .ci').forEach(x=>x.classList.remove('sel'));step2.hidden=true;setWd('');saveKey(false);$('#mTitle').textContent='添加群项目';updateSave();};
  $('#mWd').addEventListener('input',()=>setWd($('#mWd').value));
  $('#mWdManual').onclick=(e)=>{e.preventDefault();const r=$('#mWdManualRow');r.hidden=!r.hidden;if(!r.hidden)$('#mWd').focus();};
  // 根目录在控制台只读(不给「更改」入口):它是围栏的策略,改只走安装向导或机器上的配置文件
  $('#mManual').onclick=(e)=>{e.preventDefault();const r=$('#manualRow');r.hidden=!r.hidden;if(!r.hidden)$('#mChat').focus();};
  const manualGo=()=>{const v=$('#mChat').value.trim();if(!v){toast('先填 ID','err');return;}select(v,'',true);};
  $('#mManualGo').onclick=manualGo;
  $('#mChat').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();manualGo();}});
  // Auto-invite line: a new chat gets bot(owner) + the admin(s) the
  // operator ticks. Admins are configured in 设置; here you only choose which of them
  // to pull into THIS group (all ticked by default). No admin ⇒ bot-only group is
  // invisible in Feishu, so点建群前提示去设置里加。
  const fe=S.feishu||{};
  const admins=Array.isArray(fe.admins)?fe.admins:[];
  const renderAutoInvite=()=>{
    const el=$('#mAutoInvite');if(!el)return;
    const botChip='<span class="chip set">'+IC.bot+' bot(群主)</span>';
    if(!admins.length){
      el.innerHTML=botChip+'<span class="chip none">'+IC.warn+' 未配置管理员</span><span class="faint">纯 bot 群飞书里谁都看不到 — 先去「设置 → 飞书应用」加管理员</span>';
      return;
    }
    el.innerHTML=botChip+`<span class="faint">勾选拉入的管理员:</span><div class="fx-invite">${admins.map(a=>`<label><input type="checkbox" class="mAdminChk" value="${esc(a.openId)}" checked/> ${IC.user} ${esc(a.name||a.openId)}</label>`).join('')}</div>`;
  };
  const bindRows=()=>{
    $$('#modal .ci').forEach(ci=>ci.onclick=()=>select(ci.dataset.cid,ci.dataset.cname||''));
  };
  // 第一步头部的按钮(建群 / 刷新)每次重画头都要重新挂;平台切换 = 重拉列表 + 重画头与列表 + 回到第一步
  const bindHead=()=>{
    const nc=$('#mNewChat');if(nc)nc.onclick=()=>{const r=$('#newChatRow');const show=r.style.display==='none';r.style.display=show?'block':'none';if(show){$('#mNewName').focus();renderAutoInvite();}};
    const rf=$('#mRefresh');if(rf)rf.onclick=async()=>{rf.disabled=true;rf.setAttribute('aria-busy','true');rf.innerHTML='<span class="spin"></span>';await loadChats();$('#chatListWrap').innerHTML=renderList();bindRows();$('#chatHeadWrap').innerHTML=renderHead();bindHead();if(err)toast(err,'err');else toast('已刷新:'+(chats?chats.length:0)+(plat==='slack'?' 个频道':' 个群'),'ok');};
  };
  const switchPlat=async(np)=>{if(np===plat)return;plat=np;$$('#mPlat button').forEach(b=>b.classList.toggle('on',b.dataset.plat===plat));
    repick();$('#newChatRow').style.display='none';
    $('#chatListWrap').innerHTML='<div class="empty"><span class="spin"></span> 加载中…</div>';
    await loadChats();$('#chatHeadWrap').innerHTML=renderHead();bindHead();$('#chatListWrap').innerHTML=renderList();bindRows();
    $('#mManualHint').textContent=manualHint();
    $('#mChat').placeholder=manualPh();};
  $$('#mPlat button').forEach(b=>b.onclick=()=>switchPlat(b.dataset.plat));
  bindRows();bindHead();
  $('#mNewGo').onclick=async()=>{const name=$('#mNewName').value.trim();if(!name){toast('群名称必填','err');return;}
    if(!admins.length){toast('先去「设置 → 飞书应用」加管理员 — 只有 bot 的群飞书里谁都看不到','err');return;}
    const invitees=$$('#mAutoInvite .mAdminChk:checked').map(c=>c.value);
    if(!invitees.length){toast('至少勾选一名管理员拉入,否则纯 bot 群飞书里看不到','err');return;}
    const btn=$('#mNewGo'),label=btn.innerHTML;btn.disabled=true;btn.setAttribute('aria-busy','true');btn.innerHTML='<span class="spin"></span><span>创建</span>';
    try{const c=await api('/api/feishu/chats/create','POST',{name,memberIds:invitees});chats=chats||[];chats.unshift(c);
      $('#chatListWrap').innerHTML=renderList();bindRows();
      // auto-select the freshly created chat
      select(c.chatId,c.name||'');
      toast('已创建群「'+c.name+'」(bot+管理员已入群),已选中','ok');$('#newChatRow').style.display='none';$('#mNewName').value='';
    }catch(e){toast(e.message,'err');}finally{btn.disabled=false;btn.removeAttribute('aria-busy');btn.innerHTML=label;}};
  $('#mBrowse').onclick=()=>openFsPicker((p)=>{ if(p){setWd(p); toast('已选 '+p,'ok');} });
  if(preG){const c=(chats||[]).find(x=>x.chatId===pre);select(pre,(c&&c.name)||gName(preG)||'');$('#mStep1').hidden=true;}
  else if(opts&&opts.pick&&plat===opts.plat){const c=(chats||[]).find(x=>x.chatId===opts.pick);
    // 列表里有就当点了那一行;私聊不在频道列表里(或列表没取到),按手动填写选中
    if(c)select(c.chatId,c.name||'');else select(opts.pick,opts.name||'',!opts.name);}
  $('#mCancel').onclick=closeModal;
  $('#mSave').onclick=async()=>{const chatId=$('#mChat').value.trim(),workdir=$('#mWd').value.trim(),provider=$('#mProv').value;
    if(!chatId||!workdir){toast('chatId 与 workdir 必填','err');return;}
    try{const r=await api('/api/groups','POST',{chatId,workdir,provider,name:pickedName,platform:plat});S=r;
      const isEdit=boundIds.has(chatId);if(!isEdit&&r.slackInvite)toast('已创建群项目，但机器人还不在这个频道里，使用指引发不出去（私有频道会显示为找不到频道）。先在 Slack 的这个频道里发 /invite @机器人名 把它请进来，再 @它 派单。','err');else if(!isEdit&&r.slackDirect)toast('已创建群项目，但机器人看不到这个私聊，使用指引发不出去。只能绑定和机器人本身的私聊：在 Slack 里打开机器人、给它发一句话，再绑定那个私聊。','err');else toast(isEdit?'已保存群项目配置':(r.notified?'已创建群项目,并已在群里发送使用指引':r.noticeQueued?'已创建群项目,使用指引已交给守护进程发往群里':'已创建群项目'),'ok');closeModal();renderAll();}catch(e){toast(e.message,'err');}};
}
// Directory tree picker: browse one level at a time, choose a dir to
// feed back into the workdir field. onPick(path|null) called on confirm/cancel.
// 选的是「这个文件夹」本身:单击只选中(高亮),双击或点行尾 › 才进入;一行都没选时,「选定」取当前所在目录。
async function openFsPicker(onPick){
  const m=$('#fsModal');let cwd='';
  const load=async(target,select)=>{
    m.innerHTML=`<h3>选择项目目录</h3><div class="fs-empty">读取中…</div>`;
    try{const r=await api('/api/fs/listdir'+(target?('?path='+encodeURIComponent(target)):''));cwd=r.cwd;render(r,select);}
    catch(e){m.innerHTML=`<h3>选择项目目录</h3><div class="fs-empty">读取失败: ${esc(e.message)}</div><div class="mfoot"><button type="button" class="btn" id="fsBack" title="返回" aria-label="返回">${IC.up}<span>返回</span></button></div>`;$('#fsBack').onclick=()=>load('');}
  };
  const render=(r,select)=>{
    let sel=select&&r.items.some(i=>i.path===select)?select:'';
    // 根=项目根目录,到顶不再向上;配了多个根时,到顶可以回「全部项目根目录」那一层(cwd 为空 = 根清单)
    const multi=(r.roots||[]).length>1;
    const up=(r.cwd&&!r.atRoot)?pathParent(r.cwd):'';
    const upEntry=up?`<div class="fs-item up" data-up="${esc(up)}">${IC.up} .. (上级)</div>`:(multi&&r.cwd?`<div class="fs-item up" data-up="">${IC.up} 全部项目根目录</div>`:'');
    const items=[upEntry].concat(
      r.items.length?r.items.map(i=>`<div class="fs-item" role="option" aria-selected="false" data-path="${esc(i.path)}" title="${esc(i.path)}">${IC.folder}<span class="fs-nm" data-i18n-skip>${esc(i.name)}</span><button type="button" class="fs-open" data-open="${esc(i.path)}" title="打开文件夹" aria-label="打开文件夹">${IC.chevronRight}</button></div>`).join('')
      :`<div class="fs-empty">(无子目录)${r.atRoot&&r.cwd?' — 可以在此新建项目文件夹，或直接选定当前目录':''}</div>`).join('');
    m.innerHTML=`<h3>选择项目目录</h3>
      <div class="fs-cwd">${r.rootList?'选择一个项目根目录':esc(r.cwd||'')}${r.atRoot&&r.cwd?'<span class="faint" style="font-size:11px;margin-left:8px">项目根目录</span>':''}</div>
      <div class="fs-list" role="listbox" tabindex="0" aria-label="文件夹">${items}</div>
      <div class="fs-tip">单击选中文件夹，双击或点 › 进入</div>
      ${r.rootList?'':`<div class="inline" style="gap:8px;margin-bottom:12px"><input id="fsNewName" placeholder="在当前目录下新建项目文件夹…"/><button type="button" class="btn ikey" id="fsMkdir" title="新建" aria-label="新建">${IC.plus}</button></div>`}
      <div class="fs-target" id="fsTarget"></div>
      <div class="mfoot"><button type="button" class="btn" id="fsCancel" title="取消">${IC.x}<span>取消</span></button><button type="button" class="btn primary" id="fsPick" title="选定">${IC.check}<span>选定</span></button></div>`;
    const rows=$$('#fsModal .fs-item[data-path]'), target=()=>sel||r.cwd||'';
    const paint=()=>{
      rows.forEach(el=>{const on=el.dataset.path===sel;el.classList.toggle('sel',on);el.setAttribute('aria-selected',String(on));});
      const t=target();
      $('#fsTarget').innerHTML=t?`<span>${sel?'将选定':'将选定当前目录'}</span> <code data-i18n-skip>${esc(t)}</code>`:'';
      $('#fsPick').disabled=!t;
    };
    const choose=p=>{sel=p;paint();const el=rows.find(x=>x.dataset.path===p);if(el)el.scrollIntoView({block:'nearest'});};
    rows.forEach(el=>{
      el.onclick=e=>{if(e.target.closest('.fs-open'))return;choose(el.dataset.path);};
      el.ondblclick=e=>{if(e.target.closest('.fs-open'))return;load(el.dataset.path);};
    });
    $$('#fsModal .fs-open').forEach(b=>b.onclick=e=>{e.stopPropagation();load(b.dataset.open);});
    $$('#fsModal .fs-item.up').forEach(el=>el.onclick=()=>load(el.dataset.up||''));
    // 键盘:↑↓ 选中,→ 进入选中的文件夹,← 回上级,回车 = 选定
    const list=$('#fsModal .fs-list');
    list.addEventListener('keydown',e=>{
      const i=rows.findIndex(x=>x.dataset.path===sel);
      if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!rows.length)return;const n=e.key==='ArrowDown'?Math.min(rows.length-1,i+1):Math.max(0,i<0?0:i-1);choose(rows[n].dataset.path);}
      else if(e.key==='ArrowRight'&&sel){e.preventDefault();load(sel);}
      else if(e.key==='ArrowLeft'){const u=$('#fsModal .fs-item.up');if(u){e.preventDefault();load(u.dataset.up||'');}}

// parent dir for the "up" entry; '' at a drive root / POSIX root → back to drive list.
// Pure-string (no Node path/process — this runs in the browser). Handles both
// Windows (D:\…\) and POSIX (/…) path shapes the server returns.
function pathParent(p){
  if(!p) return '';
  const win=/^[A-Za-z]:[\\/]/.test(p);
  const norm=p.replace(/\\/g,'/').replace(/\/+$/,'');
  // drive root like D: → drive list; POSIX root / → drive list/empty
  if(/^[A-Za-z]:$/i.test(norm)) return '';
  if(norm==='/'||norm==='') return '';
  const i=norm.lastIndexOf('/');
  if(i<=0){
    // /foo → /  ;  D:/foo → D:\
    if(norm[0]==='/') return '/';
    if(/^[A-Za-z]:$/i.test(norm.slice(0,2))) return norm.slice(0,2)+'\\';
    return '';
  }
  let parent=norm.slice(0,i);
  if(/^[A-Za-z]:$/i.test(parent)) return parent+'\\'; // D: → D:\
  if(parent==='') return '';
  return win?parent.replace(/\//g,'\\'):parent;
}

const lcClock=ts=>{const d=new Date(ts),z=n=>String(n).padStart(2,'0');const day=new Date().toDateString()===d.toDateString()?'':(d.getMonth()+1)+'-'+d.getDate()+' ';return day+z(d.getHours())+':'+z(d.getMinutes());};
const lcSecs=ms=>{const t=Math.max(0,Math.round(ms/1000));return t<60?t+'s':Math.floor(t/60)+'m '+z2(t%60)+'s';};
const z2=n=>String(n).padStart(2,'0');
/* 回答里的轻量 Markdown:围栏代码块、行内代码、粗体、标题行、裸链接。先转义再加标签,别的一概当文字。 */
function lcInline(seg){
  let h=esc(seg).replace(/^\n+|\n+$/g,'');
  h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')
    .replace(/^#{1,4}\s+(.+)$/gm,'<b class="lc-hd">$1</b>')
    .replace(/(^|[\s(（])(https?:\/\/[^\s<)）]+)/g,(m,a,u)=>a+'<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>');
  return h?'<span class="lc-text">'+h+'</span>':'';
}
function lcMd(src){
  return String(src).split('```').map((seg,i)=>{
    if(!(i%2))return lcInline(seg);
    const nl=seg.indexOf('\n');const code=(nl>=0?seg.slice(nl+1):seg).replace(/\n$/,'');
    return '<pre class="lc-code"><code>'+esc(code)+'</code></pre>';
  }).join('');
}
function lcMsgEl(m){
  const d=document.createElement('div');d.className='lc-msg '+m.role;d.dataset.id=m.id;
  // 对话内容是用户与模型自己的话,不进界面翻译层;服务给的提示行(notice)照常翻译
  if(m.role!=='notice')d.setAttribute('data-i18n-skip','');
  d.innerHTML=m.role==='notice'
    ?'<span class="lc-note">'+esc(m.text)+'</span>'
    :'<div class="lc-bubble">'+(m.role==='assistant'?lcMd(m.text):esc(m.text))+'</div><div class="lc-meta">'+esc(lcClock(m.ts))+'</div>';
  return d;
}
function lcAppend(list,{scroll=true}={}){
  const box=$('#lcMsgs');if(!box)return;
  const near=box.scrollHeight-box.scrollTop-box.clientHeight<120;
  let added=0;
  for(const m of list){if(!m||lc.ids.has(m.id))continue;lc.ids.add(m.id);lc.msgs.push(m);box.appendChild(lcMsgEl(m));added++;}
  const hint=$('.lc-hello',box);if(hint&&lc.msgs.length)hint.remove();
  if(added&&scroll&&near)box.scrollTop=box.scrollHeight;
}
async function lcLoad(chatId){
  lc.chat=chatId;lc.msgs=[];lc.ids=new Set();lc.unread.delete(chatId);lc.note='';
  const box=$('#lcMsgs');if(box)box.innerHTML='<div class="lc-hello">读取中…</div>';
  lcPaint();
  lc.loading=true;
  try{
    const r=await api('/api/local/history?chatId='+encodeURIComponent(chatId)+'&limit=300');
    if(lc.chat!==chatId)return;
    if(box)box.innerHTML=r.messages.length?'':'<div class="lc-hello">直接说要做什么。它会在上面的项目目录里，用这台电脑上的 Claude Code 或 Codex 处理，结果回到这里。</div>';
    lcAppend(r.messages);lc.toBottom=true;lcStick();
  }catch(e){if(box)box.innerHTML='<div class="lc-hello">读取失败：'+esc(e.message)+'</div>';}
  finally{lc.loading=false;}
}
/* 刚读完一段对话时页签可能还没显示(高度为 0),滚到底要等它真的可见 */
function lcStick(){const box=$('#lcMsgs');if(lc.toBottom&&box&&box.clientHeight>0){box.scrollTop=box.scrollHeight;lc.toBottom=false;}}
async function lcSync(){
  if(!lc.chat||lc.loading)return;
  const chatId=lc.chat,last=lc.msgs.length?lc.msgs[lc.msgs.length-1].id:'';
  try{const r=await api('/api/local/history?chatId='+encodeURIComponent(chatId)+(last?'&after='+encodeURIComponent(last):'')+'&limit=300');
    if(lc.chat===chatId)lcAppend(r.messages);}catch{}
}
/* 服务每写进一行就推一次(SSE local-message);不在看的那段对话记一个未读点 */
function lcReceive(ev){
  if(!ev||!ev.message||!ev.chatId)return;
  if(ev.chatId===lc.chat&&$('#playground').classList.contains('on'))lcAppend([ev.message]);
  else if(ev.chatId===lc.chat)lcAppend([ev.message],{scroll:false});
  else if(ev.message.role!=='user'){lc.unread.add(ev.chatId);lcPaintList();}
}
function lcPaintList(){
  const list=$('#lcList');if(!list)return;
  list.innerHTML=lcChats().map(g=>{const lv=lcLive(g.chatId);
    const st=g.paused?'paused':lv.held?'held':lv.busy?'busy':'idle';
    return `<button type="button" class="lc-item${g.chatId===lc.chat?' on':''}" data-lc="${esc(g.chatId)}"><span class="lc-dot ${st}"></span><span class="lc-nm" data-i18n-skip>${esc(gName(g))}</span><span class="lc-sub" data-i18n-skip>${esc((g.workdir||'').split('/').filter(Boolean).pop()||'')}</span>${lc.unread.has(g.chatId)?'<span class="lc-new" title="有新回复"></span>':''}</button>`;}).join('');
  $$('#lcList .lc-item').forEach(b=>b.onclick=()=>{if(b.dataset.lc!==lc.chat)lcLoad(b.dataset.lc);});
}

  head.innerHTML=`<div class="lc-title"><span class="lc-name" data-i18n-skip>${esc(gName(g))}</span>

    <div class="lc-acts"><button type="button" class="iconbtn sm" id="lcReset" title="忘掉之前聊的，从头开始（要等手头任务结束）" aria-label="新会话">${IC.rotate}</button><button type="button" class="iconbtn sm" id="lcConf" title="模型、权限、项目目录在「群 · 项目」里改" aria-label="设置">${IC.settings}</button></div>`;
  $('#lcReset').onclick=async()=>{try{await api('/api/groups/new','POST',{chatId:g.chatId});toast('已开新会话，之前聊的不再带入','ok');}catch(e){toast(e.message,'err');}};
  $('#lcConf').onclick=()=>{const b=$('[data-tab="groups"]');if(b)b.click();};
  const paused=!!g.paused,held=!!lv.held;
  const input=$('#lcInput'),send=$('#lcSend');
  if(input){input.disabled=paused;input.placeholder=paused?'这段对话已暂停，在「群 · 项目」里恢复后再发':'交代一件事…';}
  if(send)send.disabled=paused||lc.sending;
  if(busy){
    if(held&&S.runtimeCapabilities&&S.runtimeCapabilities.sealHeld){busy.hidden=false;busy.className='lc-busy warn';
      busy.innerHTML=IC.warn+' <span>上一个任务结果不明，这段对话已暂停处理。封存后用新的记录继续，那条消息不再处理。</span>'+(lv.sealError?'<span class="tag bad errtag" title="'+esc(lv.sealError)+'">上次封存没有完成</span>':'')+'<button type="button" class="btn sm primary" id="lcSeal">封存并继续</button>';
      $('#lcSeal').onclick=()=>sealHeldGroup(g.chatId,gName(g)||g.chatId.slice(-8));}
    else if(held){busy.hidden=false;busy.className='lc-busy warn';busy.innerHTML=IC.warn+' <span>上一个任务结果不明，这段对话已暂停处理，等待确认；重启服务后仍如此时，按使用指南封存后继续。</span>';}
    else if(lv.busy||lv.waitingForCapacity){busy.hidden=false;busy.className='lc-busy';
      busy.innerHTML=`<span class="lc-spin" aria-hidden="true"></span><span class="lc-st"><span>${lv.waitingForCapacity&&!lv.busy?'等待空闲名额':(lv.finalizing?'正在收尾':'正在处理')}</span><i>·</i><span id="lcSecs" data-i18n-skip>${esc(lcSecs(lv.sinceMs||0))}</span>${lv.queue?'<i>·</i><span>排队 '+lv.queue+'</span>':''}</span><button type="button" class="iconbtn sm" id="lcStop" title="停止" aria-label="停止">${IC.square}</button>`;
      $('#lcStop').onclick=async()=>{try{const r=await api('/api/groups/stop','POST',{chatId:g.chatId});toast(r.ok?'已请求停止，等待结束确认':'当前没有可停止的运行任务','ok');}catch(e){toast(e.message,'err');}};
      lc.busyAt=Date.now()-(lv.sinceMs||0);}
    else{busy.hidden=true;busy.innerHTML='';}
  }
}
function lcWhere(w){
  if(!w)return '';
  if(w.state==='queued')return '已排队'+(w.ahead?'，前面还有 '+w.ahead+' 条':'');
  if(w.state==='following'||w.state==='joined')return '已加入正在处理的任务';
  if(w.state==='duplicate')return '这句已经提交过，不会重复处理';
  if(w.state==='unconfirmed')return '已记下，但还没确认开始处理；稍后看这里的回复';
  return '';
}
async function lcSend(){
  const input=$('#lcInput');if(!input||lc.sending||!lc.chat)return;
  const text=input.value;if(!text.trim())return;
  // 同一次提交只用一个编号:发送失败后原样再点,落到同一句上,不会变成两句
  if(lc.pendingText!==text){lc.pendingText=text;lc.pendingId=sayRequestId();}
  lc.sending=true;$('#lcSend').disabled=true;
  try{
    const r=await api('/api/local/send','POST',{chatId:lc.chat,text,requestId:lc.pendingId});
    input.value='';lc.pendingText=null;lcGrow();
    const note=lcWhere(r.where);if(note)toast(note,'ok');
  }catch(e){toast(e.message,'err');}
  finally{lc.sending=false;$('#lcSend').disabled=false;await lcSync();const box=$('#lcMsgs');if(box)box.scrollTop=box.scrollHeight;input.focus();}
}
function lcGrow(){const t=$('#lcInput');if(!t)return;t.style.height='auto';t.style.height=Math.min(180,Math.max(36,t.scrollHeight))+'px';}

function renderLocalChat(el){
  // 导航与页头的名字改成「对话」(静态标记里仍是旧版的「试跑」,旧的非持久路径继续用它)
  const nav=$('[data-tab="playground"]');
  if(nav&&!nav.dataset.lc){nav.dataset.lc='1';nav.title='对话 — 在这台电脑上直接和它说话';const sp=$('span',nav);if(sp)sp.textContent='对话';const ic=$('use',nav);if(ic)ic.setAttribute('href','#lu-say');const h=$('.ptitle>[data-for="playground"]');if(h)h.textContent='对话';}
  if(!el.dataset.lc){
    el.dataset.lc='1';
    el.innerHTML=`<div class="lc">
      <aside class="lc-side"><div class="lc-side-h"><span>本机对话</span><button type="button" class="iconbtn sm" id="lcNew" title="新建本机对话" aria-label="新建本机对话">${IC.plus}</button></div><div class="lc-list" id="lcList"></div></aside>
      <section class="lc-main" id="lcMain">
        <div class="lc-head" id="lcHead"></div>
        <div class="lc-msgs" id="lcMsgs" aria-live="polite"></div>
        <div class="lc-busy" id="lcBusy" hidden></div>
        <div class="lc-in"><textarea id="lcInput" rows="1" placeholder="交代一件事…"></textarea><button type="button" class="btn primary ikey" id="lcSend" title="发送" aria-label="发送">${IC.send}</button></div>
        <div class="lc-foot"><span>Enter 发送，Shift+Enter 换行</span><i>·</i><span>发 /help 看可用命令</span><i>·</i><span>对话记录只保存在这台电脑上</span></div>
      </section>
      <section class="lc-none" id="lcNone" hidden><div class="lc-none-in"><div class="lc-none-t">在这台电脑上直接对话</div>
        <div class="hint">不用接入聊天平台。选一个项目目录，它用这台电脑上的 Claude Code 或 Codex 在里面处理你交代的事。</div>
        <button type="button" class="btn primary" id="lcNew2" title="新建本机对话">${IC.plus}<span>新建</span></button></div></section>
    </div>`;
    $('#lcNew').onclick=lcOpenNew;$('#lcNew2').onclick=lcOpenNew;
    $('#lcSend').onclick=lcSend;
    const input=$('#lcInput');
    input.addEventListener('input',lcGrow);
    // 输入法组字时的回车是确认候选词,不是发送
    input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();lcSend();}});
    // 忙时的计时每秒走一格;服务的心跳只隔几秒带一次进度
    //   ——忙闲、排队、暂停一变就重画页头与状态条(心跳只换 S.live,不会重画这一页)
    lc.timer=setInterval(()=>{
      if(!lc.chat||!$('#playground').classList.contains('on'))return;
      const lv=lcLive(lc.chat),g=lcChats().find(x=>x.chatId===lc.chat)||{};
      const sig=[lv.busy,lv.finalizing,lv.waitingForCapacity,lv.queue,lv.held,g.paused,g.permissionMode,g.name].join('|');
      if(sig!==lc.liveSig){lc.liveSig=sig;lcPaint();if(!lv.busy)lcSync();}
      const n=$('#lcSecs');if(n&&lc.busyAt)n.textContent=lcSecs(Date.now()-lc.busyAt);
    },1000);
  }
  const chats=lcChats();
  $('#lcNone').hidden=!!chats.length;$('#lcMain').hidden=!chats.length;$('.lc-side',el).hidden=!chats.length;
  if(!chats.length){lc.chat=null;return;}
  if(!lc.chat||!chats.some(c=>c.chatId===lc.chat))lcLoad(chats[0].chatId);
  else{lcPaint();lcStick();lcSync();}
  lcLandOnce();
}

const SA_PROXY_SCOPE='它会保存为 SintBot 服务的网络代理，不只用于 Slack：其他聊天平台和这台 Mac 上的模型工具也经它访问网络（飞书、企业微信和本机地址直连），服务以后由系统或桌面 App 启动时同样使用。';

 if(px.service){box.innerHTML=`<p class="hint" style="margin:0"><span>服务现在经启动它的终端里设置的代理连接 Slack：</span>${mono(px.service)}<span>；配置里保存的是</span>${mono(px.saved)}<span>，服务由系统或桌面 App 启动时才用它。</span></p>`;return;}

function slackConnText(c){

    finally{btn.disabled=false;btn.innerHTML=IC.steth;}};

function faAutoDirHint(root){return (root?root+'/':'')+(langOf()==='en'?'your-name-sintbot':'你的名字的-sintbot');}
function faPaint(){
  if(!$('#faScan'))return;const j=FA.job,running=!!(j&&j.phase==='running');

  for(const id of ['faWorkdir','faBrowse'])if($('#'+id))$('#'+id).disabled=running;

async function faPoll(){
  if(FA.polling)return;FA.polling=true;
  try{for(let i=0;i<1200&&FA.job&&FA.job.phase==='running';i++){await new Promise(r=>setTimeout(r,2000));try{FA.job=await api('/api/feishu/attach')}catch(e){break}faPaint();}
    if(FA.job&&FA.job.phase==='done'){const done=FA.job;S=await api('/api/state');renderAll();toast('飞书已接入','ok');FA.job=done;}}
  catch(e){toast(e.message,'err')}finally{FA.polling=false;faPaint();}
}

}

function updateTopUpdateBadge(){
  const badge=$('#topUpdateBadge');if(!badge)return;
  const busy=upgManaged()&&upgIsActive(upgJob());
  badge.hidden=!(S&&S.update&&S.update.available||busy||appAvailable());

/* UPGRADE_PROGRESS_BEGIN ── 控制台升级的进度弹窗 ──────────────────────────────────────────
   点「现在升级」→ 页内确认 → 进度弹窗。升级期间每 1.5 秒读一次 GET /api/update;服务切换那几秒
   连不上(或反代回 502)就显示「服务正在重启，页面会自动重连」,不当成错误;重启后旧令牌作废(环回
   免密模式)则交给 checkStaleAuth 整页重载。新版本连上全部群、任务记为 done 后,这一页还是旧版前端
   ⇒ 倒数 3 秒整页刷新,刷新后按 sessionStorage 记下的任务 id 再把结果弹出来一次。
   每一步的状态只从任务记录(state / prefix / installed / steps)推出来,不靠页面记忆。 */
const UPG_PHASES=[
  ['wait','等待所有群空闲'],
  ['install','下载并安装新版本'],
  ['stop','停止旧服务'],
  ['backup','核对群记录并备份数据'],
  ['preflight','新版本预检'],
  ['start','切换并启动新版本'],
  ['connect','等待全部群连上'],
];
function upgIsActive(j){return !!(j&&['queued','installing','switching'].includes(j.state));}
function upgVer(v){return String(v||'').trim().replace(/^v/i,'');}
function upgStep(j,name){const s=((j&&j.steps)||[]).find(x=>x&&x.step===name);return s?(s.ok?'ok':'bad'):'';}
// → [{key,label,state:'done'|'active'|'fail'|'todo'}]:最后一个已到达的步骤之前全算完成,下一步是
//   进行中(任务还在跑)或失败(任务已失败 / 已换回);换回旧版本时多一行「换回 vX」。
function upgPhases(j){
  if(!j)return [];
  const st=j.state, ok=n=>upgStep(j,n)==='ok';
  const reached={
    wait:!!(j.prefix||j.installed)||st==='installing'||st==='switching',
    install:!!j.installed,
    stop:ok('stop service'),
    backup:ok('journals unchanged')&&ok('data backed up'),
    preflight:ok('new version preflight'),
    start:ok('service entry replaced')&&ok('start new version'),
    connect:st==='done',
  };
  let last=-1;UPG_PHASES.forEach(([k],i)=>{if(reached[k])last=i;});
  if(st==='done')last=UPG_PHASES.length-1;
  const active=upgIsActive(j), failed=st==='failed'||st==='rolled-back';
  const out=UPG_PHASES.map(([key,label],i)=>({key,label,
    state:i<=last?'done':i===last+1?(active?'active':failed?'fail':'todo'):'todo'}));
  if(upgStep(j,'rollback')){
    const back=upgStep(j,'previous version started');
    out.push({key:'rollback',label:`换回 v${upgVer(j.from)}`,state:back==='ok'||st==='rolled-back'?'done':back==='bad'||st==='failed'?'fail':'active'});
  }
  return out;
}
// 连不上时是不是在切换:已进入安装 / 已装好 / 已在切换(排队等空闲时服务不会自己重启)
function upgRestarting(j){return !!(j&&(j.state==='switching'||j.state==='installing'||j.installed));}
function upgDur(ms){const s=Math.max(0,Math.round(ms/1000));return s<60?`${s} 秒`:`${Math.floor(s/60)} 分 ${String(s%60).padStart(2,'0')} 秒`;}
/* UPGRADE_PROGRESS_LOGIC_END */
const upg={timer:0,tick:0,polling:false,open:false,view:'',offlineSince:0,waiting:[],reloadAt:0,toasted:''};
const UPG_PAGE_VERSION=upgVer((document.querySelector('.mark .ver')||{}).textContent);
function upgWatchId(){try{return sessionStorage.getItem('sbot-upgrade-watch')||'';}catch{return '';}}
function upgSetWatch(id){try{if(id)sessionStorage.setItem('sbot-upgrade-watch',id);else sessionStorage.removeItem('sbot-upgrade-watch');}catch{}}
// 「在后台继续」收起的任务 id:服务重启后页面会整页重载(环回免密模式换令牌),收起的弹窗不能因此又弹出来
function upgHiddenId(){try{return sessionStorage.getItem('sbot-upgrade-hidden')||'';}catch{return '';}}
function upgSetHidden(id){try{if(id)sessionStorage.setItem('sbot-upgrade-hidden',id);else sessionStorage.removeItem('sbot-upgrade-hidden');}catch{}}
function upgJob(){return (S&&S.update&&S.update.job)||null;}
function upgManaged(){return !!(S&&S.update&&S.update.mode==='managed');}
function upgModalShown(){return !!(upg.open&&upg.view==='progress'&&$('#modalBg').classList.contains('show')&&$('#modal').classList.contains('upg'));}
function upgSchedule(ms=1500){clearTimeout(upg.timer);upg.timer=setTimeout(upgPoll,ms);}
// 由 updateTopUpdateBadge 在每次状态更新时调用:任务在跑就保证轮询在走;这一页发起(或看过)的任务
// 刚结束、页面刚刷新过来 ⇒ 把结果弹出来一次。
function upgEnsureWatch(){
  if(!upgManaged())return;
  const j=upgJob();if(!j)return;
  if(upgIsActive(j)&&!upg.timer&&!upg.polling)upgSchedule(1500);
  if(upg.open||upgWatchId()!==j.id||$('#modalBg').classList.contains('show'))return;
  if(upgHiddenId()!==j.id)upgOpen(false);
  else if(!upgIsActive(j))upgNotifyDone(j);   // 收起过:结束时只发一条提示
}
function upgNotifyDone(j){
  if(!j||upg.toasted===j.id)return;
  upg.toasted=j.id;upgSetWatch('');upgSetHidden('');
  toast(j.message||(j.state==='done'?`已升级到 v${upgVer(j.to)}`:'升级没有完成'),j.state==='done'?'ok':'err');
}
async function upgPoll(){
  upg.timer=0;if(upg.polling)return;upg.polling=true;
  let r=null,data=null;
  try{
    try{r=await fetch('/api/update',{headers:{'X-Sbot-Token':TOKEN},cache:'no-store'});}catch{}
    if(r&&r.status===401){upgRender();checkStaleAuth();return;}  // 重启后令牌作废:整页重载或落到登录框
    if(r&&r.ok){try{data=await r.json();}catch{}}
    if(!data||!data.currentVersion){                            // 断线 / 反代 502 / 服务重启中
      if(!upg.offlineSince)upg.offlineSince=Date.now();
      upgRender();upgSchedule(2000);return;
    }
    const wasOffline=!!upg.offlineSince;upg.offlineSince=0;
    upg.waiting=Array.isArray(data.waitingGroups)?data.waitingGroups:[];
    const {waitingGroups,...update}=data;
    S.update={...(S.update||{}),...update};
    const j=update.job;
    if(upgIsActive(j)){upgRender();updateTopUpdateBadge();upgSchedule(1500);return;}
    upgFinished(j,update,wasOffline);
  }finally{upg.polling=false;}
}
// 任务结束(done / failed / rolled-back):这一页是旧版前端就倒数刷新;弹窗被收起了就只发一条提示。
async function upgFinished(j,update,wasOffline){
  const mine=!!(j&&upgWatchId()===j.id);
  const stale=!!(j&&j.state==='done'&&UPG_PAGE_VERSION&&upgVer(update.currentVersion)!==UPG_PAGE_VERSION);
  if(j&&mine&&stale&&upgModalShown()&&!upg.reloadAt){
    upg.reloadAt=Date.now()+3000;upgRender();updateTopUpdateBadge();setTimeout(()=>location.reload(),3000);return;
  }
  if(j&&mine&&!upgModalShown())upgNotifyDone(j);
  upgRender();
  try{S=await api('/api/state');}catch{}
  appPendingCheck();
  updateTopUpdateBadge();
  if(!busyInteracting()){renderSettings();renderOverview();}
  else if(wasOffline&&!upgModalShown())renderOverview();
}
function upgConfirm(announce,appVersion=''){
  const u=S.update||{};
  $('#modal').className='modal upg';
  $('#modal').innerHTML=`<h3><span class="ask-lamp" aria-hidden="true"></span>${appVersion?'全部更新':`升级到 v${esc(upgVer(u.latestVersion))}`}</h3>
    <div class="upg-sub"><span class="mono">${appVersion?'服务 ':''}v${esc(upgVer(u.currentVersion))} → v${esc(upgVer(u.latestVersion))}</span>${appVersion?` · <span class="mono">App v${esc(APPU.detail.current)} → v${esc(appVersion)}</span>`:''}</div>
    <div class="upg-note">等所有群空闲、记录结清后装到单独的目录，再切换后台服务；切换期间约一分钟不处理新消息，新版本没连上全部群会自动换回。${appVersion?'服务升级成功后再更新 App，App 会自动重新打开；服务升级没成功就不更新 App。':''}</div>
    <div class="hint" style="margin:-6px 0 18px">开始后这里会显示每一步的进度；服务重启时页面会自动重连。</div>
    <div class="upg-btns"><button type="button" class="btn" id="upgCancel">${IC.x}<span>取消</span></button><button type="button" class="btn primary" id="upgGo" title="开始升级">${IC.download}<span>升级</span></button></div>`;
  upg.open=true;upg.view='confirm';
  $('#modalBg').classList.add('show');
  $('#upgCancel').onclick=()=>closeModal();
  $('#upgGo').onclick=async()=>{
    const b=$('#upgGo');b.disabled=true;b.setAttribute('aria-busy','true');b.innerHTML='<span class="spin"></span><span>升级</span>';
    try{
      const r=await api('/api/update/start','POST',{version:u.latestVersion,announce:!!announce});
      S.update={...(S.update||{}),...r};
      appSetPending(appVersion);
      upgSetWatch(r.job&&r.job.id);upg.reloadAt=0;
      upgOpen(true);updateTopUpdateBadge();upgSchedule(600);
    }catch(e){
      if(e.payload&&e.payload.update)S.update={...(S.update||{}),...e.payload.update};
      toast(e.message,'err');b.disabled=false;b.removeAttribute('aria-busy');b.innerHTML=IC.download+'<span>升级</span>';
    }
  };
}
// 打开进度 / 结果弹窗。user=true:用户点的(「查看进度」、版本徽章旁的图标、刚确认),记下任务 id 以便刷新后接着看。
function upgOpen(user){
  const j=upgJob();if(!j)return;
  if(user){upgSetWatch(j.id);upgSetHidden('');}
  $('#modal').className='modal upg';
  upg.open=true;upg.view='progress';
  $('#modalBg').classList.add('show');
  upgRender();
  clearInterval(upg.tick);upg.tick=setInterval(()=>{if(!upgModalShown()){clearInterval(upg.tick);upg.tick=0;return;}upgRender();},1000);
  if(upgIsActive(j)&&!upg.timer&&!upg.polling)upgSchedule(300);
}
// 弹窗被关掉(按钮、点遮罩、别的弹窗):升级照常进行,版本徽章旁的图标保持转圈,结束时只发提示
function upgOnClose(){
  if(!upg.open)return;
  const wasProgress=upg.view==='progress';
  upg.open=false;upg.view='';clearInterval(upg.tick);upg.tick=0;
  const j=upgJob();
  if(wasProgress&&upgIsActive(j))upgSetHidden(j.id);
  else if(wasProgress&&j&&upgWatchId()===j.id){upgSetWatch('');upgSetHidden('');}
  // 结果看完了:设置页那张卡在弹窗开着时没重画,这里补一次
  if(wasProgress&&!upgIsActive(j))setTimeout(()=>{if(!busyInteracting()){renderSettings();renderOverview();}},0);
}
function upgRender(){
  const j=upgJob(), statusBox=$('#updateStatus');
  if(statusBox&&j&&upgManaged()&&upgIsActive(j)){
    const text=upg.offlineSince?(upgRestarting(j)?'服务正在重启，页面会自动重连…':'暂时连不上服务，正在重试…')
      :j.state==='switching'&&upgStep(j,'start new version')==='ok'?'新版本已启动，正在等全部群连上…':(j.message||j.state);
    statusBox.innerHTML=`<span class="spin"></span><span>${esc(text)}</span>`;
  }
  if(!upgModalShown()||!j)return;
  // 安装一结束,切换进程不到一秒就停掉旧服务:页面最后看到的多半还是「安装中」。这时连不上 = 正在切换
  const view=upg.offlineSince&&upgRestarting(j)&&j.state!=='switching'?{...j,state:'switching',installed:true}:j;
  const active=upgIsActive(view), st=view.state, phases=upgPhases(view);
  const end=active?Date.now():(+j.finishedAt||+j.updatedAt||Date.now());
  const took=upgDur(end-(+j.createdAt||end));
  const doneN=phases.filter(p=>p.key!=='rollback'&&p.state==='done').length;
  const pct=st==='done'?100:Math.max(4,Math.round(doneN/UPG_PHASES.length*100));
  const to=esc(upgVer(j.to)), from=esc(upgVer(j.from));

  const icon=p=>p.state==='done'?'✓':p.state==='fail'?'!':p.state==='active'?'<span class="spin"></span>':'';
  const btns=active?`<button type="button" class="btn" id="upgHide" title="在后台继续">${IC.chevronDown}<span>后台继续</span></button>`
    :st==='done'&&upg.reloadAt?`<button type="button" class="btn primary" id="upgReload" title="现在刷新">${IC.refresh}<span>刷新</span></button>`
    :st==='done'?`<button type="button" class="btn primary" id="upgDone" title="完成">${IC.check}<span>完成</span></button>`
    :`<button type="button" class="btn" id="upgDone" title="关闭">${IC.x}<span>关闭</span></button>`;
  $('#modal').innerHTML=`<h3>${head}</h3>
    <div class="upg-sub"><span class="mono">v${from} → v${to}</span><span>${active?`已用 ${took}`:`用时 ${took}`}</span></div>
    <div class="upg-bar ${active?'run':st==='done'?'ok':'fail'}"><i style="width:${pct}%"></i></div>
    <ol class="upg-steps">${phases.map(p=>`<li class="${p.state}"><span class="dot">${icon(p)}</span><span>${esc(p.label)}</span></li>`).join('')}</ol>
    <div class="upg-note ${noteCls}">${esc(note)}</div>
    <div class="upg-btns">${btns}</div>`;
  const hide=$('#upgHide');if(hide)hide.onclick=()=>closeModal();
  const done=$('#upgDone');if(done)done.onclick=()=>closeModal();
  const rl=$('#upgReload');if(rl)rl.onclick=()=>location.reload();
}

  ["应用级令牌无效或已撤销：到 Basic Information → App-Level Tokens 重新生成一枚，权限选 connections:write。", "The app-level token is invalid or revoked. Generate a new one under Basic Information → App-Level Tokens with the connections:write scope."],

  ["两枚令牌来自不同的 Slack 应用。请从同一个应用的设置页复制应用级令牌和 Bot Token。", "The two tokens belong to different Slack apps. Copy the app-level token and the bot token from the same app."],

  ["在打开的 Slack 页面里选择工作区，点 Next，再点 Create。需要你有在该工作区安装应用的权限；没有的话可以先新建一个免费工作区。", "On the Slack page that opened, pick a workspace, choose Next, then Create. You need permission to install apps there; if you do not have it, create a free workspace first."],

  ["在 Slack 里给机器人发一句话（私聊，或在已邀请它的频道里 @它）即可完成接入。", "Send the bot any message in Slack (a direct message, or @mention it in a channel it has been invited to) to finish."],

  ["这里只列出机器人已加入的频道。先在 Slack 的目标频道里发 /invite @机器人名，再刷新。", "Only channels the bot has joined are listed. In the Slack channel you want, send /invite @your-bot-name, then refresh."],

  ["声明为 Slack Agent（显示原生“Working…”状态；不可撤销：工作区访客不能使用，私信都会变成线程）", "Declare it as a Slack Agent (shows Slack’s own “Working…” status; cannot be undone: workspace guests cannot use the app, and every direct message becomes a thread)"],
  ["服务经配置里保存的代理连接 Slack：", "The service reaches Slack through the proxy saved in the configuration:"],
  ["服务现在经启动它的终端里设置的代理连接 Slack：", "The service now reaches Slack through the proxy set in the terminal that started it:"],
  ["；配置里保存的是", "; the configuration has"],

  ["配置里保存的代理", "The proxy saved in the configuration"],
  ["服务现在用不上（只支持 http:// 代理），连接 Slack 时直连。", "cannot be used by the service (only http:// proxies work), so it reaches Slack directly."],
  ["把服务正在用的代理一起保存：", "Also save the proxy the service is using now:"],
  ["它会保存为 SintBot 服务的网络代理，不只用于 Slack：其他聊天平台和这台 Mac 上的模型工具也经它访问网络（飞书、企业微信和本机地址直连），服务以后由系统或桌面 App 启动时同样使用。", "It is saved as the SintBot service’s network proxy, not only for Slack: other chat platforms and the model tools on this Mac also reach the network through it (Feishu, WeCom and local addresses go direct), including when the system or the desktop app starts the service later."],
  ["没有连上 Slack。服务正经代理连接，请确认代理软件在运行、地址和端口没有变。", "Slack could not be reached. The service connects through a proxy: check that the proxy app is running and its address and port have not changed."],
  ["没有连上 Slack。这台 Mac 要经代理访问 Slack 时，服务也要带着代理启动：按 Slack 接入指南「排查」一节设置代理，重启服务后再来添加。", "Slack could not be reached. If this Mac needs a proxy to reach Slack, the service must be started with one: set the proxy as described under Troubleshooting in the Slack setup guide, restart the service, then add Slack again."],
  ["已创建群项目，但机器人看不到这个私聊，使用指引发不出去。只能绑定和机器人本身的私聊：在 Slack 里打开机器人、给它发一句话，再绑定那个私聊。", "Group project created, but the bot cannot see this direct message, so the usage guide could not be posted. Only a direct message with the bot itself can be bound: open the bot in Slack, send it a message, then bind that conversation."],
  ["群里那行「【管理员】…」没能确认发出(失败或超时),插话未执行;即使群里随后出现这行,它也不会被处理。Slack 私聊里发不出时，先确认这是和机器人本身的私聊", "The “[Admin] …” line could not be confirmed in the group (failed or timed out), so nothing was injected. Even if the line shows up later, it will not be processed. When nothing can be posted in a Slack direct message, first check that it is a conversation with the bot itself."],
  ["代理地址里的 *** 只代表原来那个代理的用户名和密码；换了代理地址，请重新填写用户名和密码。", "The *** in the proxy address stands only for the saved proxy’s user name and password. For a different proxy address, enter its user name and password again."],
  ["已创建群项目，但机器人还不在这个频道里，使用指引发不出去（私有频道会显示为找不到频道）。先在 Slack 的这个频道里发 /invite @机器人名 把它请进来，再 @它 派单。", "Group project created, but the bot is not in this channel yet, so the usage guide could not be posted (a private channel shows as not found). In that Slack channel, send /invite @your-bot-name first, then @mention it with a task."],
  ["群里那行「【管理员】…」没能确认发出(失败或超时),插话未执行;即使群里随后出现这行,它也不会被处理", "The “[Admin] …” line could not be confirmed in the group (failed or timed out), so nothing was injected. Even if the line shows up later, it will not be processed."],
  ["群里那行「【管理员】…」没能确认发出(失败或超时),插话未执行;即使群里随后出现这行,它也不会被处理。Slack 频道里发不出时，先确认机器人已在这个频道里：没有的话在频道里发 /invite @机器人名", "The “[Admin] …” line could not be confirmed in the group (failed or timed out), so nothing was injected. Even if the line shows up later, it will not be processed. When nothing can be posted in a Slack channel, first check that the bot is in it; if not, send /invite @your-bot-name in that channel."],
  ["代理地址要以 http:// 开头，例如 http://127.0.0.1:7890", "The proxy address must start with http://, for example http://127.0.0.1:7890."],

  ["正在处理任务", "Task in progress"],

  ["封存并继续", "Seal and continue"],
  ["上次封存没有完成", "The last seal did not complete"],
  ["上一个任务的结果无法确认，下面的群已暂停处理，其他群照常。封存后原记录原样存档，那条消息不再处理，群用新的记录继续；管理员也可以在群里发 /resume。", "The outcome of the last task cannot be confirmed, so these groups are on hold; the others carry on. Sealing archives the record unchanged and that message is not processed again; the group continues with a new record. An admin can also send /resume in the group."],
  ["上一个任务的结果无法确认，下面的群已暂停处理，其他群照常。先重启服务，能自动收尾的会恢复；仍需处理时，按使用指南在终端封存。", "The outcome of the last task cannot be confirmed, so these groups are on hold; the others carry on. Restart the service first: groups that can finish on their own recover. If one still needs attention, seal it from a terminal as described in the usage guide."],
  ["上一个任务结果不明，这段对话已暂停处理。封存后用新的记录继续，那条消息不再处理。", "The last task's outcome is unknown, so this conversation is on hold. Sealing continues it with a new record; that message is not processed again."],
  ["已封存，本群已恢复", "Sealed; the group is back"],

  ["只有后台托管运行时才能在这里封存；请停止服务后按使用指南在终端处理", "Sealing here needs the background service; stop the service and follow the usage guide in a terminal"],
  ["卡片右上角的键可以插话、开新会话、暂停或恢复、停止；点卡片打开设置，修改后端、型号、思考深度、项目目录、权限、数据输出和忙时跟进，该群须没有进行中的任务和未结记录。换后端或项目会开始新的一段对话，换型号或调深度接着当前对话。群里发 /model 也能改。移除群项目、解散飞书群在设置面板的最后一节；暂停或出故障的群也能移除，它的记录归档保留、不会重发。", "Use the keys at the top right of a card to send a message, start a new session, pause or resume, and stop. Click a card to open its settings and change the backend, model, thinking depth, project folder, permissions, data output and busy follow-up; the group must have no task in progress and no unsettled records. Changing the backend or project starts a new conversation; changing the model or depth continues the current one. You can also change it with /model in the group. Removing a group project and disbanding a Feishu group are in the last section of the settings panel; a paused or faulted group can be removed too, and its records are archived and never resent."],
  ["当前支持飞书文字消息、忙时跟进、任务回复和停止；服务开放定时任务后，在本卡「定时任务」一行创建和管理。生图、群消息管理、画布与预览暂未接入。", "Feishu text messages, busy-turn followups, task replies and stopping are supported; once the service offers scheduled tasks, create and manage them in the \"Scheduled tasks\" row of this card. Image generation, group message management, canvas and previews are unavailable."],
  ["到点让模型处理任务、直接运行命令或发消息。在这里创建、修改、暂停和删除；这一版还不能在群里让模型创建定时任务。", "When due, hand a task to the model, run a command directly, or send a message. Create, edit, pause and delete them here; in this version the model cannot create scheduled tasks from the chat yet."],
  ["到点让模型处理任务、运行命令或发消息", "A model task, a command or a message, when due"],
  ["这些是旧版定时任务定义，当前服务不执行，仅供查看。", "These are scheduled task definitions from the earlier version. This service does not run them; they are shown for reference only."],
  ["画布创建、同步与反馈暂未接入；已有链接仅供查看。", "Canvas creation, sync and feedback are unavailable. Existing links are view-only."],
  ["只有本群任务结束并完成结账后才能暂停；暂停后不接收本群新消息，配置与会话保留。", "Pause is available only after this group's tasks and receipts are settled. Paused groups receive no new messages; configuration and sessions are retained."],
  ["已暂停：不接收本群新消息，配置与会话保留。", "Paused: no new group messages are accepted; configuration and sessions are retained."],
  ["恢复本群：重新接收本群消息，配置与会话保留。", "Resume this group: its messages are accepted again; configuration and sessions are retained."],
  ["恢复", "Resume"],
  ["Codex 与 Claude Code 默认开启忙时跟进；长命令执行期间的补充会在工具步骤之间读取。只有确认模型已读取才显示已加入；不支持此能力时排队。控制台插话同样支持忙时跟进；关闭或暂不支持时排队。", "Busy-turn followups are on by default for Codex and Claude Code. Followups are read between tool steps; a long command must finish first. Joined means the model has read the message. Unsupported clients queue followups. Console messages also support busy-turn followups, or queue when followups are disabled or unavailable."],
  ["当前版本未接入预览服务。", "Preview services are unavailable in this version."],
  ["当前可查看模型配置与登录状态；各群的模型在「群·项目」里切换。添加或修改模型暂不可用。", "Model configuration and login status are shown here. Switch each group's model under Groups. Adding or changing models is unavailable."],
  ["可添加模型，修改端点、密钥、上下文与压缩，测试、隐藏或拖动排序；型号与思考深度按群在「群·项目」里选（第三方端点的型号在这里填）。改后端或端点时，用它的群须空闲，并会开始新的一段对话；默认模型和群正在用的模型不能隐藏。移除模型暂不可用。", "Add models; change their endpoint, key, context and compaction; test, hide or drag to reorder them. Model and thinking depth are chosen per group under Groups (a third-party endpoint's model is set here). Changing a backend or endpoint needs the groups using it to be idle and starts a new conversation for them. The default model and models in use by a group cannot be hidden. Removing models is unavailable."],

  ["只安装检测到的稳定版本：等所有群空闲、记录结清后装到单独的目录，再切换后台服务；新版本没在 90 秒内连上全部群会自动换回。旧版本保留用于回滚，不提权。","Installs only the detected stable version: once every group is idle and settled, it goes into its own folder and the background service switches to it; if the new version does not connect every group within 90 seconds, the previous one is restored. The previous version is kept for rollback. No elevated privileges."],
  ["前台运行不能在控制台升级：在运行 SintBot 的终端按 Ctrl-C 等待退出，重新运行一行安装命令 curl -fsSL https://sintbot.com/install.sh | bash，再用原来的启动命令启动。","A foreground run cannot upgrade from the console: press Ctrl-C in the terminal running SintBot and wait for it to exit, rerun the one-line installer curl -fsSL https://sintbot.com/install.sh | bash, then start with your usual command."],

/* 群 / 对话的显示名。本机对话默认名「本机对话」(存进配置的规范值)按界面语言显示成 Local chat;人改过的名字原样显示。 */

const I18N_SEP=' · ';   // 界面里把可变片段拼成一句的分隔符(与源码里那些模板一致)

function trSeg(k){

   都不中返回原串。
   ⚠ 拆段兜底是必须的:连接健康度、插件摘要、风格证据行这些是把可变片段用「 · 」拼成**一个**
   文本节点的,组合数几十上百种,穷举不了 —— 整串不中就逐段查,有一段命中就按原分隔符拼回去

/* 记「中文原值」时的自愈:界面里有一批节点是**镜像**(自绘下拉的标签抄选项文字、按钮跑完把

   切回中文就再也回不去了 ⇒ 没有中日韩字符且反查表里有,就补回中文当原值。 */

const _i18nT=new WeakMap(), _i18nA=new WeakMap();

/* 页面每次重渲染(SSE 心跳 / 切页 / 弹窗)都走这里补译。自触发防护:我们自己写进去的值记在

  const feishuBtn=FEISHU_LOGIN?`<a id="loginFeishu" href="/api/auth/feishu/start" style="${btnCss};background:var(--primary-bg);color:var(--primary-ink)">用飞书登录</a>
    <div style="font-size:12px;color:var(--faint);margin:8px 2px 0">只有管理员名单里的人能进</div>`:'';
  const divider=(FEISHU_LOGIN&&showPw)?`<div style="display:flex;align-items:center;gap:8px;margin:14px 0 10px;color:var(--faint);font-size:11px"><span style="flex:1;height:1px;background:var(--line-hi)"></span>或用密码<span style="flex:1;height:1px;background:var(--line-hi)"></span></div>`:'';
  const pwForm=showPw?`<input id="loginPw" type="password" autocomplete="current-password" placeholder="密码"/>
    <div id="loginErr" style="color:var(--fail);font-size:12px;min-height:15px;margin:7px 2px 0"></div>
    <button type="submit" style="${btnCss};margin-top:6px;${FEISHU_LOGIN?'background:var(--ctl-bg);color:var(--ink);border:1px solid var(--ctl-line);line-height:30px':'background:var(--primary-bg);color:var(--primary-ink)'}">登录</button>`:'';
  bg.innerHTML=`<form id="loginForm" style="background:var(--modal-bg);border:1px solid var(--line);padding:24px;border-radius:8px;width:min(340px,90vw);box-shadow:var(--sh-lg)">
    <div style="font-size:15px;font-weight:600;color:var(--ink)">SintBot 控制台</div>
    <div style="font-size:12px;color:var(--faint);margin:4px 0 16px">${FEISHU_LOGIN?'用你的飞书账号登录':'请输入访问密码'}</div>
    ${feishuBtn}${divider}${pwForm}</form>`;
  document.body.appendChild(bg);
  const form=$('#loginForm');
  if(!showPw){form.onsubmit=e=>e.preventDefault();return;}
  const pw=$('#loginPw');if(!FEISHU_LOGIN)pw.focus();
  form.onsubmit=async(e)=>{e.preventDefault();const errEl=$('#loginErr');errEl.textContent='';
    try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw.value})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok||!j.token){errEl.textContent=(r.status===403&&!privateHost)?'公网入口只支持飞书登录,请管理员先在「设置 → 飞书应用」填公网地址':(j.error||('登录失败 (HTTP '+r.status+')'));pw.select();return;}
      TOKEN=j.token;try{localStorage.setItem('sbot-token',TOKEN);sessionStorage.setItem('sbot-token',TOKEN);}catch{}bg.remove();boot();
    }catch(err){errEl.textContent='网络错误';}};
}

if(TOKEN)boot();else showLogin();
</script>
</body>
</html>
